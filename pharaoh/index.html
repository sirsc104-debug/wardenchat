<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sands of the Pharaoh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Your town"></canvas>

  <!-- Village HUD -->
  <header id="hud" class="hud">
    <div class="hud-left">
      <button class="profile" id="btn-profile" aria-label="Profile">
        <span class="ph-badge" id="hud-ph">1</span>
        <span class="profile-text"><b id="hud-name">Pharaoh</b><small><i class="ico trophy sm"></i> <span id="hud-trophies">0</span> · <span id="hud-league">Unranked</span></small></span>
      </button>
      <div class="builders" id="hud-builders" title="Free builders"><span class="hammer"></span><b id="hud-builders-n">2/2</b></div>
    </div>
    <div class="hud-res">
      <div class="res gold"><i class="ico gold"></i><div class="bar"><span id="bar-gold"></span></div><b id="hud-gold">0</b><small id="cap-gold">Max 1,000</small></div>
      <div class="res goop"><i class="ico goop"></i><div class="bar"><span id="bar-goop"></span></div><b id="hud-goop">0</b><small id="cap-goop">Max 1,000</small></div>
      <div class="res gems"><i class="ico gems"></i><b id="hud-gems">0</b></div>
    </div>
  </header>
  <div id="goal" class="goal" hidden></div>

  <nav id="dock" class="dock">
    <button class="dock-btn attack" id="btn-attack"><i class="di sword"></i><span>Attack!</span></button>
    <div class="dock-group">
      <button class="dock-btn" id="btn-shop"><i class="di shop"></i><span>Shop</span></button>
      <button class="dock-btn" id="btn-army"><i class="di army"></i><span>Army</span></button>
      <button class="dock-btn" id="btn-temple"><i class="di temple"></i><span>Temple</span></button>
      <button class="dock-btn" id="btn-friends"><i class="di friends"></i><span>Friends</span></button>
      <button class="dock-btn" id="btn-log"><i class="di log"></i><span>Raids</span><em class="badge" id="log-badge" hidden>0</em></button>
      <button class="dock-btn" id="btn-ach"><i class="di ach"></i><span>Goals</span><em class="badge" id="ach-badge" hidden>0</em></button>
      <button class="dock-btn" id="btn-settings"><i class="di cog"></i><span>Options</span></button>
    </div>
  </nav>

  <!-- Selected building -->
  <section id="sel" class="sel" hidden>
    <div class="sel-title"><b id="sel-name"></b><span id="sel-level"></span></div>
    <div class="sel-actions" id="sel-actions"></div>
  </section>

  <!-- Placement controls -->
  <div id="placebar" class="placebar" hidden>
    <span id="place-hint">Drag to move, then confirm.</span>
    <button class="round ok" id="place-ok" aria-label="Place here">✓</button>
    <button class="round no" id="place-no" aria-label="Cancel">✕</button>
  </div>

  <!-- Battle HUD -->
  <div id="bhud" class="bhud" hidden>
    <div class="b-top">
      <div class="b-enemy">
        <b id="b-name">Rival</b><small id="b-sub"></small>
        <div class="b-loot"><span class="lt"><i class="ico gold sm"></i><b id="b-lgold">0</b></span><span class="lt"><i class="ico goop sm"></i><b id="b-lgoop">0</b></span><span class="lt" id="b-lgems-wrap"><i class="ico gems sm"></i><b id="b-lgems">0</b></span></div>
        <small class="b-stolen" id="b-stolen"></small>
      </div>
      <div class="b-timer"><small id="b-phase">Scout</small><b id="b-time">3:00</b></div>
      <div class="b-score"><div class="stars" id="b-stars"><i></i><i></i><i></i></div><b id="b-pct">0%</b></div>
    </div>
    <div class="b-bottom">
      <div class="b-buttons">
        <button class="btn red" id="b-end">End battle</button>
        <button class="btn gold" id="b-next" hidden>Next <i class="ico gold sm"></i><span id="b-next-cost">0</span></button>
        <button class="btn" id="b-speed" hidden>Speed 1×</button>
      </div>
      <div class="cards" id="b-cards"></div>
    </div>
  </div>

  <div id="toast" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="flash" class="flash"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/battle.js"></script>
<script src="js/basegen.js"></script>
<script src="js/state.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/net.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
