    const ng = ctx.createLinearGradient(-26, 0, 26, 0);
    ng.addColorStop(0, '#4a5060'); ng.addColorStop(0.5, '#9aa2b4'); ng.addColorStop(1, '#3e4352');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.moveTo(-18, -18); ctx.lineTo(18, -18); ctx.lineTo(25, 0); ctx.lineTo(-25, 0); ctx.closePath(); ctx.fill();
    // body, with the red nose cone and stripes
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-31, -16); ctx.lineTo(-35, -110);
    ctx.quadraticCurveTo(-35, -165, 0, -200); ctx.quadraticCurveTo(35, -165, 35, -110);
    ctx.lineTo(31, -16); ctx.closePath();
    const bg = ctx.createLinearGradient(-35, 0, 35, 0);
    bg.addColorStop(0, '#b9c1d4'); bg.addColorStop(0.35, '#ffffff'); bg.addColorStop(1, '#a7b0c4');
    ctx.fillStyle = bg; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#e8364f'; ctx.fillRect(-40, -210, 80, 62);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-20, -210, 10, 62);
    ctx.fillStyle = '#e8364f'; ctx.fillRect(-40, -46, 80, 10);
    ctx.fillStyle = '#2a3350'; ctx.fillRect(-40, -34, 80, 4);
    ctx.restore();
    // window and its little pilot, waving hello
    ctx.fillStyle = '#7b8499'; ctx.beginPath(); ctx.arc(0, -105, 19, 0, TAU); ctx.fill();
    const wg = ctx.createRadialGradient(-5, -110, 2, 0, -105, 15);
    wg.addColorStop(0, '#7fd3ff'); wg.addColorStop(1, '#173a8a');
    ctx.fillStyle = wg; ctx.beginPath(); ctx.arc(0, -105, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd7a8'; ctx.beginPath(); ctx.arc(0, -101, 6.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-2.3, -102, 1.1, 0, TAU); ctx.arc(2.3, -102, 1.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, -100.5, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(-6, -112, 4, 2.5, -0.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c62a42'; ctx.fillRect(-4, -60, 8, 66);
  }

  // It shows up rarely on its own (and the game sends it when you hit a 10 streak).
  let egg = null, eggWait = rand(40, 90);
  function launchEgg() {
    if (egg) return;
    // it launches up through the open sky on the left, where the matchup panel doesn't cover it
    // (and to one side of the balloon, so its smoke trail doesn't cross it)
    const right = Math.min(540, W * 0.33);
    const x = Math.random() < 0.5 ? rand(50, Math.max(60, BX - 160)) : rand(Math.min(right - 10, BX + 160), right);
    egg = { x, y: H + 60, vx: (x < BX ? 1 : -1) * rand(20, 90), vy: -rand(330, 420), s: rand(0.4, 0.5), trail: 0 };
  }
  function drawEgg(dt) {
    eggWait -= dt;
    if (eggWait <= 0) { eggWait = rand(70, 160); if (Math.random() < 0.45) launchEgg(); }
    if (!egg) return;
    egg.x += egg.vx * dt; egg.y += egg.vy * dt;
    const ang = Math.atan2(egg.vy, egg.vx) + Math.PI / 2;    // the nose points along its path
    egg.trail += dt;
    while (egg.trail > 0.03) {
      egg.trail -= 0.03;
      fx.push({ kind: 'puff', x: egg.x - Math.sin(ang) * -6, y: egg.y + Math.cos(ang) * 6, vx: rand(-15, 15), vy: rand(-15, 15), life: 1.2, max: 1.2, r: rand(5, 9) * egg.s * 2 });
    }
    ctx.save(); ctx.translate(egg.x, egg.y); ctx.rotate(ang); ctx.scale(egg.s, egg.s);
    brainRocket();
    ctx.restore();
    if (egg.x < -300 || egg.x > W + 300 || egg.y < -400) egg = null;
  }

  function drawDecor() {
    const top = st.cam + (BASE + 200), bot = st.cam - (H - BASE) - 200;
    const L = visL(), R = visR();
    drawMarks();
    // two passes: the tall things that rise from below go behind everything else
    for (const tall of [true, false]) for (let ci = Math.max(1, Math.floor(bot / CHUNK)); ci <= Math.floor((top + 700) / CHUNK); ci++) {
      for (const o of chunk(ci)) {
        if (TALL.has(o.type) !== tall) continue;
        const y = sy(o.w);
        if (y > H + 200) continue;
        if (tall ? y + 700 < 0 : y < -200) continue;
        const x0 = o.local ? L + o.fx * (R - L) : o.fx * W;
        const x = o.local ? wrapIn(x0 + o.vx * st.t, -200, R + 240) : wrapX(x0 + o.vx * st.t);
        const dir = o.vx > 0 ? 1 : -1;
        switch (o.type) {
          case 'cloud': cloud(x, y, o.s); break;
          case 'birds': birds(x, y, o.s, 3 + Math.floor(o.seed) % 3, o.seed); break;
          case 'geese': birds(x, y, o.s * 0.8, 7, o.seed); break;
          case 'kite': kite(x, y, o.s, o.hue, o.seed); break;
          case 'balloon': smallBalloon(x, y, o.s, o.hue); break;
          case 'blimp': blimp(x, y, o.s, dir); break;
          case 'jet': plane(o.local ? wrapIn(x0 + o.vx * 3 * st.t, -500, R + 600) : wrapX(x0 + o.vx * 3 * st.t, 600), y, o.s, dir || 1, true); break;
          case 'fighter': {
            const fxp = o.local ? wrapIn(x0 + 130 * (dir || 1) * st.t, -400, R + 500) : wrapX(x0 + 130 * (dir || 1) * st.t, 500);
            fighter(fxp, y, o.s * 0.9, dir || 1); fighter(fxp - 60 * (dir || 1), y + 30 * o.s, o.s * 0.9, dir || 1); break;
          }
          case 'wisp': wisp(x, y, o.s); break;
          case 'wballoon': wballoon(x, y, o.s); break;
          case 'meteor': meteor(wrapX(x0 + st.t * 220 + o.seed), y + ((st.t * 110 + o.seed) % 300), o.s); break;
          case 'sat': sat(x, y, o.s); break;
          case 'island': island(x, y, o.s, o.seed); break;
          case 'storm': storm(x, y, o.s, o.seed); break;
          case 'aurora': aurora(x0, y, o.s * 1.2, o.seed); break;
          case 'butterfly': butterfly(x, y, o.s, o.hue, o.seed); break;
          case 'leaf': fallingLeaf(x, y + ((st.t * 30 + o.seed) % 160), o.s, o.seed); break;
          case 'fog': fogBand(y, o.s, o.seed); break;
          case 'spire': spire(x, y, o.s, o.seed); break;
          case 'eagle': eagle(x, y, o.s, dir || 1, o.seed); break;
          case 'peak': peak(x, y, o.s, o.seed); break;
          case 'planet': planet(x, y, o.s, o.hue, o.seed); break;
          case 'castletop': castletop(x, y, o.s, o.seed); break;
          case 'cliff': cliff(x, y, o.s, o.seed); break;
          case 'sheep': sheep(x, y, o.s, dir || 1, o.seed); break;
          case 'swirl': swirl(x, y, o.s, o.seed); break;
          case 'crystal': crystal(x, y, o.s, o.hue, o.seed); break;
          case 'minidragon': miniDragon(x, y, o.s, dir || 1); break;
          case 'constellation': constellation(x, y, o.s, o.seed); break;
          case 'canopy': canopy(x, y, o.s, o.seed); break;
          case 'firefly': fireflies(x, y, o.s, o.seed); break;
          case 'snow': snow(x, y, o.s, o.seed); break;
        }
      }
    }
  }

  // ---- Landmarks: one big thing drawn in the middle of its location ---------------------------
  const markW = z => z * ZPX + ZOFF + ZPX * 0.66;
  function drawMarks() {
    const z0 = zoneOfW(st.cam - 2000), z1 = zoneOfW(st.cam + 2600);
    for (let z = z0; z <= Math.min(z1, 19); z++) {
      const m = MAPS[world].stops[z].mark;
      if (!m) continue;
      const y = sy(markW(z));
      const x = visL() + (visR() - visL()) * 0.72;
      if (y < -700 || y > H + 1800) continue;
      switch (m) {
        case 'burj': burj(x + 30, y); break;
        case 'rainbow': rainbowArc(x - 140, y + 260, 360); break;
        case 'everest': everest(x - 40, y); break;
        case 'iss': iss(x - 60, y); break;
        case 'skycastle': skyCastle(x - 40, y, 1.6); break;
        case 'moon': bigMoon(x, y, 110, '#fff4cf'); break;
        case 'bigmoon': bigMoon(x - 30, y, 250, '#fff6dc'); break;
        case 'bigstar': bigStar(x - 40, y); break;
      }
    }
  }

  // ---- The sky things for each location ---------------------------------------------------
  // The tall things fade out into the haze below them, so a peak above you never walls off the sky.
  const rgbaOf = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
  function fadeDown(col, y, len) {
    const g = ctx.createLinearGradient(0, y, 0, y + len);
    g.addColorStop(0, rgbaOf(col, 1)); g.addColorStop(0.5, rgbaOf(col, 1)); g.addColorStop(1, rgbaOf(col, 0));
    return g;
  }
  // Skyscraper tops, rising from below the picture; (x, y) is the roof
  function spire(x, y, s, seed) {
    const w = (64 + (seed % 46)) * s, k = Math.floor(seed) % 3;
    const col = ['#6d7fae', '#7b8cbc', '#5f7099'][k];
    const len = 560;
    ctx.fillStyle = fadeDown(col, y, len); ctx.fillRect(x - w / 2, y, w, len);
    ctx.fillStyle = fadeDown('#ffffff', y, len); ctx.globalAlpha = 0.12; ctx.fillRect(x - w / 2, y, w * 0.28, len); ctx.globalAlpha = 1;
    ctx.fillStyle = col; ctx.fillRect(x - w * 0.32, y - 26 * s, w * 0.64, 26 * s);
    ctx.fillStyle = '#c9d2e3'; ctx.fillRect(x - 2, y - 96 * s, 4, 70 * s);
    if (Math.sin(st.t * 3 + seed) > 0) { ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(x, y - 98 * s, 5, 0, TAU); ctx.fill(); }
    const y0 = y + 14 + Math.max(0, Math.ceil((-40 - y - 14) / 22)) * 22;
    for (let yy = y0; yy < Math.min(H + 20, y + len * 0.9); yy += 22) {
      ctx.fillStyle = `rgba(255,240,170,${0.6 * (1 - (yy - y) / (len * 0.9))})`;
      for (let i = 0, xx = x - w / 2 + 8; xx < x + w / 2 - 10; xx += 14, i++) if ((i * 7 + Math.round((yy - y) / 22) * 3 + Math.floor(seed)) % 5 < 2) ctx.fillRect(xx, yy, 6, 9);
    }
  }
  // The Burj Khalifa: setbacks narrowing up to its long spire
  function burj(x, y) {
    const steps = [[0, 3], [190, 9], [300, 16], [430, 26], [580, 38], [760, 52], [960, 68], [1200, 86], [1500, 104], [2400, 120]];
    ctx.fillStyle = '#b9c7de';
    ctx.beginPath(); ctx.moveTo(x, y - 20);
    for (const [dy, hw] of steps) { ctx.lineTo(x + hw, y + dy); ctx.lineTo(x + hw, y + dy + 30); }
    for (let i = steps.length - 1; i >= 0; i--) { const [dy, hw] = steps[i]; ctx.lineTo(x - hw, y + dy + 30); ctx.lineTo(x - hw, y + dy); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(70,90,140,0.25)'; ctx.fillRect(x, y + 190, 140, 2400);   // the shaded side
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); for (let dy = 220; dy < 2400; dy += 18) { const yy = y + dy; if (yy < -10 || yy > H + 10) continue; const hw = steps.find(s => s[0] >= dy - 30)[1] - 3; ctx.moveTo(x - hw, yy); ctx.lineTo(x + hw, yy); } ctx.stroke();
    if (Math.sin(st.t * 2.4) > 0.3) { ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(x, y - 22, 5, 0, TAU); ctx.fill(); }
  }
  function rainbowArc(x, y, R) {
    const cols = ['#ff5d5d', '#ff9a3c', '#ffe14d', '#6ad46a', '#4fa3ff', '#8a6cff'];
    ctx.globalAlpha = 0.6; ctx.lineWidth = 24;
    cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(x, y, R - i * 23, Math.PI, TAU); ctx.stroke(); });
    ctx.globalAlpha = 1;
    cloud(x - R + 50, y + 4, 0.9); cloud(x + R - 50, y + 4, 0.9);
  }
  function eagle(x, y, s, dir, seed) {
    const f = Math.sin(st.t * 2.6 + seed);
    ctx.save(); ctx.translate(x, y + Math.sin(st.t * 0.8 + seed) * 10); ctx.scale(s * dir, s);
    ctx.fillStyle = '#4a3020';
    for (const d of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(d * 40, -20 - f * 16, d * 92, -12 - f * 26);
      ctx.lineTo(d * 84, -2 - f * 18); ctx.lineTo(d * 90, 2 - f * 14); ctx.lineTo(d * 78, 6 - f * 10);
      ctx.quadraticCurveTo(d * 40, 8, 0, 8); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(2, 4, 28, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-44, -4); ctx.lineTo(-44, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(30, 0, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffc23f'; ctx.beginPath(); ctx.moveTo(37, -3); ctx.lineTo(48, 2); ctx.lineTo(36, 5); ctx.fill();
    ctx.fillStyle = '#1b1430'; ctx.beginPath(); ctx.arc(32, -2, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // A mountain top rising from below; (x, y) is the summit
  function peak(x, y, s, seed, rock = ['#7d8fb8', '#62739c'], h = 620) {
    const w = 200 * s;
    const lx = x - w * (0.3 + (seed % 10) * 0.01);
    ctx.fillStyle = fadeDown(rock[0], y, h);
    ctx.beginPath(); ctx.moveTo(x - w * 1.5, y + h); ctx.lineTo(lx, y + 120 * s); ctx.lineTo(x, y); ctx.lineTo(x + w * 0.4, y + 140 * s); ctx.lineTo(x + w * 1.5, y + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fadeDown(rock[1], y, h);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.4, y + 140 * s); ctx.lineTo(x + w * 1.5, y + h); ctx.lineTo(x + w * 0.25, y + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4f8ff';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (lx - x) * 0.6, y + 72 * s); ctx.lineTo(x - 22 * s, y + 58 * s); ctx.lineTo(x - 4 * s, y + 82 * s);
    ctx.lineTo(x + 18 * s, y + 62 * s); ctx.lineTo(x + w * 0.24, y + 84 * s); ctx.closePath(); ctx.fill();
  }
  // Mount Everest, with prayer flags at the summit
  function everest(x, y) {
    peak(x - 330, y + 240, 1.1, 3, ['#8796c0', '#6d7ca6'], 700);
    peak(x, y, 1.9, 5, ['#7484ae', '#56658e'], 1000);
    ctx.strokeStyle = 'rgba(60,40,40,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.quadraticCurveTo(x + 40, y + 6, x + 80, y + 40); ctx.stroke();
    const cols = ['#4f8cff', '#fff', '#ff5d5d', '#4fd07a', '#ffd23f'];
    for (let i = 0; i < 6; i++) {
      const t = (i + 0.5) / 6, fx = x + 80 * t, fy = y - 2 + (8 + 34 * t * t) * t + Math.sin(st.t * 4 + i) * 1.5;
      ctx.fillStyle = cols[i % 5]; ctx.fillRect(fx - 4, fy, 8, 9);
    }
    wisp(x - 60, y + 120, 1.2);
  }
  function fighter(x, y, s, dir) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
    const g = ctx.createLinearGradient(-300, 0, -34, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.6)');
    ctx.fillStyle = g; ctx.fillRect(-300, -2, 266, 4);
    const fl = 16 + Math.sin(st.t * 50) * 4;
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(-34, -4); ctx.lineTo(-34 - fl, 0); ctx.lineTo(-34, 4); ctx.fill();
    ctx.fillStyle = '#8d97ab';
    ctx.beginPath(); ctx.moveTo(44, 0); ctx.lineTo(12, -6); ctx.lineTo(-30, -6); ctx.lineTo(-34, 0); ctx.lineTo(-30, 6); ctx.lineTo(12, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6f7a90';
    ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(-20, 24); ctx.lineTo(-28, 24); ctx.lineTo(-20, 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-16, -4); ctx.lineTo(-28, -22); ctx.lineTo(-34, -22); ctx.lineTo(-30, -4); ctx.fill();
    ctx.fillStyle = '#4fd1ff'; ctx.beginPath(); ctx.ellipse(18, -5, 9, 3.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // The International Space Station: its long truss and big golden solar wings
  function iss(x, y) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(st.t * 0.2) * 0.04);
    for (const px of [-200, -150, 150, 200]) for (const d of [-1, 1]) {
      const py = d > 0 ? 12 : -112;
      ctx.fillStyle = '#c9952e'; ctx.fillRect(px - 20, py, 40, 100);
      ctx.strokeStyle = 'rgba(90,55,0,0.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 1; k < 8; k++) { ctx.moveTo(px - 20, py + k * 12.5); ctx.lineTo(px + 20, py + k * 12.5); } ctx.moveTo(px, py); ctx.lineTo(px, py + 100); ctx.stroke();
    }
    ctx.fillStyle = '#c9ced8'; ctx.fillRect(-230, -6, 460, 12);
    ctx.fillStyle = '#f4f6fa'; ctx.fillRect(-70, 14, 18, 54); ctx.fillRect(52, 14, 18, 54);
    ctx.fillStyle = '#e6e9ef'; ctx.fillRect(-34, -26, 68, 52); ctx.fillRect(-100, -15, 66, 30); ctx.fillRect(34, -15, 80, 30);
    ctx.fillStyle = '#b8bfcc'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4fa3ff'; ctx.fillRect(-6, -40, 12, 14);
    ctx.restore();
  }
  function planet(x, y, s, hue, seed) {
    const r = 46 * s;
    const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, `hsl(${hue},70%,72%)`); g.addColorStop(1, `hsl(${hue},55%,32%)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    if (seed % 2 < 1) {
      ctx.strokeStyle = `hsla(${(hue + 40) % 360},70%,80%,0.7)`; ctx.lineWidth = 5 * s;
      ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r * 0.42, -0.35, 0, TAU); ctx.stroke();
    }
  }
  function castletop(x, y, s, seed) {
    const w = 64 * s;
    ctx.fillStyle = fadeDown('#a7a0bb', y, 520); ctx.fillRect(x - w / 2, y, w, 520);
    ctx.fillStyle = fadeDown('#8a82a2', y, 520); ctx.fillRect(x + w * 0.12, y, w * 0.38, 520);
    ctx.fillStyle = '#ffd86b';
    for (let k = 1; k < 3; k++) { const wy = y + k * 130 * s; if (wy > -30 && wy < H + 30) { ctx.beginPath(); ctx.moveTo(x - 8 * s, wy + 24 * s); ctx.lineTo(x - 8 * s, wy); ctx.arc(x, wy, 8 * s, Math.PI, 0); ctx.lineTo(x + 8 * s, wy + 24 * s); ctx.fill(); } }

  function drawFx(dt) {

  function drawSizeGround() {
    const cam = st.cam * 0.3;

  // ---- The endless tree ------------------------------------------------------------
  const TRUNK_W = 190;

  const treeCache = new Map();
  function treeChunk(ci) {
    if (treeCache.has(ci)) return treeCache.get(ci);
    if (treeCache.size > 200) treeCache.clear();
    const rng = mulberry32(ci * 4513 + 7);
    const w = ci * TREE_CH + rng() * TREE_CH * 0.6;
    const out = { branch: { w, side: ci % 2 ? 1 : -1, len: 150 + rng() * 170, seed: rng() * 100 } };
    if (ci > 0 && rng() < 0.7) {
      // what grows on the tree here comes from the map
      const fw = ci * TREE_CH + TREE_CH * 0.7;
      const z = zoneOfW(fw);
      const kinds = (z >= 20 ? MAPS.guess.infinite : MAPS.guess.stops[z]).feature || ['nest'];
      out.feature = { kind: kinds[Math.floor(rng() * kinds.length)], w: fw, seed: rng() * 100 };
    }
    treeCache.set(ci, out);

  }
  function drawBranch(b) {
    const y = sy(b.w); if (y < -240 || y > H + 240) return;
    const x0 = TX() + b.side * (TRUNK_W / 2 - 14), x1 = x0 + b.side * (b.len + 14);   // starts inside the wavy trunk edge

  const BIGW = { fridge: 220, stove: 280, sink: 260, oven: 260, stall: 320, spices: 200, cans: 220 };
  const CH = 420;
  const chunkCache = new Map();
  function chunk(ci) {
    if (chunkCache.has(ci)) return chunkCache.get(ci);
    if (chunkCache.size > 200) chunkCache.clear();
    const out = [];
    if (ci < 0) { chunkCache.set(ci, out); return out; }
    const rng = mulberry32(ci * 4271 + 11);
    const decor = Object.entries(stopOf(zoneAtX(ci * CH + CH / 2)).decor), total = decor.reduce((s, d) => s + d[1], 0);
    const pickKind = () => { let r = rng() * total; for (const [k, w] of decor) if ((r -= w) <= 0) return k; return decor[0][0]; };
    const first = pickKind();
    if (BIGW[first]) out.push({ kind: first, x: ci * CH + CH / 2, seed: rng() * 100 });
    else { const n = 1 + Math.floor(rng() * 2); for (let i = 0; i < n; i++) { let k = i ? pickKind() : first; if (BIGW[k]) k = decor.find(d => !BIGW[d[0]])?.[0] || 'bowl'; out.push({ kind: k, x: ci * CH + (i + 0.3 + rng() * 0.4) * CH / n, seed: rng() * 100 }); } }
    chunkCache.set(ci, out);
    return out;
  }
  function drawProps() {
    const c0 = Math.floor((st.cam - 300) / CH), c1 = Math.floor((st.cam + W + 300) / CH);
    for (let ci = c0; ci <= c1; ci++) for (const p of chunk(ci)) { const f = PROPS[p.kind]; if (f) f(p.x - st.cam, p.seed); }
  }
  // a sign hanging on the wall where each location starts
  // On the title screen they fade out before they reach the menu, so they don't show behind the logo.
  function drawSigns(title) {
    const z0 = Math.max(0, zoneAtX(st.cam - 200)), z1 = zoneAtX(st.cam + W + 200);
    for (let z = z0; z <= z1 && z <= 20; z++) {
      const x = z * PX - st.cam + W * 0.18;
      if (x < -200 || x > W + 200) continue;
      const fade = title ? clamp((W - 1180 - x) / 160, 0, 1) : 1;
      if (fade <= 0) continue;
      ctx.globalAlpha = fade;
      const s = stopOf(z);
      const text = `${s.ic} ${s.name}`;
      ctx.font = '700 22px Fredoka, sans-serif';
      const w = ctx.measureText(text).width + 34;
      ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - w / 2 + 20, 108); ctx.lineTo(x - w / 2 + 20, 132); ctx.moveTo(x + w / 2 - 20, 108); ctx.lineTo(x + w / 2 - 20, 132); ctx.stroke();
      ctx.fillStyle = '#fffaf0'; rr(x - w / 2, 130, w, 40, 12); ctx.fill(); ctx.strokeStyle = '#c98f55'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#5a3414'; ctx.textAlign = 'center'; ctx.fillText(text, x, 158); ctx.textAlign = 'start';
      ctx.globalAlpha = 1;
    }
  }

  // ---- The race ----------------------------------------------------------------------------
  function set(list) {
    const seen = new Set();
    for (const p of list) {
      seen.add(p.id);
      let r = racers.get(p.id);
      if (!r) { r = { id: p.id, x: xOf(p.score || 0), phase: Math.random() * 6, boost: 0, stumble: 0 }; racers.set(p.id, r); }
      Object.assign(r, { name: p.name, fruit: p.fruit | 0, me: !!p.me, score: p.score || 0, finished: !!p.finished, left: !!p.left });
      r.xT = xOf(r.score);
    }
    for (const id of [...racers.keys()]) if (!seen.has(id)) racers.delete(id);
  }
  function fx(id, kind) { const r = racers.get(id); if (r) r[kind] = kind === 'boost' ? 1 : 1.1; }
  function reset() { racers.clear(); st.cam = 0; chunkCache.clear(); st.wall = null; }

  function draw(c, dt, env) {
    ctx = c; W = env.W; H = env.H; T = env.t;
    const list = [...racers.values()];
    const me = list.find(r => r.me);
    for (const r of list) {
      const v = r.xT - r.x;
      r.x += v * Math.min(1, dt * 3);
      r.phase += dt * (r.racing === false ? 0 : 9 + Math.min(14, Math.abs(v) * 0.05));
      r.boost = Math.max(0, r.boost - dt); r.stumble = Math.max(0, r.stumble - dt);
    }
    const title = st.title || !list.length;
    if (title) st.cam += 90 * dt;           // the title screen: the kitchen rolls by, location after location
    else {
      const camT = me ? me.x - W * 0.12 : Math.max(...list.map(r => r.x)) - W * 0.12;
      st.cam += (camT - st.cam) * Math.min(1, dt * 3);
    }
    drawWall(dt);
    drawSigns(title);
    drawProps();
    drawCounter();
    if (title) {
      // all eight fruits running together in two rows, in the open space left of the menu
      FRUITS.forEach((f, i) => {
        const back = i % 2, col = i >> 1;
        const y = back ? LANES_TOP + 70 : LANES_TOP + 200, x = 70 + col * 118 + (back ? 0 : 50) + Math.sin(T * 1.3 + i) * 10;
        drawFruit(i, x, y, back ? 0.9 : 1.15, { phase: T * 11 + i * 1.7, moving: true });
      });
      return;
    }
    const n = Math.max(1, list.length);
    drawLanes(n);
    // lanes by fruit order, back lanes first so nearer fruits overlap them
    const lanes = list.slice().sort((a, b) => a.fruit - b.fruit);
    lanes.forEach((r, i) => {
      // more racers, smaller fruits, so eight fit on the counter
      const y = laneY(i, n), s = laneScale(y) * (n > 5 ? 0.8 : n > 3 ? 0.9 : 1), x = r.x - st.cam + W * 0.18 + 30;
      if (x < -60 || x > W + 60) {
        // off the screen: a tag at the edge
        const ahead = x > W;
        const text = `${ahead ? '' : '◀ '}${FRUITS[r.fruit % 8].emoji} ${r.me ? 'You' : r.name}${ahead ? ' ▶' : ''}`;
        ctx.font = '700 15px Fredoka, sans-serif';
        const w = ctx.measureText(text).width + 18, tx = ahead ? W - w - 10 : 10;
        ctx.fillStyle = 'rgba(20,24,52,0.82)'; rr(tx, y - 30, w, 24, 12); ctx.fill();
        ctx.strokeStyle = FRUITS[r.fruit % 8].color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillText(text, tx + 9, y - 13);
        return;
      }
      drawFruit(r.fruit, x, y, s, { phase: r.phase, moving: !r.finished && !r.left, boost: r.boost, stumble: r.stumble });
      if (!r.left) tag(x - 34 * s, y - 36 * s, r.me ? 'YOU' : r.name, FRUITS[r.fruit % 8].color, r.me);
      if (r.finished) { ctx.font = '22px sans-serif'; ctx.fillText('🏁', x + 24 * s, y - 64 * s); }
    });
  }
  function vehiclePos() {
    const me = [...racers.values()].find(r => r.me);
    return { x: me ? me.x - st.cam + W * 0.18 + 30 : W * 0.2, y: LANES_TOP + 40 };
  }

  return {
    FRUITS, set, fx, reset, draw, vehiclePos, xOf,
    set title(v) { st.title = !!v; },
    // a single fruit drawn on any canvas (for the lobby's fruit picker)
    paintFruit(c, fi, x, y, s) { const keep = ctx; ctx = c; drawFruit(fi, x, y, s, { moving: false }); ctx = keep; }
  };
})();

/* Apples to Oranges — accounts, the front-end half. Players sign in with their Warden Chat account
   (chat.sirsc104.com), the same way Brain Rocket does, and creating an account here creates a
   Warden Chat account. The game talks straight to Warden Chat's Supabase project: Supabase Auth for
   signing in, and a few Apples to Oranges database functions (a2o_*) for best scores and friends.
   Those functions are the back-end half, specified in ACCOUNTS-API.md. Until they exist (a2o_ping
   answers), Account.status stays 'unavailable', the account button stays hidden and the game saves
   on this device only.

   Changing a password and deleting an account happen on Warden Chat, not here. An account an admin
   has suspended or banned on Warden Chat gets status 'restricted' (with the admin's reason), and
   the account screens show a "you've been banned" screen instead of signing it out.

   What syncs: the best score for every mode and difficulty (a2o.best2). Sound, music, the last tab
   and your favourite Fruit Dash fruit stay per device. Friends are shared with Brain Rocket: a
   friend there is a friend here. */

const Account = (function () {

  // to every browser); every access decision is made by row level security in the database.
  const CONFIG = Object.assign({

    const c = topOf(x.bests, 'classic'), r = topOf(x.bests, 'race');
    const bits = [];
    if (c) bits.push(`🎈 <b>${n(c)}</b>`);
    if (r) bits.push(`🏃 <b>${n(r)}</b>`);
    if (x.race_wins) bits.push(`🏆 ${x.race_wins} race win${x.race_wins === 1 ? '' : 's'}`);
    return bits.length ? bits.join(' · ') : '<span class="fr-none">No scores yet</span>';
  }

  // ---- Building the dialog ---------------------------------------------------------
  function field(name, label, type, attrs, hint) {
    const pw = type === 'password';
    return `<label class="af"><span class="af-label">${label}</span>
      <span class="af-wrap"><input class="af-input" name="${name}" type="${type}" ${attrs || ''} spellcheck="false" autocapitalize="off" autocorrect="off">${pw ? '<button type="button" class="af-eye" aria-label="Show password" aria-pressed="false">Show</button>' : ''}</span>
      ${hint ? `<span class="af-hint">${hint}</span>` : ''}</label>`;
  }
  const head = (title, sub) => `<button type="button" class="acct-x" aria-label="Close">✕</button><h2 id="acctTitle">${title}</h2>${sub ? `<p class="acct-sub">${sub}</p>` : ''}`;
  const errBox = '<div class="af-error" role="alert"></div>';
  const wc = '<span class="wc-badge">💬 Warden Chat</span>';

  const VIEWS = {
    signin: () => `${head('Sign in', `Use your ${wc} account. Your best scores and friends come with you to every device, and you can race your friends in Fruit Dash.`)}
      <form class="acct-form" novalidate>
        ${field('username', 'Warden Chat username', 'text', `autocomplete="username" maxlength="${R.nameMax}" required`)}
        ${field('password', 'Password', 'password', 'autocomplete="current-password" maxlength="200" required')}
        <button type="button" class="acct-link acct-forgot" data-go="forgot">Forgot password?</button>
        ${errBox}
        <button type="submit" class="big-btn go acct-main">Sign in</button>
      </form>
      <p class="acct-foot">No Warden Chat account? <button type="button" class="acct-link" data-go="signup">Create one here</button></p>`,
    signup: () => `${head('Create an account')}
      <div class="wc-callout"><span class="wc-callout-icon" aria-hidden="true">💬</span><span>This creates a <b>Warden Chat</b> account. Use the same username and password here, in Brain Rocket, and to chat at ${chatLink(esc(chatHost))}.</span></div>
      <form class="acct-form" novalidate>
        ${field('username', 'Username', 'text', `autocomplete="username" maxlength="${R.nameMax}" required`, `${R.nameMin}–${R.nameMax} letters, numbers, dots, dashes or underscores. It can't be changed later.`)}
        ${field('password', 'Password', 'password', 'autocomplete="new-password" maxlength="200" required', PW_RULE)}
        ${field('confirm', 'Type the password again', 'password', 'autocomplete="new-password" maxlength="200" required')}
        <p class="acct-warn">⚠️ Warden Chat doesn't use email, so a forgotten password can't be reset. Keep it somewhere safe.</p>
        ${errBox}
        <button type="submit" class="big-btn go acct-main">Create Warden Chat account</button>
      </form>
      <p class="acct-foot">Already on Warden Chat? <button type="button" class="acct-link" data-go="signin">Sign in</button></p>`,
    forgot: () => `${head('Forgot your password?')}
      <div class="acct-big-icon" aria-hidden="true">🔑</div>
      <p class="acct-msg">Warden Chat accounts don't have an email address, so a forgotten password can't be reset.</p>
      <p class="acct-msg">Still signed in to ${chatLink('Warden Chat')} somewhere? You can change it there. If not, you can make a new account, and the scores on this device come with it.</p>
      <div class="acct-btns"><button type="button" class="big-btn quiet" data-go="signup">New account</button><button type="button" class="big-btn" data-go="signin">Back to sign in</button></div>`,
    profile: () => {
      const u = Account.user, [cls] = SYNC_TEXT[Account.sync], f = Account.friends, b = bestsOf();
      const saved = Object.values(b).reduce((s, m) => s + Object.values(m || {}).filter(v => v > 0).length, 0);
      const nf = f ? f.friends.length : 0, req = f ? f.incoming.length : 0;
      return `${head('Your account')}
        <div class="acct-who">${avatar(u.username, 'big')}
          <span class="acct-who-text"><b>${esc(u.username)}</b>${wc}</span></div>
        <div class="acct-sync ${cls}"><span class="acct-dot" aria-hidden="true"></span><span class="acct-sync-text">${esc(syncLine())}</span>
          <button type="button" class="acct-link" data-act="sync"${Account.sync === 'syncing' ? ' disabled' : ''}>Sync now</button></div>
        <div class="acct-stats">
          <div class="stat"><b>${saved}</b><span>Best scores saved</span></div>
          <div class="stat"><b>${topOf(b, 'classic') ? n(topOf(b, 'classic')) : '–'}</b><span>🎈 Classic best</span></div>
          <div class="stat"><b>${topOf(b, 'race') ? n(topOf(b, 'race')) : '–'}</b><span>🏃 Fruit Dash best</span></div>
        </div>
        <div class="acct-btns"><button type="button" class="big-btn acct-friends-btn" data-go="friends">👥 Friends${f ? ` (${nf})` : ''}${req ? `<span class="acct-badge">${req}</span>` : ''}</button><button type="button" class="big-btn quiet" data-go="signout">Sign out</button></div>
        <p class="acct-foot small">To change your picture or password, or delete your account, go to ${chatLink('Warden Chat')}.</p>`;
    },
    signout: () => `${head('Sign out?', 'Your best scores stay saved to your account. Warden Chat stays signed in.')}
      <label class="acct-check"><input type="checkbox" name="clear"> <span>Also remove them from this device<small>Pick this on a shared or school computer.</small></span></label>
      ${errBox}
      <div class="acct-btns"><button type="button" class="big-btn" data-act="signout">Sign out</button><button type="button" class="big-btn quiet" data-go="profile">Cancel</button></div>`,
    friends: () => `${head('Friends', 'Race them in Fruit Dash and see their best scores. Add them by their Warden Chat username. Friends from Brain Rocket are here too.')}
      <form class="acct-form fr-add" novalidate>
        <span class="af-wrap"><input class="af-input" name="friend" type="text" maxlength="${R.nameMax}" placeholder="Their Warden Chat username" aria-label="Friend's Warden Chat username" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></span>
        <button type="submit" class="big-btn go acct-main fr-send">Add</button>
      </form>
      ${errBox}
      <div class="fr-lists">${friendLists()}</div>
      <p class="acct-foot"><button type="button" class="acct-link" data-go="profile">← Your account</button></p>`
  };

  function friendLists() {
    const f = Account.friends;
    if (!f) return '<p class="fr-empty">Loading your friends…</p>';
    const rows = [];
    if (f.incoming.length) {
      rows.push(`<h3 class="fr-h">Friend requests <span class="acct-badge">${f.incoming.length}</span></h3>`);
      f.incoming.forEach(r => rows.push(`<div class="fr-row req">${avatar(r.username)}<span class="fr-name"><b>${esc(r.username)}</b><small>wants to be friends</small></span>
        <button type="button" class="fr-btn yes" data-fr="accept" data-id="${esc(r.request_id)}" data-name="${esc(r.username)}">Accept</button>
        <button type="button" class="fr-btn" data-fr="decline" data-id="${esc(r.request_id)}" data-name="${esc(r.username)}">Decline</button></div>`));
    }
    rows.push(`<h3 class="fr-h">Your friends${f.friends.length ? ` (${f.friends.length})` : ''}</h3>`);
    if (!f.friends.length) rows.push('<p class="fr-empty">No friends yet. Type a friend\'s Warden Chat username above and they\'ll get a request the next time they open Apples to Oranges or Brain Rocket.</p>');
    [...f.friends].sort((a, b) => topOf(b.bests, 'classic') - topOf(a.bests, 'classic') || a.username.localeCompare(b.username)).forEach(x => rows.push(
      `<div class="fr-row">${avatar(x.username)}<span class="fr-name"><b>${esc(x.username)}</b><small>${friendLine(x)}</small></span>
        <button type="button" class="fr-btn subtle" data-fr="remove" data-id="${esc(x.user_id)}" data-name="${esc(x.username)}">Remove</button></div>`));
    if (f.outgoing.length) {
      rows.push('<h3 class="fr-h">Waiting for them to accept</h3>');
      f.outgoing.forEach(r => rows.push(`<div class="fr-row out">${avatar(r.username)}<span class="fr-name"><b>${esc(r.username)}</b><small>Request sent</small></span>
        <button type="button" class="fr-btn subtle" data-fr="cancel" data-id="${esc(r.request_id)}" data-name="${esc(r.username)}">Cancel</button></div>`));
    }
    return rows.join('');
  }

  // ---- Checking boxes before sending -------------------------------------------------
  function checkName(v) {
    if (!v) return 'Choose a username.';
    if (v.length < R.nameMin || v.length > R.nameMax) return `Usernames are ${R.nameMin}–${R.nameMax} characters.`;
    if (!R.nameRe.test(v)) return 'Use only letters, numbers, dots, dashes and underscores (no spaces).';
    if (!/[a-zA-Z0-9]/.test(v)) return 'Include at least one letter or number.';
    return '';
  }
  function checkPassword(v) {
    if (!v) return 'Choose a password.';
    if (v.length < R.passwordMin) return `Use at least ${R.passwordMin} characters.`;
    const kinds = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(re => re.test(v)).length;
    return kinds < 2 ? 'Mix at least two of: lowercase, uppercase, numbers, symbols.' : '';
  }
  const CHECKS = {
    signin: v => [['username', v.username ? '' : 'Enter your Warden Chat username.'], ['password', v.password ? '' : 'Enter your password.']],
    signup: v => [['username', checkName(v.username)], ['password', checkPassword(v.password)], ['confirm', v.confirm === v.password ? '' : "The two passwords don't match."]],
    friends: v => [['friend', v.friend ? '' : "Type your friend's Warden Chat username."]]
  };

  // ---- Opening, switching and closing -----------------------------------------------
  let view = null, busy = false, returnFocus = null, friendTimer = 0;
  function open(v, o) {
    o = o || {};
    if (modal.classList.contains('hidden')) returnFocus = document.activeElement;
    view = v; busy = false;
    box.innerHTML = VIEWS[v](o);
    box.className = 'modal-box acct-box acct-' + v;
    modal.classList.remove('hidden');
    wire();
    // on touch screens, don't jump straight into a text box: that pops the keyboard over half the game
    const touch = matchMedia('(pointer: coarse)').matches;
    const first = (!touch && box.querySelector('.af-input')) || box.querySelector('.acct-main, .big-btn');
    if (first && !o.noFocus) setTimeout(() => first.focus({ preventScroll: true }), 30);
    if (o.message) setError(o.message, true);
    clearInterval(friendTimer);
    if (v === 'friends' || v === 'profile') {
      Account.loadFriends();
      if (v === 'friends') friendTimer = setInterval(() => Account.loadFriends(), 30000);
    }
  }
  function close() {
    if (busy) return;
    clearInterval(friendTimer);
    modal.classList.add('hidden'); view = null;
    if (returnFocus && document.contains(returnFocus) && returnFocus.offsetParent !== null) returnFocus.focus();
  }
  const isOpen = () => !modal.classList.contains('hidden');

  function setError(html, info) {
    const b = box.querySelector('.af-error');
    if (b) { b.innerHTML = html || ''; b.classList.toggle('info', !!info); }
  }
  function setBusy(on, label, btn) {
    busy = on;
    box.querySelectorAll('input, button').forEach(x => { x.disabled = on; });
    const m = btn || box.querySelector('.acct-main, [data-act="signout"]');
    if (m) { if (on) { m.dataset.label = m.innerHTML; m.textContent = label || 'Please wait…'; } else if (m.dataset.label) m.innerHTML = m.dataset.label; }
    box.classList.toggle('busy', on);
  }
  function fail(e, name) {
    setBusy(false);
    setError(errorText(e, name));
    const f = errorField(e), inp = f && box.querySelector(`[name="${f}"]`);
    if (inp) { inp.setAttribute('aria-invalid', 'true'); inp.focus(); if (inp.select) inp.select(); }
  }
  function values() {
    const out = {};
    box.querySelectorAll('.af-input').forEach(i => { out[i.name] = /password|confirm/.test(i.name) ? i.value : i.value.trim(); });
    return out;
  }
  function validate(v) {
    for (const [k, msg] of CHECKS[view](v)) {
      if (!msg) continue;
      setError(esc(msg));
      const i = box.querySelector(`[name="${k}"]`); i.setAttribute('aria-invalid', 'true'); i.focus();
      return false;
    }
    return true;
  }

  const SUBMIT = {
    signin(v) {
      setBusy(true, 'Signing in…');
      return Account.signIn(v.username, v.password).then(r => {
        setBusy(false); close();
        if (r.restricted) return;   // the banned screen takes over
        toast(r.synced ? `✅ Signed in as <b>${esc(r.user.username)}</b>. Your best scores are synced.` : `Signed in as <b>${esc(r.user.username)}</b>. Your scores will sync when they can.`, r.synced ? 'good' : '');
      }, e => fail(e));
    },
    signup(v) {
      setBusy(true, 'Creating account…');
      return Account.signUp(v.username, v.password).then(r => {
        setBusy(false); close();
        toast(`🎉 Welcome, <b>${esc(r.user.username)}</b>! Your best scores are saved to your new Warden Chat account.`, 'good');
      }, e => fail(e));
    },
    friends(v) {
      const name = v.friend, btn = box.querySelector('.fr-send');
      setBusy(true, 'Sending…', btn);
      return Account.addFriend(name).then(r => {
        setBusy(false); renderFriends();
        box.querySelector('[name="friend"]').value = '';
        setError(r && r.status === 'accepted' ? `🎉 <b>${esc(name)}</b> had already asked you, so you're friends now!` : `✅ Friend request sent to <b>${esc(name)}</b>.`, true);
        box.querySelector('[name="friend"]').focus();
      }, e => { fail(e, name); const i = box.querySelector('[name="friend"]'); i.setAttribute('aria-invalid', 'true'); i.focus(); });
    }
  };

  function wire() {
    const form = box.querySelector('form');
    if (form) form.addEventListener('submit', e => {
      e.preventDefault();
      if (busy) return;
      click();
      box.querySelectorAll('[aria-invalid]').forEach(i => i.removeAttribute('aria-invalid'));
      setError('');
      const v = values();
      if (validate(v)) SUBMIT[view](v);
    });
    box.querySelectorAll('.af-input').forEach(i => i.addEventListener('input', () => { i.removeAttribute('aria-invalid'); }));
    box.querySelectorAll('.af-eye').forEach(b => b.addEventListener('click', () => {
      const i = b.previousElementSibling, show = i.type === 'password';
      i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
      b.setAttribute('aria-pressed', String(show)); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      i.focus();
    }));
    box.querySelector('.acct-x').addEventListener('click', () => { click(); close(); });
  }
  // Links that switch views, and the buttons that do something, are handled for the whole dialog.
  const FRIEND_ACTS = {
    accept: (id, name) => Account.answerFriend(id, true).then(() => `🎉 You and <b>${esc(name)}</b> are friends now.`),
    decline: id => Account.answerFriend(id, false).then(() => 'Request declined.'),
    cancel: id => Account.cancelFriend(id).then(() => 'Request cancelled.'),
    remove: (id, name) => Account.removeFriend(id).then(() => `Removed <b>${esc(name)}</b> from your friends.`)
  };
  box.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'), act = e.target.closest('[data-act]'), fr = e.target.closest('[data-fr]');
    if (busy) return;
    if (go) { click(); open(go.dataset.go); }
    else if (act && act.dataset.act === 'sync') { click(); Account.syncNow(); }
    else if (act && act.dataset.act === 'signout') {
      click();
      const clear = box.querySelector('[name="clear"]').checked;
      setBusy(true, 'Signing out…');
      Account.signOut(clear).then(() => { setBusy(false); close(); toast(clear ? 'Signed out. Your scores were removed from this device.' : 'Signed out. Your scores are still on this device.'); });
    } else if (fr) {
      click();
      const { fr: what, id, name } = fr.dataset;
      // removing a friend asks first: the button turns into "Sure?"
      if (what === 'remove' && !fr.classList.contains('confirm')) {
        fr.classList.add('confirm'); fr.textContent = 'Sure?';
        setTimeout(() => { if (fr.isConnected) { fr.classList.remove('confirm'); fr.textContent = 'Remove'; } }, 4000);
        return;
      }
      setBusy(true, '…', fr);
      FRIEND_ACTS[what](id, name).then(msg => { setBusy(false); renderFriends(); setError(msg, true); }, err => { setBusy(false); renderFriends(); setError(errorText(err, name)); });
    }
  });
  modal.addEventListener('pointerdown', e => { if (e.target === modal) close(); });
  // Escape closes the dialog wherever the focus is, before the game sees it
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) { e.stopPropagation(); close(); } }, true);
  // typing in the dialog shouldn't also play the game (←/→ switch tabs on the home screen)
  modal.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key !== 'Tab') return;
    // keep Tab inside the dialog
    const f = [...box.querySelectorAll('input, button, [href]')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });

  // ---- Keeping everything up to date ---------------------------------------------------
  function renderChip() {
    const s = Account.status;
    if (s === 'restricted') {
      const u = Account.user.username, word = Account.restriction.status === 'banned' ? 'Banned' : 'Suspended';
      chip.className = 'acct-chip in restricted';
      chip.innerHTML = `${avatar(u)}<span class="acct-chip-name">${esc(u)}</span><span class="acct-ban-tag">${word}</span>`;
      chip.title = `${u} · account ${word.toLowerCase()} on Warden Chat`;
      chip.setAttribute('aria-label', `Your account, ${u}, is ${word.toLowerCase()}`);
    } else if (s === 'signedIn') {
      const [cls] = SYNC_TEXT[Account.sync], u = Account.user.username, req = Account.friends ? Account.friends.incoming.length : 0;
      chip.className = 'acct-chip in ' + cls;
      chip.innerHTML = `${avatar(u)}<span class="acct-chip-name">${esc(u)}</span><span class="acct-dot" aria-hidden="true"></span>${req ? `<span class="acct-badge" title="${req} friend request${req === 1 ? '' : 's'}">${req}</span>` : ''}`;
      chip.title = `${u} · ${syncLine()}${req ? ` · ${req} friend request${req === 1 ? '' : 's'}` : ''}`;
      chip.setAttribute('aria-label', `Your account, ${u}. ${syncLine()}${req ? `. ${req} friend request${req === 1 ? '' : 's'}` : ''}`);
    } else if (s === 'signedOut') {
      chip.className = 'acct-chip';
      chip.innerHTML = '<span class="acct-chip-icon" aria-hidden="true">👤</span><span class="acct-chip-name">Sign in</span>';
      chip.title = 'Sign in with your Warden Chat account';
      chip.setAttribute('aria-label', 'Sign in with your Warden Chat account');
    } else chip.className = 'acct-chip hidden';
  }
  // the results screen says which mode it was (game.js sets data-mode and data-diff on #over)
  const overShown = () => !$('over').classList.contains('hidden');
  const overIsRace = () => $('over').dataset.race === '1';
  function renderNote() {
    const s = Account.status;
    note.className = 'acct-note' + (s === 'unavailable' || s === 'checking' || s === 'restricted' || overIsRace() ? ' hidden' : '');
    if (s === 'signedOut') note.innerHTML = '<button type="button" class="acct-link" data-open="signin">Sign in with Warden Chat</button> to keep your best scores on every device.';
    else if (s === 'signedIn') {
      const u = esc(Account.user.username);
      note.className += ' ' + SYNC_TEXT[Account.sync][0];
      note.innerHTML = {
        syncing: '☁️ Saving to your account…', pending: '☁️ Saving to your account…', idle: '☁️ Saving to your account…', synced: `☁️ Saved to <b>${u}</b>'s account`,
        offline: "⚠️ You're offline. Saved on this device; it will sync later.", error: "⚠️ Couldn't save to your account yet. We'll keep trying."
      }[Account.sync];
    }
  }
  // Your friends' bests on the same mode and difficulty, on the results screen: the top three, plus you.
  function renderBoard() {
    const mode = $('over').dataset.mode, diff = $('over').dataset.diff;
    const show = Account.status === 'signedIn' && overShown() && !overIsRace() && !!mode;
    board.classList.toggle('hidden', !show);
    if (!show) return;
    const f = Account.friends, label = `${MODE_NAME[mode] || mode} · ${DIFF_NAME[diff] || diff}`;
    if (!f) { board.innerHTML = `<div class="acct-board-h">👥 Friends' bests · ${esc(label)}</div><p class="fr-empty">Loading…</p>`; return; }
    if (!f.friends.length) { board.innerHTML = '<button type="button" class="acct-link" data-open="friends">👥 Add friends</button> to see their best scores here.'; return; }
    const mine = (bestsOf()[mode] || {})[diff] || 0;
    const rows = f.friends.map(x => ({ name: x.username, s: ((x.bests || {})[mode] || {})[diff] || 0 })).concat([{ name: Account.user.username, s: mine, me: true }]);
    rows.sort((a, b) => b.s - a.s);
    const medal = ['🥇', '🥈', '🥉'];
    const shown = rows.slice(0, 3);
    if (!shown.some(r => r.me)) shown.push(rows.find(r => r.me));
    board.innerHTML = `<div class="acct-board-h">👥 Friends' bests · ${esc(label)}</div>` + shown.map(r => {
      const i = rows.indexOf(r);
      return `<div class="acct-board-row${r.me ? ' me' : ''}"><span class="ab-rank">${r.s > 0 ? medal[i] || i + 1 : '·'}</span>${avatar(r.name)}<span class="ab-name">${r.me ? 'You' : esc(r.name)}</span><span class="ab-score">${r.s > 0 ? n(r.s) : 'not yet'}</span></div>`;
    }).join('');
  }
  function renderFriends() {
    const lists = view === 'friends' && box.querySelector('.fr-lists');
    if (lists && !busy) lists.innerHTML = friendLists();
  }
  function refresh() {
    renderChip(); renderNote(); renderBoard(); renderFriends();
    if (view === 'profile' && !busy) {
      // update just the parts that change, so nothing jumps under the pointer
      const row = box.querySelector('.acct-sync');
      if (row) {
        row.className = 'acct-sync ' + SYNC_TEXT[Account.sync][0];
        row.querySelector('.acct-sync-text').textContent = syncLine();
        row.querySelector('[data-act="sync"]').disabled = Account.sync === 'syncing';
      }
      const fb = box.querySelector('.acct-friends-btn'), f = Account.friends;
      if (fb && f) fb.innerHTML = `👥 Friends (${f.friends.length})${f.incoming.length ? `<span class="acct-badge">${f.incoming.length}</span>` : ''}`;
    }
    if (Account.status !== 'signedIn' && ['profile', 'signout', 'friends'].includes(view) && !busy) close();
  }
  chip.addEventListener('click', () => { click(); if (Account.status === 'restricted') showBan(true); else open(Account.status === 'signedIn' ? 'profile' : 'signin'); });

  // ---- "You've been banned": an admin suspended or banned this account on Warden Chat ----------
  const ban = document.createElement('div');
  ban.id = 'acctBan'; ban.className = 'modal hidden';
  ban.innerHTML = '<div class="modal-box ban-box" role="alertdialog" aria-modal="true" aria-labelledby="banTitle" aria-describedby="banText"></div>';
  stage.appendChild(ban);
  const banBox = ban.firstChild;
  let banWanted = false;
  function renderBan() {
    const r = Account.restriction, u = Account.user;
    if (!r || !u) return;
    const banned = r.status === 'banned', deleting = r.status === 'deleting';
    const until = r.until ? new Date(r.until).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : null;
    banBox.innerHTML = `
      <div class="ban-icon" aria-hidden="true">${deleting ? '🗑️' : '🚫'}</div>
      <h2 id="banTitle">${deleting ? 'Account being deleted' : banned ? 'You’ve been banned' : 'You’ve been suspended'}</h2>
      <p class="ban-text" id="banText">${deleting ? `Your Warden Chat account <b>${esc(u.username)}</b> is being deleted.`
        : `An admin has ${banned ? 'banned' : 'suspended'} your Warden Chat account <b>${esc(u.username)}</b>.`}</p>
      ${r.reason && !deleting ? `<div class="ban-reason"><span class="ban-label">Reason</span>${esc(r.reason)}</div>` : ''}
      <p class="ban-when">${deleting ? '' : banned ? 'This ban doesn’t end on its own.' : until ? `Until <b>${esc(until)}</b>.` : 'It lasts until an admin lifts it.'}</p>
      <p class="ban-what">While it’s ${deleting ? 'being deleted' : banned ? 'banned' : 'suspended'}, you can’t sync scores, use friends or race. You can still play Apples to Oranges as a guest.</p>
      <div class="acct-btns"><button type="button" class="big-btn" data-ban="guest">Sign out and play as a guest</button>${banned || deleting ? '' : '<button type="button" class="big-btn quiet" data-ban="check">↻ Check again</button>'}</div>
      <p class="ban-msg" role="status"></p>`;
  }
  // Mid-game it waits for the results or the home screen, so nobody loses a run to it.
  const calm = () => typeof A2OGame === 'undefined' || ['title', 'over', 'paused'].includes(A2OGame.state);
  function showBan(force) {
    banWanted = true;
    if (!force && !calm()) return;
    close(); renderBan();
    ban.classList.remove('hidden');
    setTimeout(() => { const b = banBox.querySelector('.big-btn'); if (b) b.focus(); }, 30);
  }
  function hideBan() { banWanted = false; ban.classList.add('hidden'); }
  setInterval(() => { if (banWanted && ban.classList.contains('hidden') && Account.status === 'restricted' && calm()) showBan(); }, 500);
  banBox.addEventListener('click', e => {
    const b = e.target.closest('[data-ban]');
    if (!b || b.disabled) return;
    click();
    const msg = banBox.querySelector('.ban-msg');
    banBox.querySelectorAll('button').forEach(x => { x.disabled = true; });
    if (b.dataset.ban === 'guest') {
      Account.signOut(false).then(() => { hideBan(); toast('Signed out. You’re playing as a guest.'); });
    } else {
      msg.textContent = 'Checking…';
      Account.recheck().then(state => {
        if (state === 'restricted') { renderBan(); banBox.querySelector('.ban-msg').textContent = 'Still ' + (Account.restriction.status === 'banned' ? 'banned' : 'suspended') + '.'; }
        else { hideBan(); toast('✅ Your account is back. Welcome back!', 'good'); }
      }, () => { banBox.querySelectorAll('button').forEach(x => { x.disabled = false; }); msg.textContent = "Couldn't check right now. Try again in a moment."; });
    }
  });
  // there's no getting past it except the two buttons (Escape and clicks outside do nothing)
  ban.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key !== 'Tab') return;
    const f = [...banBox.querySelectorAll('button')].filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  Account.onRestricted(() => showBan());
  Account.on(() => { if (Account.status !== 'restricted' && banWanted) hideBan(); });
  [note, board, toastEl].forEach(x => x.addEventListener('click', e => {
    const o = e.target.closest('[data-open]');
    if (o) { click(); toastEl.className = 'acct-toast'; open(o.dataset.open); }
  }));
  // the results screen: fetch friends' bests when it appears
  new MutationObserver(() => { if (overShown()) { renderNote(); renderBoard(); Account.loadFriends(); } else renderBoard(); }).observe($('over'), { attributes: true, attributeFilter: ['class'] });
  // new friend requests turn up on the home screen without a reload
  setInterval(() => { if (Account.status === 'signedIn' && !document.hidden) { if (Account.sync === 'synced') refresh(); Account.loadFriends(); } }, 120000);

  Account.on(refresh);
  Account.onExpired(() => toast('You were signed out. <button type="button" class="acct-link" data-open="signin">Sign in again</button> to keep syncing.', 'warn'));
  Account.init().then(refresh);
  return { open, close, isOpen, toast, avatar };
})();

/* Apples to Oranges — Fruit Dash, the live race. Every racer is a different fruit. A signed-in
   player hosts a race and gets a 6-character code; friends join by code or invite and pick their
   fruit in the lobby; the host starts it and everyone counts down together on the server's clock.
   Then 60 seconds of Classic higher or lower, with the same matchups in the same order for everyone
   (one shared seed), while the fruits dash across the kitchen. Highest score wins. Then a podium
   and a vote: if everyone still there votes to play again, the next round starts with new matchups.

   The server side is the a2o_race_* functions in RACES-API.md (Warden Chat's Supabase project); this
   file reaches them through Account.rpc. Browsers poll about every 1.5 seconds, which is plenty for
   a 60-second race. js/game.js plays the race itself (the A2OGame hooks); js/kitchen.js draws it.

   The Fruit Dash tab works without an account too: Practice solo is a 60-second dash on your own.
   Ported from Brain Rocket's js/race.js. */
'use strict';

const Race = (function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const n = v => Math.round(Number(v || 0)).toLocaleString('en-US');
  const click = () => { if (typeof Sound !== 'undefined') Sound.click(); };
  const avatar = name => AccountUI.avatar(name);
  const DIFFS = [['owen', '🧒 Owen'], ['medium', '🍓 Medium'], ['hard', '🍉 Hard'], ['ultra', '💀 Ultra']];
  const DIFF_NAME = Object.fromEntries(DIFFS);
  const DIFF_INFO = { owen: 'numbers 1.6× to 8× apart', medium: 'closer numbers · ×1.25 points', hard: 'really close numbers · ×1.5 points', ultra: 'always within 10 · ×1.75 points' };
  const LEN = 60, MAX = 8, POLL = 1500;
  const CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTVWXYZ';
  const FRUITS = Kitchen.FRUITS;
  const fruitOf = i => FRUITS[((i | 0) % FRUITS.length + FRUITS.length) % FRUITS.length];
  const tidy = s => String(s).toUpperCase().replace(/[^0-9A-Z]/g, '');
  const describe = r => `🏃 Fruit Dash · ${DIFF_NAME[r.diff] || r.diff} · ${r.len || LEN} seconds`;
  const ordinal = i => (i === 1 ? '1st' : i === 2 ? '2nd' : i === 3 ? '3rd' : i + 'th');
  const me = () => (Account.user ? Account.user.id : null);

  let host = { diff: 'medium' };
  try { const h = JSON.parse(localStorage.getItem('a2o.raceHost')); if (h && DIFF_NAME[h.diff]) host = h; } catch (e) { /* first time */ }
  // your favourite fruit: what you run as in Practice, and what you ask for in a race lobby
  let fav = 0;
  try { const f = +localStorage.getItem('a2o.fruit'); if (f >= 0 && f < FRUITS.length) fav = f; } catch (e) { /* first time */ }
  const saveFav = () => { try { localStorage.setItem('a2o.fruit', String(fav)); } catch (e) { /* ignore */ } };

  let race = null;        // the latest race state from the server
  let phase = 'none';     // none | lobby | starting | racing | results
  let offset = 0, bestRtt = Infinity;      // server clock minus this computer's clock, in ms
  let pollTimer = 0, lastSent = -1, myResult = null, busy = false, round = 0, voted = false, fruitAsked = false;
  const picked = new Set();     // friends ticked on the host card, invited as the race is made
  let invites = [], invitesState = 'unknown', panelMsg = { text: '', kind: '' };
  const toasted = new Set(), invitedNow = new Set();

  // ---- Calling the server ------------------------------------------------------
  // Every reply carries server_now; the quickest round trips set the clock offset, so everyone's
  // countdown ends on the same instant.
  function call(fn, params) {
    const t0 = Date.now();
    return Account.rpc(fn, params).then(r => {
      const t1 = Date.now(), rtt = t1 - t0;
      if (r && r.server_now && rtt <= bestRtt + 40) { offset = Date.parse(r.server_now) - (t0 + t1) / 2; bestRtt = Math.min(bestRtt, rtt); }
      return r;
    });
  }
  function errText(e) {
    switch (e && e.code) {
      case 'a2o_race_not_found': return 'No open race has that code. Check it with your friend.';
      case 'a2o_race_started': return 'That race has already started.';
      case 'a2o_race_closed': return 'That race is over.';
      case 'a2o_race_full': return `That race is full (${MAX} fruits).`;
      case 'a2o_fruit_taken': return 'Someone else just took that fruit. Pick another one!';
      case 'a2o_not_friends': return 'You can only invite friends.';
      case 'a2o_not_host': return 'Only the host can start the race.';
      case 'a2o_need_players': return 'You need at least one more racer.';
      case 'a2o_bad_race': return "That race setting isn't allowed.";
      case 'a2o_rate_limited': case 'rate_limited': return 'Too many tries. Wait a minute, then try again.';
      case 'offline': return "Can't reach the server. Check your connection.";
      case 'not_deployed': return 'Live races are being switched on. Try again soon.';
      case 'unauthorized': return 'Your sign-in ran out. Sign in again to race.';
      default: return 'Something went wrong. Try again in a moment.';
    }
  }
  const toast = (html, kind) => { if (typeof AccountUI !== 'undefined') AccountUI.toast(html, kind); };

  // ---- The Fruit Dash panel on the home screen -----------------------------------------
  // Left: join a race (or sign in). Right: pick a difficulty, then host a race or practise solo.
  const panel = $('racePanel');
  const gate = (icon, title, text, btns) => `<div class="rp-box rp-gate"><div class="rp-icon" aria-hidden="true">${icon}</div><h3>${title}</h3><p>${text}</p>${btns ? `<div class="rp-btns">${btns}</div>` : ''}</div>`;
  function leftBox() {
    const s = Account.status;
    if (s === 'checking') return gate('⏳', 'Connecting…', 'Getting the race server ready.');
    if (s === 'unavailable' || invitesState === 'not_deployed') return gate('🚧', 'Live races are almost here', 'Racing your friends needs the race server, and it isn’t switched on yet (or can’t be reached). Practise solo in the meantime!', '<button type="button" class="rp-btn" data-race="retry">↻ Check again</button>');
    if (s === 'restricted') return gate('🚫', 'Races are off for your account', `Your Warden Chat account is ${Account.restriction && Account.restriction.status === 'banned' ? 'banned' : 'suspended'}, so you can’t race right now.`);
    if (s === 'signedOut') return gate('🏁', 'Race your friends live', 'Up to 8 fruits, the same matchups at the same time, 60 seconds. Races need a <span class="wc-badge">💬 Warden Chat</span> account.',
      '<button type="button" class="rp-btn go" data-race="signin">Sign in</button><button type="button" class="rp-btn" data-race="signup">Create an account</button>');
    return `<form class="rp-box" id="raceJoinForm" autocomplete="off">
        <h3>🎟️ Join a race</h3>
        <div class="rp-join"><input id="raceCode" maxlength="9" placeholder="6-letter code" spellcheck="false" autocapitalize="characters" aria-label="Race code" aria-describedby="raceJoinMsg">
        <button type="submit" class="rp-btn go" id="raceJoin" disabled>🏁 Join</button></div>
        <div class="rp-msg ${panelMsg.kind}" id="raceJoinMsg" aria-live="polite">${esc(panelMsg.text || 'Type the code from your friend’s race lobby.')}</div>
        <div class="rp-invites" id="raceInvites"></div>
      </form>`;
  }
  function rightBox() {
    const signed = Account.status === 'signedIn' && invitesState !== 'not_deployed';
    const b = typeof A2OGame !== 'undefined' ? A2OGame.best('race', host.diff) : 0;
    return `<div class="rp-box">
        <h3>⏱️ 60-second dash <button type="button" class="rp-fruit" data-race="fruit" title="Change your fruit" aria-label="Your fruit: ${fruitOf(fav).name}. Change it">${fruitOf(fav).emoji}<span>${esc(fruitOf(fav).name)}</span> ▾</button></h3>
        <div class="rp-row" id="raceDiff" role="group" aria-label="Difficulty">${DIFFS.map(([v, label]) => `<button type="button" data-v="${v}" class="${v === host.diff ? 'active' : ''}" aria-pressed="${v === host.diff}">${label}</button>`).join('')}</div>
        <div class="rp-info">${esc(DIFF_INFO[host.diff])} · <b>${b ? 'Best: ' + n(b) : 'No best yet'}</b></div>
        ${signed ? `<div class="rp-pick" id="racePick">${pickList()}</div>` : ''}
        <div class="rp-btns">${signed ? `<button type="button" class="rp-btn go" data-race="create" title="You also get a 6-letter code for anyone else. Up to ${MAX} fruits.">🏁 Host a race</button>` : ''}<button type="button" class="rp-btn${signed ? '' : ' go'}" data-race="practice">▶ Practise solo</button></div>
      </div>`;
  }
  function renderPanel() {
    if (!panel) return;
    panel.innerHTML = leftBox() + rightBox();
    renderInvites();
  }
  // Friends to invite straight away; the race code is there too, for anyone else.
  function pickList() {
    const f = Account.friends;
    if (!f) { Account.loadFriends().then(() => { const b = $('racePick'); if (b) b.innerHTML = pickList(); }); return '<span class="rp-note">Loading your friends…</span>'; }
    if (!f.friends.length) return '<span class="rp-note">No friends yet? Add them from your account, top left.</span>';
    const ids = new Set(f.friends.map(x => x.user_id));
    [...picked].forEach(id => { if (!ids.has(id)) picked.delete(id); });
    return '<span class="rp-label">Invite:</span>' + f.friends.map(x => `<button type="button" class="rp-chip${picked.has(x.user_id) ? ' on' : ''}" data-pick="${esc(x.user_id)}" aria-pressed="${picked.has(x.user_id)}">${picked.has(x.user_id) ? '✓ ' : ''}${esc(x.username)}</button>`).join('');
  }
  function renderInvites() {
    const box = $('raceInvites');
    if (box) box.innerHTML = invites.length
      ? invites.map(i => `<div class="rp-inv">${avatar(i.from_username)}<span class="rp-inv-text"><b>${esc(i.from_username)}</b> invited you<small>${esc(DIFF_NAME[i.diff] || i.diff)} · ${i.players} in</small></span>
          <button type="button" class="fr-btn yes" data-race="join" data-code="${esc(i.code)}">Join</button><button type="button" class="fr-btn subtle" data-race="decline" data-id="${esc(i.race_id)}" aria-label="Decline">✕</button></div>`).join('')
      : '<p class="rp-none">📨 No invites right now. Friends can invite you from their race lobby.</p>';
    tabBadge();
  }
  function tabBadge() {
    const b = document.querySelector('.type-btn[data-type="race"]');
    if (!b) return;
    let dot = b.querySelector('.race-badge');
    if (invites.length && !dot) { dot = document.createElement('span'); dot.className = 'race-badge'; b.appendChild(dot); }
    if (dot) { if (invites.length) { dot.textContent = invites.length; dot.title = `${invites.length} race invite${invites.length === 1 ? '' : 's'}`; } else dot.remove(); }
  }
  function say(text, kind) { panelMsg = { text, kind: kind || '' }; const m = $('raceJoinMsg'); if (m) { m.className = 'rp-msg ' + (kind || ''); m.textContent = text; } }

  if (panel) {
    panel.addEventListener('input', e => {
      if (e.target.id !== 'raceCode') return;
      const code = tidy(e.target.value), ok = code.length === 6 && [...code].every(c => CODE_CHARS.includes(c));
      $('raceJoin').disabled = !ok || busy;
      say(!code ? 'Type the code from your friend’s race lobby.' : code.length < 6 ? `${code.length} of 6 letters…` : ok ? '✅ Ready to join' : "That doesn't look like a race code.", ok ? 'ok' : code.length > 6 || (code.length === 6 && !ok) ? 'bad' : '');
    });
    // typing a code shouldn't also switch tabs or start a dash
    panel.addEventListener('keydown', e => { if (e.target.id === 'raceCode') e.stopPropagation(); });
    panel.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'raceJoinForm') join(tidy($('raceCode').value)); });
    panel.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || busy) return;
      if (b.closest('#raceDiff')) { click(); host.diff = b.dataset.v; saveHost(); renderPanel(); return; }
      if (b.dataset.pick) { click(); const id = b.dataset.pick; if (picked.has(id)) picked.delete(id); else picked.add(id); $('racePick').innerHTML = pickList(); return; }
      const a = b.dataset.race;
      if (!a) return;
      click();
      if (a === 'signin' || a === 'signup') AccountUI.open(a);
      else if (a === 'retry') { invitesState = 'unknown'; Account.init().then(() => { if (Account.status === 'signedIn') loadInvites(); renderPanel(); }); }
      else if (a === 'practice') A2OGame.practice(host.diff, fav);
      else if (a === 'fruit') openPicker();
      else if (a === 'create') create(b);
      else if (a === 'join') join(b.dataset.code);
      else if (a === 'decline') call('a2o_race_decline', { race_id: b.dataset.id }).then(loadInvites, loadInvites);
    });
  }
  const saveHost = () => { try { localStorage.setItem('a2o.raceHost', JSON.stringify(host)); } catch (e) { /* ignore */ } };

  function create(btn) {
    busy = true; if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
    call('a2o_race_create', { diff: host.diff }).then(r => {
      busy = false; enterLobby(r);
      // invite the friends ticked on the host card
      [...picked].forEach(id => call('a2o_race_invite', { race_id: r.race_id, friend_id: id }).then(() => { invitedNow.add(id); renderLobby(); }, () => {}));
    }, e => { busy = false; renderPanel(); say(errText(e), 'bad'); if (!$('raceJoinMsg')) toast(errText(e), 'warn'); });
  }
  function join(code) {
    if (!code) return;
    busy = true; say('Joining…');
    const btn = $('raceJoin'); if (btn) btn.disabled = true;
    call('a2o_race_join', { code }).then(r => { busy = false; say(''); const i = $('raceCode'); if (i) i.value = ''; enterLobby(r); },
      e => { busy = false; say(errText(e), 'bad'); if (btn) btn.disabled = false; if (!$('raceCode')) toast(errText(e), 'warn'); });
  }

  // Invites: checked every 10 seconds on the home screen, with a notice for each new one.
  function loadInvites() {
    if (Account.status !== 'signedIn') { invites = []; tabBadge(); return Promise.resolve(); }
    const before = invitesState;
    return call('a2o_race_invites').then(list => {
      invitesState = 'ok';
      invites = Array.isArray(list) ? list : [];
      invites.forEach(i => {
        if (toasted.has(i.race_id)) return;
        toasted.add(i.race_id);
        if (phase === 'none') toast(`📨 <b>${esc(i.from_username)}</b> invited you to a race · ${esc(describe(i))} <button type="button" class="acct-link" data-race-code="${esc(i.code)}">Join</button>`, 'good');
      });
    }, e => { invitesState = e.code === 'not_deployed' ? 'not_deployed' : 'error'; }).then(() => {
      if (before !== invitesState && raceTabShown()) renderPanel(); else renderInvites();
      tabBadge();
    });
  }
  const raceTabShown = () => typeof A2OGame !== 'undefined' && A2OGame.state === 'title' && A2OGame.type === 'race';
  $('acctToast').addEventListener('click', e => { const b = e.target.closest('[data-race-code]'); if (b) { click(); $('acctToast').className = 'acct-toast'; join(b.dataset.raceCode); } });
  setInterval(() => { if (Account.status === 'signedIn' && phase === 'none' && !document.hidden && A2OGame.state === 'title') loadInvites(); }, 10000);

  // ---- Picking a fruit ---------------------------------------------------------------
  // The eight fruits, drawn by the kitchen's own painter. In a lobby, ones other racers have are
  // taken; on the home screen it just sets your favourite.
  function fruitButtons(taken, mine) {
    return FRUITS.map((f, i) => {
      const who = taken.get(i), isMine = i === mine;
      return `<button type="button" class="fp-btn${isMine ? ' on' : ''}" data-fruit="${i}" ${who && !isMine ? 'disabled' : ''} aria-pressed="${isMine}" title="${esc(f.name)}${who && !isMine ? ' · ' + esc(who) : ''}">
        <canvas width="120" height="120" data-paint="${i}"></canvas><span>${esc(f.name)}</span>${who && !isMine ? `<small>${esc(who)}</small>` : ''}</button>`;
    }).join('');
  }
  function paintAll(root) {
    root.querySelectorAll('canvas[data-paint]').forEach(cv => {
      const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
      Kitchen.paintFruit(c, +cv.dataset.paint, 60, 112, 1.4);
    });
  }
  const picker = document.createElement('div');
  picker.id = 'fruitPick'; picker.className = 'modal hidden';
  picker.innerHTML = `<div class="modal-box fp-box" role="dialog" aria-modal="true" aria-labelledby="fpTitle">
      <h2 id="fpTitle">Pick your fruit</h2><p class="acct-sub">Who do you want to run as? In a race, everyone is a different fruit.</p>
      <div class="fp-grid" id="fpGrid"></div>
      <button type="button" class="big-btn quiet" data-fp="close">Done</button></div>`;
  $('stage').appendChild(picker);
  function openPicker() {
    $('fpGrid').innerHTML = fruitButtons(new Map(), fav);
    paintAll(picker);
    picker.classList.remove('hidden');
  }
  picker.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (e.target === picker || (b && b.dataset.fp === 'close')) { click(); picker.classList.add('hidden'); renderPanel(); return; }
    if (b && b.dataset.fruit) { click(); fav = +b.dataset.fruit; saveFav(); $('fpGrid').innerHTML = fruitButtons(new Map(), fav); paintAll(picker); }
  });
  picker.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') { picker.classList.add('hidden'); renderPanel(); } });

  // ---- The lobby -------------------------------------------------------------------
  const lobby = document.createElement('div');
  lobby.id = 'raceLobby'; lobby.className = 'modal hidden';
  lobby.innerHTML = `<div class="modal-box race-lobby" role="dialog" aria-modal="true" aria-labelledby="rlTitle">
      <h2 id="rlTitle">🏁 Race lobby</h2>
      <div class="rl-code"><span class="rl-code-label">Race code</span><span class="rl-code-val" id="rlCode"></span><button type="button" class="rl-copy" data-race="copy">📋 Copy</button></div>
      <p class="rl-desc" id="rlDesc"></p>
      <div class="rl-cols">
        <div><h3 class="fr-h" id="rlCount">Racers</h3><div class="rl-list" id="rlPlayers"></div></div>
        <div><h3 class="fr-h">Your fruit</h3><div class="fp-grid small" id="rlFruits"></div>
          <h3 class="fr-h">Invite friends</h3><div class="rl-list short" id="rlFriends"></div></div>
      </div>
      <div class="af-error" id="rlMsg" role="alert"></div>
      <p class="rl-wait" id="rlWait" aria-live="polite"></p>
      <div class="acct-btns"><button type="button" class="big-btn go" id="rlStart" data-race="start">🏁 Start race</button><button type="button" class="big-btn quiet" data-race="leave">Leave</button></div>
    </div>`;
  $('stage').appendChild(lobby);

  function enterLobby(r) {
    stop();
