<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Apples to Oranges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Apples to Oranges — a 1600×900 game scaled to fit any window. The stage stretches in one
   direction to fill the tab, so there are no black bars; things are pinned to its edges. */
:root {
  --ink: #f4f7ff;
  --muted: #b9c3e6;
  --panel: rgba(14, 20, 48, 0.8);
  --panel-edge: rgba(255, 255, 255, 0.14);
  --accent: #ffd23f;
  --hot: #ff5d73;
  --good: #7ddc6f;
  --t1: #c9d1e3;
  --t2: #6fe08a;
  --t3: #4fb3ff;
  --t4: #c77dff;
  --t5: #ffc531;
  --apple1: #ff6b7d;
  --apple2: #e0304d;
  --orange1: #ffb547;
  --orange2: #ff7e1f;
  --font: 'Fredoka', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #5fb4ff; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font-family: inherit; cursor: pointer; color: inherit; }
.hidden { display: none !important; }

/* clear of phone notches and rounded corners */
#viewport {
  position: fixed; overflow: hidden;
  top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
}
#stage {
  position: absolute; left: 0; top: 0; width: 1600px; height: 900px;
  transform-origin: 0 0; overflow: hidden; user-select: none; -webkit-user-select: none;
}
#scene, #sceneOld { position: absolute; left: 0; top: 0; display: block; }
/* switching modes: the old world slides out as the new one slides in, timed with the tab highlight */
:root { --slide: 0.55s cubic-bezier(.65,0,.35,1); }
#scene.sliding, #sceneOld.sliding { transition: transform var(--slide); }

/* ---------- Home ---------- */
#home { position: absolute; inset: 0; }
.corner-btns { position: absolute; left: 28px; top: 22px; display: flex; gap: 12px; }
.round-btn {
  width: 66px; height: 66px; border-radius: 18px; border: 2px solid var(--panel-edge);
  background: var(--panel); font-size: 28px; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.round-btn:hover { transform: translateY(-2px); }
.round-btn.off { opacity: 0.55; text-decoration: line-through; }
.home-main {
  position: absolute; right: 28px; top: 10px; bottom: 24px; width: 1020px;
  display: flex; flex-direction: column; align-items: center;
}
.logo { position: relative; text-align: center; line-height: 0.86; margin-top: 40px; animation: drop-in 0.6s cubic-bezier(.2,1.4,.4,1); }
.logo-l1, .logo-l2 { font-weight: 700; letter-spacing: 0.02em; }
.logo-apples, .logo-l2 {
  background-clip: text; -webkit-background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #1b2550) drop-shadow(0 0 2px #1b2550) drop-shadow(0 8px 10px rgba(0,0,0,0.25));
}
.logo-apples { font-size: 100px; background-image: linear-gradient(#ff8a98, #e0304d 70%); }
.logo-to {
  font-size: 54px; color: #fff; display: inline-block; transform: rotate(-8deg) translateY(-30px);
  text-shadow: 0 3px 0 #1b2550, 0 0 3px #1b2550;
}
.logo-l2 { font-size: 112px; background-image: linear-gradient(#ffd166, #ff8a1f 55%, #f25c05); }
/* "SirSC's" sits on top of the title's first letters, like Brain Rocket's, pulsing bigger and smaller */
.logo-by {
  position: absolute; left: 34px; top: -20px; font-size: 44px; font-weight: 700; z-index: 1;
  transform: rotate(-14deg); transform-origin: 50% 60%; animation: by-pulse 1.6s ease-in-out infinite;
  background: linear-gradient(#ffe36b, #ff9f1c); background-clip: text; -webkit-background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #1b2550);
}
.logo-fruit { position: absolute; font-size: 72px; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.3)); animation: float 3s ease-in-out infinite; }
.logo-fruit-a { right: -92px; top: 0; }
.logo-fruit-o { right: -60px; bottom: -10px; animation-delay: -1.5s; }
.tagline { margin: 8px 0 12px; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 23px; text-align: center; line-height: 1.3; text-shadow: 0 2px 6px rgba(10,20,60,0.55); }
.tagline b { color: var(--accent); }

.modes { display: flex; gap: 18px; }
.mode {
  width: 240px; height: 248px; border-radius: 28px; border: 4px solid rgba(255,255,255,0.75);
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 14px;
  box-shadow: 0 10px 0 rgba(0,0,0,0.18), 0 14px 30px rgba(0,0,0,0.25);
  transition: transform 0.15s;
}
.mode:hover { transform: translateY(-6px) rotate(-1deg); }
.mode:active { transform: translateY(0); }
.mode-owen { background: linear-gradient(#5ee39a, #22a85a); }
.mode-medium { background: linear-gradient(#5aa8ff, #2f6fe0); }
.mode-hard { background: linear-gradient(#ff7a8a, #d92b48); }
.mode-ultra { background: linear-gradient(#b67dff, #6a2fd6); border-color: #e2c8ff; }
.mode-ic { font-size: 46px; line-height: 1; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25)); }
.mode-name { font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: 0.03em; text-shadow: 0 3px 0 rgba(0,0,0,0.2); }
.mode-pill { background: rgba(0,0,0,0.22); border-radius: 999px; padding: 3px 16px; font-weight: 600; font-size: 19px; }
.mode-desc { font-size: 16.5px; line-height: 1.3; opacity: 0.95; }
.mode-best { margin-top: auto; font-weight: 700; font-size: 19px; color: #fff6c8; }

.rules {
  margin-top: 16px; width: 100%; background: var(--panel); min-height: 118px; align-content: center;
  transition: filter 0.25s, opacity 0.25s; border: 2px solid var(--panel-edge);
  border-radius: 24px; padding: 14px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px;
  font-size: 17.5px; line-height: 1.35; color: var(--muted); backdrop-filter: blur(6px);
}
.rules b { color: #fff; }
.version { position: absolute; right: 12px; bottom: 8px; font-size: 14px; background: rgba(0,0,0,0.45); padding: 2px 8px; border-radius: 6px; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: 110px; right: 28px; top: 20px; display: flex; gap: 14px; align-items: stretch; animation: drop-in 0.5s cubic-bezier(.2,1.4,.4,1); }
.hud-spacer { flex: 1; }
.hud-pill {
  background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 22px;
  padding: 8px 20px 10px; display: flex; flex-direction: column; justify-content: center;
  backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); min-width: 150px;
}
.pill-label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.pill-value { font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill-value.loc { font-size: 24px; white-space: nowrap; line-height: 1.4; }
.pill-sub { font-size: 15px; color: var(--muted); }
.score-pill .pill-value { color: var(--accent); }
.score-pill.bump .pill-value { animation: bump 0.4s ease; }
.alt-pill { min-width: 340px; }
.streak-pill .flame { display: inline-block; filter: grayscale(1) opacity(0.5); transition: filter 0.3s; }
.streak-pill.hot .flame { filter: none; animation: flicker 0.5s infinite alternate; }
.streak-pill.blazing { border-color: #ff9a3c; box-shadow: 0 0 24px rgba(255,140,40,0.6); }
.lives { display: flex; gap: 6px; margin-top: 4px; font-size: 30px; line-height: 1; }
.lives span { transition: all 0.3s; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
.lives span.gone { filter: grayscale(1) opacity(0.3); transform: scale(0.8); }
.lives span.pop { animation: pop 0.6s ease; }
.pause-btn { min-width: 0; width: 70px; align-items: center; font-size: 28px; padding: 0; }

/* milestone rail */
#rail { position: absolute; left: 22px; top: 46px; bottom: 22px; width: 60px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
#rail::before { content: ''; position: absolute; left: 50%; top: 20px; bottom: 20px; width: 4px; margin-left: -2px; background: rgba(255,255,255,0.25); border-radius: 2px; }
.rail-stop {
  position: relative; width: 36px; height: 36px; border-radius: 50%; background: rgba(14,20,48,0.75);
  border: 2px solid rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 18px;
  filter: grayscale(1); opacity: 0.6; transition: all 0.4s;
}
.rail-stop.done { filter: none; opacity: 1; border-color: var(--accent); box-shadow: 0 0 12px rgba(255,210,63,0.5); }
.rail-stop.next { opacity: 1; filter: none; border-color: #fff; animation: pulse 1.4s infinite; }
/* past 50,000: infinite mode, the whole rail glows */
#rail.infinite::before { background: linear-gradient(#ffd23f, #ff5d73, #c77dff, #4fd1ff); box-shadow: 0 0 14px rgba(255,210,63,0.6); }
#rail.infinite::after { content: '♾️'; position: absolute; top: -34px; left: 50%; transform: translateX(-50%); font-size: 22px; filter: drop-shadow(0 0 6px #ffd23f); }

/* milestone banner */
#reached {
  position: absolute; left: 90px; top: 150px; width: 470px; text-align: center; pointer-events: none;
  animation: reached 2.8s ease forwards;
}
.reached-ic { font-size: 70px; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.3)); }
.reached-kicker { font-size: 24px; font-weight: 700; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
.reached-name { font-size: 54px; font-weight: 700; line-height: 1.05; text-shadow: 0 4px 0 rgba(20,30,80,0.5), 0 0 20px rgba(0,0,0,0.3); }
.reached-sub { font-size: 22px; color: #e8eeff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

/* ---------- The matchup panel ---------- */
#panel {
  position: absolute; right: 28px; top: 138px; width: 1010px;
  background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 32px;
  padding: 18px 28px 16px; backdrop-filter: blur(6px); box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  animation: drop-in 0.55s cubic-bezier(.2,1.3,.4,1);
}
.panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.prompt { font-size: 32px; font-weight: 600; }
.hi-word { color: #7dff9c; }
.lo-word { color: #ff8fa0; }
.qcount { color: var(--muted); font-size: 20px; }

.cards { position: relative; display: flex; justify-content: space-between; align-items: stretch; height: 430px; }
.card {
  position: relative; width: 430px; height: 100%; border-radius: 28px; border: 4px solid rgba(255,255,255,0.8);
  padding: 18px 22px 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
  box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 12px 30px rgba(0,0,0,0.3);
}
.card-l { background: linear-gradient(160deg, var(--apple1), var(--apple2)); }
.card-r { background: linear-gradient(160deg, var(--orange1), var(--orange2)); }
.chip {
  display: inline-flex; align-items: center; gap: 8px; background: rgba(20,24,60,0.35); border-radius: 999px;
  padding: 5px 16px 5px 12px; font-weight: 600; font-size: 19px;
}
.chip-ic { font-size: 20px; }
.ctext { margin-top: 14px; font-weight: 600; line-height: 1.15; text-shadow: 0 2px 0 rgba(0,0,0,0.15); min-height: 3.1em; display: flex; align-items: center; justify-content: center; }
.cnum {
  margin-top: 4px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #fff;
  text-shadow: 0 5px 0 rgba(60,10,20,0.35), 0 0 3px rgba(60,10,20,0.4); white-space: nowrap;
}
.cnum.hidden-num { color: rgba(255,255,255,0.9); animation: wobble 2.2s ease-in-out infinite; }
.cunit { font-size: 24px; font-weight: 600; opacity: 0.95; margin-top: 4px; min-height: 30px; }
.cnote { font-size: 17px; opacity: 0.9; margin-top: 6px; min-height: 22px; }
.choices { margin-top: auto; display: flex; gap: 12px; width: 100%; }
.choices button {
  flex: 1; height: 82px; border-radius: 20px; border: 3px solid rgba(255,255,255,0.85);
  font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.25); transition: transform 0.1s, filter 0.1s;
}
.choices button:hover { transform: translateY(-3px); filter: brightness(1.08); }
.choices button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.btn-hi { background: linear-gradient(#5ee39a, #1f9e52); }
.btn-lo { background: linear-gradient(#5aa8ff, #2a5fd0); }
/* 🤝 Tie: right when the two are within 5% of each other */
.btn-tie { background: linear-gradient(#c79bff, #7a3fd6); }
.choices { gap: 9px; }
.choices button { white-space: nowrap; font-size: 27px; padding: 0 6px; }
.choices button.btn-tie { flex: 0 0 88px; font-size: 27px; }
#panel.strip .strip-choices button.btn-tie { font-size: 23px; }
.choices button.chosen { outline: 5px solid #fff; outline-offset: 2px; }
.choices.locked button { pointer-events: none; }
.choices.locked button:not(.chosen) { opacity: 0.35; }
.card.revealed .choices button { height: 50px; font-size: 22px; transition: height 0.25s, font-size 0.25s; }
.card.revealed .choices button:not(.chosen) { display: none; }
.kbd { font-size: 14px; opacity: 0.7; font-weight: 500; }

.vs {
  position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; z-index: 2;
  border-radius: 50%; background: #1b2550; border: 4px solid var(--accent); color: var(--accent);
  display: grid; place-items: center; font-size: 36px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
}
.card.right-ans { box-shadow: 0 0 0 6px #7dff9c, 0 0 40px rgba(125,255,156,0.8); }
.card.wrong-ans { box-shadow: 0 0 0 6px #ff4057, 0 0 40px rgba(255,64,87,0.7); animation: shake 0.5s ease; }
.card.out { transition: transform 0.4s ease-in, opacity 0.4s; transform: translateX(-120px) scale(0.85); opacity: 0; }
.card.shift { transition: transform 0.42s cubic-bezier(.5,0,.3,1); transform: translateX(var(--shift, -524px)); }
.card.in { animation: card-in 0.45s cubic-bezier(.2,1.3,.4,1); }
.card.counting .cnum { color: #fff6c8; }

.photo-banner {
  position: absolute; left: 50%; bottom: -44px; transform: translateX(-50%); z-index: 3; white-space: nowrap;
  background: linear-gradient(#ffe36b, #ffb21f); color: #3a1d00; font-weight: 700; font-size: 34px; letter-spacing: 0.06em;
  padding: 6px 26px; border-radius: 16px; border: 3px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  animation: photo-pulse 0.5s ease-in-out infinite alternate;
}

.timer-row { margin-top: 16px; }
.timer { height: 16px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
.timer-fill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff5d73, #ffd23f 50%, #7ddc6f); transform-origin: left; }
.timer-sub { display: flex; justify-content: space-between; font-size: 19px; margin-top: 4px; min-height: 24px; }
#speedLabel { color: var(--accent); font-weight: 600; }
#timerSecs { font-weight: 600; font-variant-numeric: tabular-nums; }

.result { height: 104px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.result-quip { font-size: 34px; font-weight: 700; line-height: 1.1; }
.result-line { font-size: 19px; color: #e6ebff; margin-top: 4px; max-width: 940px; }
.result-pts { font-size: 19px; font-weight: 600; margin-top: 2px; }
.result.pop .result-quip { animation: bump 0.45s ease; }
.q-good { color: #7dff9c; }
.q-bad { color: #ff7186; }
.q-photo { color: var(--t5); font-size: 42px; text-shadow: 0 0 18px rgba(255,197,49,0.6); }

.legend { display: flex; gap: 14px; justify-content: center; font-size: 16px; color: var(--muted); }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash 0.6s ease-out; }

/* ---------- Modals ---------- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,10,30,0.55); backdrop-filter: blur(4px); z-index: 10; }
.modal-box {
  min-width: 460px; background: #172050; border: 3px solid var(--panel-edge); border-radius: 32px;
  padding: 28px 36px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: drop-in 0.45s cubic-bezier(.2,1.3,.4,1);
}
.modal-box h2 { margin: 0; font-size: 46px; }
.big-btn {
  min-width: 260px; height: 64px; border-radius: 18px; border: 3px solid rgba(255,255,255,0.7);
  background: #2f3c7e; font-size: 24px; font-weight: 700; box-shadow: 0 5px 0 rgba(0,0,0,0.3);
}
.big-btn:hover { filter: brightness(1.12); }
.big-btn.go { background: linear-gradient(#5ee39a, #1f9e52); }
.big-btn.quiet { background: transparent; border-color: rgba(255,255,255,0.3); }
.over-box { width: 760px; }
.over-kicker { color: var(--muted); font-size: 20px; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }
.over-score { font-size: 84px; font-weight: 700; color: var(--accent); line-height: 1; }
.over-best { font-size: 22px; min-height: 26px; font-weight: 600; }
.over-best.new { color: #7dff9c; animation: bump 0.6s ease 0.3s; }
.over-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.stat { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 26px; }
.stat span { font-size: 15px; color: var(--muted); }
.over-killer { font-size: 19px; text-align: center; color: #ffd0d6; background: rgba(255,64,87,0.12); border-radius: 16px; padding: 10px 16px; width: 100%; }
.over-killer:empty { display: none; }
.over-btns { display: flex; gap: 12px; margin-top: 6px; }
.over-btns .big-btn { min-width: 0; padding: 0 24px; }

#rotate { display: none; position: absolute; inset: 0; z-index: 50; background: #172050; place-items: center; text-align: center; font-size: 60px; font-weight: 700; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }

/* ---------- Animations ---------- */
@keyframes drop-in { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes by-pulse { 0%, 100% { transform: rotate(-14deg) scale(1); } 50% { transform: rotate(-14deg) scale(1.18); } }
@keyframes float { 50% { transform: translateY(-12px) rotate(6deg); } }
@keyframes bump { 40% { transform: scale(1.25); } }
@keyframes flicker { to { transform: scale(1.15) rotate(6deg); } }
@keyframes pop { 30% { transform: scale(1.5); } 100% { transform: scale(0.8); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,255,255,0.25); } }
@keyframes wobble { 50% { transform: rotate(-4deg) scale(1.06); } }
@keyframes shake { 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }
@keyframes card-in { from { transform: translateX(160px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes photo-pulse { to { transform: translateX(-50%) scale(1.08); } }
@keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes reached {
  0% { opacity: 0; transform: scale(0.6); } 12% { opacity: 1; transform: scale(1.06); } 20% { transform: scale(1); }
  80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); }
}
@media (prefers-reduced-motion: reduce) {
  .logo-by, .logo-fruit, .ltd-badge, .ltd-badge::before, .cnum.hidden-num, .photo-banner, .rail-stop.next { animation: none; }
}

/* ---------- Mode picker (like Brain Rocket's): a highlight glides to the chosen tab ---------- */
.type-toggle {
  position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 4px; isolation: isolate;
  background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 24px; padding: 6px; margin-bottom: 18px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25); backdrop-filter: blur(6px);
}
.type-btn {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 12px;
  border: 0; background: transparent; border-radius: 18px; text-align: left; transition: color 0.3s;
}
.type-btn[hidden] { display: none; }
.type-icon { font-size: 30px; line-height: 1; }
.type-txt { display: flex; flex-direction: column; line-height: 1.1; }
.type-name { font-size: 21px; font-weight: 700; }
.type-sub { font-size: 13.5px; font-weight: 500; color: var(--muted); transition: color 0.3s; }

/* the Halloween tab's LIMITED TIME badge: a rainbow that keeps sliding along, under an orange layer that fades away and back */
.ltd-badge {
  position: absolute; top: -14px; right: 6px; z-index: 2; padding: 3px 10px; border-radius: 999px; overflow: hidden; isolation: isolate;
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;

}

@keyframes ltd-rainbow { to { background-position: 300% 0; } }
@keyframes ltd-orange { 0%, 15% { opacity: 1; } 40%, 75% { opacity: 0; } 100% { opacity: 1; } }


/* ---------- HUD bits ---------- */

/* once the conversion is showing, the answer buttons step aside to make room */

/* ---------- Guess the Number ---------- */

.card-g { width: 520px; height: 100%; background: linear-gradient(160deg, #8fd16a, #3f9a3a); }

.guess-input { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.g-label { font-size: 20px; color: var(--muted); font-weight: 600; text-align: center; }
.g-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g-choice {
  height: 92px; border-radius: 20px; border: 3px solid rgba(255,255,255,0.8); background: linear-gradient(#5aa8ff, #2a5fd0);

.g-value { font-size: 64px; font-weight: 700; text-align: center; color: #fff6c8; font-variant-numeric: tabular-nums; line-height: 1; }
.g-unit { font-size: 22px; text-align: center; color: var(--muted); font-weight: 600; margin-top: -6px; }
.g-slider { width: 100%; height: 44px; accent-color: #ffb52e; cursor: pointer; }
.g-ends { display: flex; justify-content: space-between; font-size: 16px; color: var(--muted); margin-top: -8px; }
.g-field {
  width: 100%; height: 86px; border-radius: 20px; border: 4px solid #4fd1ff; background: #fff; color: #1b2550;

.g-track .ans, .g-track .you { position: absolute; top: -10px; width: 6px; height: 38px; margin-left: -3px; border-radius: 3px; }
.g-track .ans { background: #7dff9c; box-shadow: 0 0 12px rgba(125,255,156,0.8); }
.g-track .you { background: #ffd23f; transition: left 0.6s cubic-bezier(.2,1.2,.4,1); }

.g-track .you .tag { color: #ffd23f; }
.t0 { color: #ff7186; }

/* ---------- Halloween: the cards run along the bottom so the chase gets the whole width ---------- */
#panel.strip { left: 16px; right: 16px; top: auto; bottom: 14px; width: auto; padding: 12px 20px 10px; border-radius: 26px; }
#panel.strip .panel-top { display: none; }
#panel.strip .cards { height: 150px; justify-content: flex-start; gap: 14px; }
#panel.strip .card {
  flex: 1; min-width: 0; height: 100%; padding: 10px 16px; display: grid; grid-template-columns: 1fr 190px; grid-template-rows: auto 1fr auto;
  column-gap: 10px; text-align: left; align-items: center; border-width: 3px; border-radius: 22px;
}
#panel.strip .chip { grid-column: 1; grid-row: 1; justify-self: start; font-size: 15px; padding: 3px 12px 3px 8px; }

#panel.strip .cunit { grid-column: 2; grid-row: 3; text-align: center; font-size: 17px; margin: 0; min-height: 0; }
#panel.strip .choices { display: none; }
#panel.strip .vs { position: static; margin: auto 0; width: 64px; height: 64px; font-size: 24px; flex: none; }

.strip-choices { display: none; }

#panel.strip .strip-choices button {
  flex: 1; border-radius: 16px; border: 3px solid rgba(255,255,255,0.85); font-size: 23px; font-weight: 700;

}

#panel.strip .q-photo { font-size: 28px; }

.chase-row { margin-top: 10px; }
.chase-meter { height: 14px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
.chase-fill { height: 100%; width: 40%; border-radius: 999px; background: #7ddc6f; transition: background 0.3s; }
.chase-fill.mid { background: #ffb347; }

.chase-sub { display: flex; justify-content: space-between; font-size: 17px; margin-top: 3px; font-weight: 600; }
#chaseText.warn { color: #ff5d73; animation: bump 0.4s ease infinite; }
#panel.strip .legend { font-size: 14px; }

/* 🤝 A correct tie call gets a party */
.photo-banner.tie { background: linear-gradient(90deg, #c79bff, #ff7ad9, #ffd23f, #7ae0ff, #c79bff); background-size: 300% 100%; color: #2a0a40; animation: tie-banner 0.9s ease-out, tie-shimmer 1.6s linear infinite; }
@keyframes tie-banner { 0% { transform: translateX(-50%) scale(0.2) rotate(-12deg); } 55% { transform: translateX(-50%) scale(1.35) rotate(4deg); } 100% { transform: translateX(-50%) scale(1) rotate(0); } }
@keyframes tie-shimmer { to { background-position: 300% 0; } }
#panel.tie-party { animation: tie-party 0.7s ease-out 2; box-shadow: 0 0 60px rgba(199,155,255,0.8), 0 10px 40px rgba(0,0,0,0.3); }
@keyframes tie-party { 0%, 100% { transform: none; } 20% { transform: scale(1.025) rotate(-0.6deg); } 45% { transform: scale(1.01) rotate(0.6deg); } 70% { transform: scale(1.02) rotate(-0.3deg); } }

:root { --cool: #4fd1ff; }

}

/* the tab's NEW badge */
.new-badge {
  position: absolute; top: -14px; right: 6px; z-index: 2; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  background: linear-gradient(90deg, #ff4d6d, #ff8a1f, #f5c518, #2fa85a, #ff4d6d); background-size: 300% 100%;
  box-shadow: 0 2px 12px rgba(255,90,90,0.5); animation: ltd-rainbow 4s linear infinite;
}
.race-badge { position: absolute; top: -10px; left: 4px; z-index: 2; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff; background: var(--hot); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

/* the home panel: join a race on the left, the 60-second dash on the right */
.race-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 1014px; height: 248px; transition: filter 0.25s, opacity 0.25s; }
.race-panel.switching { filter: blur(5px); opacity: 0.55; }
.rp-box {
  display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 14px 18px; border-radius: 26px;
  background: var(--panel); border: 2px solid var(--panel-edge); backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.rp-box h3 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
.rp-gate { align-items: center; justify-content: center; text-align: center; }
.rp-gate p { margin: 0; font-size: 17px; color: var(--muted); line-height: 1.35; }
.rp-icon { font-size: 40px; line-height: 1; }
.rp-btns { display: flex; gap: 10px; margin-top: auto; }
.rp-gate .rp-btns { margin-top: 4px; }
.rp-btn {
  flex: 1; height: 54px; padding: 0 16px; border-radius: 16px; border: 3px solid rgba(255,255,255,0.7); white-space: nowrap;
  background: #2f3c7e; font-size: 20px; font-weight: 700; box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}
.rp-btn.go { background: linear-gradient(#5ee39a, #1f9e52); }
.rp-btn:hover { filter: brightness(1.12); }
.rp-btn:disabled { opacity: 0.45; filter: none; cursor: default; }
.rp-join { display: flex; gap: 8px; }
.rp-join .rp-btn { flex: none; }
#raceCode { flex: 1; min-width: 0; font: inherit; font-size: 28px; font-weight: 700; letter-spacing: 0.16em; text-align: center; text-transform: uppercase; padding: 4px 8px; border-radius: 16px; border: 3px solid var(--panel-edge); background: rgba(0,0,0,0.35); color: #fff; }
#raceCode:focus { outline: none; border-color: var(--accent); }
#raceCode::placeholder { font-size: 19px; letter-spacing: 0.04em; color: rgba(185,195,230,0.6); }
.rp-msg { font-size: 15px; color: var(--muted); min-height: 19px; }
.rp-msg.ok { color: var(--good); } .rp-msg.bad { color: #ff9aa9; }
.rp-invites { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.rp-inv { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 14px; background: rgba(255,210,63,0.12); border: 1px solid rgba(255,210,63,0.35); }
.rp-inv .acct-av { width: 30px; height: 30px; font-size: 16px; }
.rp-inv-text { flex: 1; min-width: 0; font-size: 16px; line-height: 1.2; text-align: left; }
.rp-inv-text small { display: block; font-size: 13px; color: var(--muted); }
.rp-none { margin: 0; font-size: 15px; color: var(--muted); }
.rp-row { display: flex; gap: 6px; }
.rp-row button { flex: 1; height: 42px; border-radius: 13px; border: 2px solid var(--panel-edge); background: rgba(255,255,255,0.06); font-size: 17px; font-weight: 700; white-space: nowrap; }
.rp-row button.active { background: linear-gradient(#ffe27a, #ffb52e); color: #3b2300; border-color: #fff3c4; }
.rp-info { font-size: 15px; color: var(--muted); }
.rp-info b { color: #fff6c8; }
.rp-fruit { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--panel-edge); background: rgba(255,255,255,0.08); font-size: 16px; font-weight: 600; }
.rp-fruit:hover { border-color: var(--accent); }
.rp-pick { display: flex; gap: 6px; align-items: center; min-height: 32px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rp-label, .rp-note { flex: none; font-size: 15px; color: var(--muted); white-space: nowrap; }
.rp-chip { flex: none; font: inherit; font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 2px solid var(--panel-edge); background: transparent; }
.rp-chip.on { background: var(--good); border-color: var(--good); color: #0f2a0b; }

/* picking a fruit */
.fp-box { width: 760px; min-width: 0; }
.fp-box h2 { font-size: 42px; }
.fp-box .acct-sub { margin: 0; }
.fp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.fp-btn { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 4px 8px; border-radius: 18px; border: 3px solid var(--panel-edge); background: rgba(255,255,255,0.06); font-size: 17px; font-weight: 700; }
.fp-btn canvas { width: 96px; height: 96px; }
.fp-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.6); transform: translateY(-2px); }
.fp-btn.on { border-color: var(--accent); background: rgba(255,210,63,0.16); box-shadow: 0 0 18px rgba(255,210,63,0.35); }
.fp-btn:disabled { opacity: 0.4; cursor: default; }
.fp-btn small { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-grid.small { gap: 6px; }
.fp-grid.small .fp-btn { padding: 2px 2px 4px; font-size: 13px; border-radius: 14px; }
.fp-grid.small .fp-btn canvas { width: 58px; height: 58px; }

/* the race lobby */
.race-lobby { width: 900px; min-width: 0; align-items: stretch; gap: 0; padding: 26px 36px; }
.race-lobby h2 { font-size: 44px; text-align: center; }
.rl-code { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 10px auto 4px; padding: 8px 10px 8px 18px; width: max-content; border-radius: 18px; background: rgba(0,0,0,0.35); border: 2px dashed var(--panel-edge); }
.rl-code-label { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rl-code-val { font-size: 40px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); user-select: all; }
.rl-copy { font: inherit; font-size: 16px; font-weight: 600; padding: 7px 12px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.12); }
.rl-desc { text-align: center; font-size: 19px; margin: 4px 0 6px; color: var(--muted); }
.rl-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.rl-list { max-height: 300px; overflow-y: auto; padding-right: 4px; }
.rl-list.short { max-height: 130px; }
.rl-list .fr-row { padding: 6px 10px; margin-bottom: 6px; }
.rl-list .fr-row.me { background: rgba(255,210,63,0.14); }
.rl-fruit, .rr-fruit { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: rgba(255,255,255,0.1); border: 3px solid; }
.rl-invited { font-size: 15px; color: var(--good); font-weight: 600; }
.rl-wait { text-align: center; font-size: 18px; margin: 10px 0 0; }
.race-lobby .af-error { text-align: center; }
.race-lobby .big-btn:disabled { opacity: 0.45; filter: none; }

/* 3, 2, 1, GO! */
#countdown { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 4; }
.cd-num { font-size: 190px; font-weight: 700; line-height: 1; color: #fff; text-shadow: 0 8px 0 rgba(20,30,80,0.45), 0 0 40px rgba(255,210,63,0.55); }
.cd-num.go { color: #7dff9c; }
.cd-num.pop { animation: cd-pop 0.9s cubic-bezier(.2,1.4,.4,1); }
@keyframes cd-pop { 0% { transform: scale(0.3); opacity: 0; } 35% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
.cd-sub { margin-top: 6px; font-size: 30px; font-weight: 700; padding: 6px 22px; border-radius: 999px; background: var(--panel); border: 2px solid var(--panel-edge); }
#panel.waiting { opacity: 0; pointer-events: none; }
#panel.strip.dash { transition: opacity 0.3s; }
.time-pill.hurry { border-color: var(--hot); box-shadow: 0 0 24px rgba(255,93,115,0.55); }
.time-pill.hurry .pill-value { color: #ff8a9b; animation: bump 0.5s ease infinite; }

/* the live board while racing */
.race-board { position: absolute; right: 28px; top: 138px; width: 330px; padding: 10px 12px; border-radius: 20px; background: var(--panel); border: 2px solid var(--panel-edge); box-shadow: 0 12px 30px rgba(0,0,0,0.35); backdrop-filter: blur(6px); z-index: 3; }
.rb-h { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); margin: 0 4px 6px; display: flex; justify-content: space-between; }
.rb-h span { color: var(--muted); letter-spacing: 0.14em; }
.rb-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 10px; font-size: 18px; }
.rb-row.me { background: rgba(255,210,63,0.16); }
.rb-row.left { opacity: 0.5; }
.rb-rank { width: 20px; text-align: center; font-weight: 700; color: var(--muted); }
.rb-fruit { font-size: 22px; }
.rb-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb-score { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.rb-flag { width: 22px; text-align: center; }

/* the results: a podium of fruits */
.race-results { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 16px; background: rgba(255,255,255,0.05); max-height: 330px; overflow-y: auto; }
.rr-row { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 12px; text-align: left; }
.rr-row.me { background: rgba(255,210,63,0.14); }
.rr-row.left { opacity: 0.55; }
.rr-fruit { width: 36px; height: 36px; font-size: 21px; }
.rr-rank { width: 34px; text-align: center; font-size: 22px; }
.rr-name { flex: 1; min-width: 0; font-size: 21px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr-score { font-size: 21px; font-weight: 700; color: var(--accent); }
.rr-vote { font-size: 15px; font-weight: 700; color: var(--muted); min-width: 64px; text-align: right; }
.rr-vote.yes { color: var(--good); }
.rr-wait { font-size: 16px; color: var(--muted); margin-top: 4px; text-align: center; }
#btnAgain:disabled { opacity: 0.5; filter: none; cursor: default; }
@media (prefers-reduced-motion: reduce) { .new-badge, .cd-num.pop, .time-pill.hurry .pill-value, .syncing .acct-dot { animation: none; } }
/* the kitchen's wall is light, so Fruit Dash's tagline sits on a panel */
#home[data-type="race"] .tagline span { display: inline-block; background: var(--panel); padding: 6px 20px; border-radius: 18px; backdrop-filter: blur(6px); }

</style>
</head>

    window.removeEventListener('pointermove', onLook);
    root.classList.remove('ss-gating');
    root.setAttribute('role', 'img');
    var ms = function (n) { return reduced ? 1 : n; };
    var at = function (t) { return t / EXIT.gone; };
    $('.ss-cta').animate([{ opacity: 1, transform: 'translateX(-50%)' }, { opacity: 0, transform: 'translateX(-50%) translateY(8px)' }],
      { duration: ms(260), easing: 'ease-out', fill: 'forwards' });
    $$('.ss-geye').forEach(function (eye) {
      eye.animate([
        { transform: 'scaleY(1)', opacity: 1, easing: 'ease-in' },                                  // blink…
        { transform: 'scaleY(.06)', opacity: 1, offset: at(80), easing: 'ease-out' },
        { transform: 'scaleY(1)', opacity: 1, offset: at(EXIT.reopened) },                         // …reopen
        { transform: 'scaleY(1)', opacity: 1, offset: at(EXIT.closeFrom), easing: 'ease-in' },      // slow close
        { transform: 'scaleY(.06)', opacity: 1, offset: at(EXIT.shut) },
        { transform: 'scaleY(.06)', opacity: 0 }                                                   // gone
      ], { duration: ms(EXIT.gone), fill: 'forwards' });
    });
    $('.ss-fog').animate([{ opacity: 1 }, { opacity: 1, offset: at(EXIT.closeFrom) }, { opacity: 0 }],
      { duration: ms(EXIT.gone), easing: 'ease-out', fill: 'forwards' });
    setTimeout(function () {
      ['.ss-fog', '.ss-geyes', '.ss-cta'].forEach(function (s) { var el = $(s); if (el) el.remove(); });
    }, ms(EXIT.gone + 50));
    return reduced ? 0 : EXIT.gone + EXIT.pause;
  }

  /* ---------------------------------------------------------- lifecycle */

  function begin() {
    if (state !== 'idle' && state !== 'gate') return;
    var fromGate = state === 'gate';
    state = 'playing';
    api.playing = true;
    startedAt = Infinity; // no skipping until the show has started
    var delay = 0;
    if (fromGate) {
      if (ac) {
        ac.resume();
        if (!master) buildGraph();
        whoom(ac.currentTime + (reduced ? 0.02 : EXIT.closeFrom / 1000)); // lands with the slow close
      }
      delay = exitGate();
    }
    var go = function () {
      startedAt = performance.now() + LEAD * 1000;
      if (ac) {
        if (ac.state !== 'running') ac.resume();
        scheduleAudio(ac.currentTime + LEAD);
      }
      scheduleVisuals();
      requestAnimationFrame(frame);
      leaveTimer = setTimeout(function () { leave(T.end - T.out); }, (T.out + LEAD) * 1000);
    };
    setTimeout(function () { requestAnimationFrame(go); }, delay);
  }

  function leave(dur) {
    if (state !== 'playing') return;
    state = 'leaving';
    if (ac && master) {
      var now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(0, now + dur + 0.6);
    }
    root.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur * 1000, easing: 'ease-in', fill: 'forwards' })
      .onfinish = finish;
  }

  function finish() {
    state = 'gone';
    api.playing = false;
    gateAlive = false;
    clearTimeout(blinkTimer);
    if (onLook) window.removeEventListener('pointermove', onLook);
    anims.forEach(function (a) { a.cancel(); });
    INPUTS.forEach(function (t) { window.removeEventListener(t, guard, { capture: true }); });
    root.remove();
    if (ac) setTimeout(function () { ac.close(); }, 1500);
    try { if (ONCE) sessionStorage.setItem('sirsc-intro-played', '1'); } catch (e) {}
    finishEvent();
  }

  function finishEvent() {
    resolveDone();
    window.dispatchEvent(new Event('sirsc-intro-done'));
  }

  // Debug: freeze the intro at a moment (seconds), e.g. SirSCIntro.seek(1.8) in the console.
  api.seek = function (t) {
    if (state !== 'playing') return;
    frozenAt = t;
    clearTimeout(leaveTimer);
    if (ac) ac.suspend();
    anims.forEach(function (a) { a.pause(); a.currentTime = (t + LEAD) * 1000; });
    draw(t);
  };

  api.skip = function () { if (state === 'gate' || state === 'idle') { state = 'playing'; } leave(0.25); };

  // Apples to Oranges: the "eyes in the dark" start screen always shows, even when the browser
  // would allow sound without a click, so the intro (and the game's music) starts on a press.
  if (SOUND) initAudio();
  if (SOUND) {
    state = 'gate';
    showGate();
  } else {
    begin();
  }
})();
</script>

 *   u     the unit word under the number, for a count ('' for none). A measurement gets its unit's
 *         name unless u gives a better one for its own unit ("Earth days").

/* Apples to Oranges — the cards. Loaded after every facts file.
 *
 * Every card that can come up: each fact in its own unit, plus each measurement in the other
 * units of its kind, as long as the number reads sensibly (at least 0.1, at most a trillion,
 * and above zero). Converted numbers are rounded to what the card shows, and the game judges
 * the numbers exactly as shown.
 *
 * A measurement card also knows what it measures (dim: 'len', 'mass', 'speed', 'temp', 'time',
 * 'vol'), its unit (mk) and its real size in that kind's base unit (real: meters, kilograms,
 * meters per second, kelvin, seconds or liters), worked out from the number on the card.
 * Real Size compares those. */
'use strict';

const Units = (function () {
  const groupOf = {};
  for (const [g, units] of Object.entries(UNITS)) for (const k of Object.keys(units)) groupOf[k] = g;
  const toK = { F: v => (v - 32) * 5 / 9 + 273.15, C: v => v + 273.15, K: v => v };
  const fromK = { F: k => (k - 273.15) * 9 / 5 + 32, C: k => k - 273.15, K: k => k };
  const toBase = (v, k) => (groupOf[k] === 'temp' ? toK[k](v) : v * UNITS[groupOf[k]][k][0]);
  const fromBase = (b, k) => (groupOf[k] === 'temp' ? fromK[k](b) : b / UNITS[groupOf[k]][k][0]);
  const round = v => (v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100);
  // an approximate number keeps three significant figures, so "about 165 tons" doesn't become 149,685,482 grams
  const sig3 = v => { if (v < 1000) return round(v); const p = Math.pow(10, Math.floor(Math.log10(v)) - 2); return Math.round(v / p) * p; };
  const name = k => UNITS[groupOf[k]][k][1];
  return { groupOf, toBase, fromBase, round, sig3, name };
})();

const CARDS = (function () {
  const out = [];
  for (const f of FACTS) {
    if (!f.m) { out.push(Object.assign({}, f, { base: f.id })); continue; }
    const g = Units.groupOf[f.m];
    for (const k of Object.keys(UNITS[g])) {
      if (k === f.m) {
        out.push(Object.assign({}, f, { base: f.id, id: f.id + '@' + k, u: f.u || Units.name(k), dim: g, mk: k, real: Units.toBase(f.n, k) }));
        continue;
      }
      const v = Units.fromBase(Units.toBase(f.n, f.m), k);
      const n = f.x ? Units.round(v) : Units.sig3(v);
      if (!(n > 0) || v < 0.1 || v > 1e12) continue;
      // xs: converted from an exact fact, so it's trusted to the rounding shown (Ultra uses these)
      out.push(Object.assign({}, f, {
        base: f.id, id: f.id + '@' + k, n, u: Units.name(k), x: 0, xs: f.x ? 1 : 0, converted: 1,
        dim: g, mk: k, real: Units.toBase(n, k)
      }));
    }
  }
  // Every year also comes up as "how many years ago" and "how many days ago", worked out from today.
  // They're the same fact (same base), not new ones. Years ago is exact (this year minus that year);
  // days ago counts from the fact's date when it has one, otherwise from the middle of that year.
  const now = new Date(), thisYear = now.getFullYear(), DAY = 86400000;
  const today = Date.UTC(thisYear, now.getMonth(), now.getDate());
  const fmtDate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  for (const f of FACTS) {
    if (!f.year || !(f.n < thisYear)) continue;
    const what = /^the year /.test(f.t) ? f.t.replace(/^the year /, '') : 'it was ' + f.t;
    out.push(Object.assign({}, f, {
      base: f.id, id: f.id + '@yearsago', c: 'ago', t: 'how many years ago ' + what, n: thisYear - f.n, u: 'years ago',
      year: 0, x: 0, xs: 1, converted: 1, ago: 1, note: 'In ' + f.n + (f.date ? ' (' + fmtDate(f.date) + ')' : '')
    }));
    const from = f.date ? Date.parse(f.date + 'T00:00:00Z') : Date.UTC(f.n, 6, 1);
    const days = Math.round((today - from) / DAY);
    if (days < 1) continue;
    out.push(Object.assign({}, f, {
      base: f.id, id: f.id + '@daysago', c: 'ago', t: 'how many days ago ' + what, n: f.date ? days : Units.sig3(days), u: 'days ago',
      year: 0, x: 0, xs: 0, converted: 1, ago: 1, note: f.date ? 'Since ' + fmtDate(f.date) : 'About. In ' + f.n
    }));
  }
  return out;
})();
CATS.ago = { name: 'Years Ago', icon: '⏳' };

/* Apples to Oranges — picking matchups.
 *
 * How hard a matchup is depends only on how close the two numbers are (the bigger one
 * divided by the smaller one). Owen gets numbers a fair way apart, Hard gets them close.
 * Every so often a "photo finish" comes up: two exact numbers that tie or are a few apart.
 * Matchups are picked from CARDS (cards.js): every fact, plus each measurement in its other units.
 *
 * Four modes share this:
 *   classic  Higher or lower, from the regular facts.
 *   haunt    The same, but every matchup puts a Halloween fact against a regular one.
 *   size     Real Size: two measurements of the same kind in different units. Which is really bigger?
 *   guess    Guess the Number: one card at a time, scored by how close the guess is.
 */
'use strict';

const Pairs = (function () {
  // Points for a right answer, by how close the numbers were.
  const TIERS = [
    { name: 'Common',    pts: 10,  cls: 't1' },   // 10× apart or more
    { name: 'Uncommon',  pts: 25,  cls: 't2' },   // 3× to 10×
    { name: 'Rare',      pts: 50,  cls: 't3' },   // 1.5× to 3×
    { name: 'Epic',      pts: 100, cls: 't4' },   // closer than 1.5×
    { name: 'Legendary', pts: 200, cls: 't5' }    // photo finish
  ];

  // Which closeness each difficulty draws from, as [smallest, biggest] ratio.
  const BANDS = { owen: [1.6, 8], medium: [1.25, 5], hard: [1.05, 4] };
  // Chance that the next matchup tries to be a photo finish.
  const PHOTO_CHANCE = { owen: 1 / 16, medium: 1 / 11, hard: 1 / 7 };

  // A number trustworthy to the last digit: an exact fact, or a measurement converted from one.
  const trusted = c => !!(c.x || c.xs);

  function ratio(a, b) {
    const hi = Math.max(a.n, b.n), lo = Math.min(a.n, b.n);
    return lo <= 0 ? Infinity : hi / lo;
  }

  // A photo finish: any matchup within 5 of each other, or within 3%, always. (Which pairs can come
  // up at all is fair()'s job: approximate numbers never meet that close.)
  function isPhoto(a, b) {
    return Math.abs(a.n - b.n) <= 5 || ratio(a, b) <= 1.03;
  }

  function tierOf(a, b) {
    if (isPhoto(a, b)) return 4;
    const r = ratio(a, b);
    if (r >= 10) return 0;
    if (r >= 3) return 1;
    if (r >= 1.5) return 2;
    return 3;
  }

  // Facts from the same category are too related to meet, except years
  // (Toy Story against the first Pokémon games is fair and fun). A fact never meets itself.
  function unrelated(a, b) {
    // "how many years ago" against a plain year would give the answer away (19 vs 1996)
    if ((a.ago && b.year) || (a.year && b.ago)) return false;
    return a.base !== b.base && (a.c !== b.c || a.c === 'years');
  }

  // Could this pair come up at all? An approximate number needs a clear gap, so "about 70 mph"
  // never decides a matchup by a hair. A tie needs two exact facts (rounding a converted number
  // can make two different sizes look equal).
  function fair(a, b) {
    if (!unrelated(a, b)) return false;
    if (a.n === b.n) return !!(a.x && b.x);
    if ((!trusted(a) || !trusted(b)) && ratio(a, b) < 1.1) return false;
    return true;
  }

  // Random choices go through rnd, so a live race can swap in a seeded generator: everyone in the
  // race then gets the same matchups in the same order (useSeed below).
  let rnd = Math.random;
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const rand = (a, b) => a + rnd() * (b - a);
  // The cards higher-or-lower matchups come from. A seeded race leaves out the cards that depend on
  // the player's own date ("years ago", "days ago"), so every racer sees exactly the same numbers.
  let POOL = CARDS;
  function seeded(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function useSeed(seed) {
    if (seed == null && rnd === Math.random) return;      // already unseeded: keep Ultra's chains
    if (seed == null) { rnd = Math.random; POOL = CARDS; }
    else { rnd = seeded(seed); POOL = CARDS.filter(c => !c.ago); }
    ultraMap = null;
  }

  // Halloween facts only come up in the Halloween event, always against a regular fact.
  // allowed(c, from, mode): can card c be the next card after `from` in this mode?
  const allowed = (c, from, mode) => (mode === 'haunt' ? !!c.hw !== !!from.hw : !c.hw);

  // Pick a fact first, then one of its units, so a measurement with eight units
  // comes up about as often as a plain count.
  function pickByFact(cards) {
    const byBase = new Map();
    for (const c of cards) {
      if (!byBase.has(c.base)) byBase.set(c.base, []);
      byBase.get(c.base).push(c);
    }
    return pick(pick([...byBase.values()]));
  }

  // A planned photo finish: a fair pair within 5 or 3%, between two trustworthy numbers.
  function photoPartners(f, pool) {
    return pool.filter(o => trusted(f) && trusted(o) && fair(f, o) && isPhoto(f, o));
  }

  /* ---- Ultra: every matchup is within 10 -----------------------------------------------
   * Both numbers have to be trustworthy to the last digit: an exact fact, or a measurement
   * converted from one (rounding never changes which of two numbers is bigger, it can only make
   * them look equal, so a converted number never meets an equal one). No ties: a tie would be a

    // each loop gets its own echo, so it sounds like it's playing out in the open
    const g = M.gain = ctx.createGain(); g.gain.value = 0;
    const d = ctx.createDelay(2); d.delayTime.value = E * T.echo;
    const fb = ctx.createGain(); fb.gain.value = T.fb;
    const wet = ctx.createGain(); wet.gain.value = 0.3;
    g.connect(master); g.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(master);
    g.gain.setTargetAtTime(T.vol * M.level, ctx.currentTime, 0.8);
    M.step = 0; M.next = ctx.currentTime + 0.1;
    scheduleMusic();
    M.timer = setInterval(scheduleMusic, 100);
  }

  const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

  return {
    unlock: ensure,
    isMuted: () => muted,
    setMuted(m) {
      muted = m;
      try { localStorage.setItem('a2o.muted', m ? '1' : '0'); } catch (e) { /* ignore */ }
      if (master) master.gain.value = m ? 0 : 0.5;
    },
    // Background music: music('breeze'), music('sky') or music(null).
    music: playMusic,
    musicEnabled: () => M.enabled,
    setMusicEnabled(on) {
      M.enabled = on;
      try { localStorage.setItem('a2o.music', on ? '1' : '0'); } catch (e) { /* ignore */ }
      const w = wanted; playMusic(on ? w : null); wanted = w;
    },
    // turn the music down while a photo finish plays out (1 = full, 0 = silent)
    musicLevel(x) {
      M.level = Math.max(0, Math.min(1, x));
      if (M.gain) M.gain.gain.setTargetAtTime(M.track.vol * M.level, ctx.currentTime, 0.25);
    },
    click() { tone(660, 0.06, { type: 'triangle', vol: 0.12 }); },
    // the race countdown: three beeps, then a higher GO
    countBeep(go) { tone(go ? 1046.5 : 523.25, go ? 0.45 : 0.18, { type: 'square', vol: go ? 0.12 : 0.09 }); },
    // the race is over: a referee's whistle
    whistle() { tone(2300, 0.5, { type: 'sine', vol: 0.12, vibrato: 60 }); tone(2350, 0.22, { type: 'sine', vol: 0.08, at: 0.55, vibrato: 60 }); },
    // a fruit tripping over: a squelchy slip
    slip() { tone(500, 0.25, { type: 'sine', vol: 0.12, to: 140 }); noise(0.15, { vol: 0.1, freq: 900, q: 1.5, at: 0.05 }); },
    tick() { tone(1400, 0.025, { type: 'square', vol: 0.03 }); },
    // the slow final ticks of a photo finish, each a little higher
    photoTick(i) { tone(330 + i * 40, 0.12, { type: 'triangle', vol: 0.22 }); noise(0.08, { vol: 0.25, freq: 180, type: 'lowpass' }); },
    drumroll(sec) {
      for (let t = 0; t < sec; t += 0.045) noise(0.05, { vol: 0.08 + 0.12 * (t / sec), at: t, freq: 220, type: 'lowpass' });
    },
    good(tier) {
      const steps = 2 + tier;
      for (let i = 0; i < steps; i++) tone(NOTES[i + (tier > 2 ? 2 : 0)], 0.18, { type: 'triangle', vol: 0.16, at: i * 0.07 });
    },
    bad() {
      tone(220, 0.35, { type: 'sawtooth', vol: 0.12, to: 110 });
      tone(233, 0.35, { type: 'square', vol: 0.05, to: 116 });
    },
    photoWin() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.25, { type: 'square', vol: 0.09, at: i * 0.1 }));
      tone(1046.5, 0.9, { type: 'triangle', vol: 0.2, at: 0.4 });
      tone(1318.51, 0.9, { type: 'triangle', vol: 0.14, at: 0.4 });
      noise(0.5, { vol: 0.25, at: 0.4, freq: 5000, type: 'highpass' });
    },
    photoLose() {
      // sad trombone
      [392, 370, 349, 330].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.32, { type: 'sawtooth', vol: 0.11, at: i * 0.33, to: i === 3 ? 300 : null }));
    },
    tie() {
      [659.25, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, { type: 'square', vol: 0.08, at: i * 0.09 }));
      tone(1567.98, 0.6, { type: 'sine', vol: 0.15, at: 0.36, to: 2093 });
    },
    timeout() { tone(440, 0.5, { type: 'square', vol: 0.08, to: 220 }); },
    // Halloween: the heartbeat as the ghost gets close, and its hiss before a lunge
    heartbeat() {
      tone(60, 0.16, { type: 'sine', vol: 0.5, to: 40 });
      tone(56, 0.16, { type: 'sine', vol: 0.4, at: 0.22, to: 38 });
    },
    hiss() { noise(0.9, { vol: 0.22, freq: 4500, type: 'highpass' }); tone(220, 0.8, { type: 'sawtooth', vol: 0.05, to: 120 }); },
    caught() { tone(300, 1.2, { type: 'sawtooth', vol: 0.1, to: 60 }); noise(1.2, { vol: 0.2, freq: 300, type: 'lowpass' }); },
    escape() { [523.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.2, { type: 'square', vol: 0.08, at: i * 0.07 })); },
    roar() { tone(180, 0.6, { type: 'sawtooth', vol: 0.09, to: 90 }); noise(0.6, { vol: 0.16, freq: 500, q: 0.5 }); },
    chirp() { tone(1600, 0.08, { type: 'sine', vol: 0.08, to: 2200 }); tone(1800, 0.08, { type: 'sine', vol: 0.06, at: 0.1, to: 2400 }); },
    milestone() {

    },
    burner() { noise(0.6, { vol: 0.18, freq: 600, q: 0.4 }); },
    over() {
      [523.25, 440, 349.23, 261.63].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.14, at: i * 0.16 }));

})();

// Where a score is on a mode's map: the location (or the endless one) and its index (0..19, 20 = endless).
function mapPlace(mode, score) {
  const M = MAPS[mode];
  if (score >= MAP_ENDLESS) return { i: 20, stop: M.infinite };
  let i = 0;
  while (i < 19 && score >= M.stops[i + 1].at) i++;
  return { i, stop: M.stops[i] };
}

// The same, as one smooth number for the scene: 0 at the start, 1 at the 2nd location, … 19 at the
// target, then one more for every 5,000 points.
function mapBand(score) {
  score = Math.max(0, score);
  if (score >= MAP_TARGET) return 19 + (score - MAP_TARGET) / MAP_BAND;
  let i = 0;
  while (i < 18 && score >= MAP_AT[i + 1]) i++;
  return i + (score - MAP_AT[i]) / (MAP_AT[i + 1] - MAP_AT[i]);
}

/* Apples to Oranges — the animated worlds behind the game. Each mode has its own:
 *   classic  a hot-air balloon rising from an orchard, past kites, birds, skyscrapers, clouds,
 *            mountains and jets, up to the edge of space
 *   size     a dragon taking off from a castle valley, past cliffs, floating islands, storms and a
 *            sunset, up into the stars
 *   guess    a squirrel climbing a tree that never ends, past owls, nests and lanterns, through
 *            autumn, fog and frost, on up into space
 *   haunt    the Halloween chase: a jack-o'-lantern balloon flying sideways across a Halloween
 *            night with a ghost coming from behind
 *   race     Fruit Dash's kitchen, drawn by js/kitchen.js and plugged in with Scene.addWorld
 * One canvas, redrawn every frame. Where you are is your score, on the mode's map of 20 locations
 * (js/map.js); each location has its own sky, its own decor and sometimes a landmark, so what you
 * see is where you are. Switching worlds slides the old picture out and the new one in, the way
 * Brain Rocket does. */
'use strict';

const Scene = (function () {
  const TAU = Math.PI * 2;
  // The climb follows your score along the mode's map (js/map.js): every one of the 20 locations
  // gets the same height on screen, and so does every 5,000 points of infinite mode after the target.
  const ZPX = 1500;                 // world pixels per location
  const ZOFF = 120;                 // a location's art starts a little above where you arrive
  const wy = score => mapBand(score) * ZPX;
  const zoneOfW = w => Math.max(0, Math.floor((w - ZOFF) / ZPX));
  const stopOf = z => (z >= 20 ? MAPS[world].infinite : MAPS[world].stops[z]);

  let canvas, ctx;
  let W = 1600, H = 900, BASE = 780, BX = 330;
  const st = { cam: 0, target: 0, t: 0, burn: 0, dipY: 0, dipV: 0, shake: 0, sway: 0 };
  const fx = [];      // screen-space confetti and smoke
  let trees = [], city = [], stars = [];
  let world = 'classic';
  const extra = {};   // worlds drawn by their own files (Scene.addWorld), like Fruit Dash's kitchen
  let pines = [], cottages = [], woods = [];

  // ---- Helpers -----------------------------------------------------------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`; };
  const wrapX = (x, m = 260) => { const span = W + m * 2; return ((((x + m) % span) + span) % span) - m; };
  const sy = w => BASE - (w - st.cam);

  // ---- Sky colours, one [top, bottom] per location (the 21st is infinite mode) ----------------
  const SKY = {
    // 🎈 a summer morning, deepening to the black of space
    classic: [
      ['#5fb4ff', '#d4f0ff'], ['#59aefc', '#cdeeff'], ['#53a8f8', '#c6eaff'], ['#4ea2f4', '#c3e8ff'], ['#4a9cf0', '#bde4ff'],
      ['#4796ec', '#b6e0ff'], ['#4b9be8', '#d6ecff'], ['#58a6ee', '#e2f2ff'], ['#4390e2', '#acd6fb'], ['#4d5a7c', '#8a96b4'],
      ['#3f86da', '#9fcdf6'], ['#3a7cd2', '#93c4f2'], ['#3270c9', '#86b8ee'], ['#2b62bc', '#79aae6'], ['#2455ad', '#6c9bdc'],
      ['#1c4596', '#587fc8'], ['#0f2459', '#1f3f80'], ['#0a1640', '#16295e'], ['#060d2c', '#0f1d48'], ['#03061a', '#0a1436'],
      ['#020310', '#070b24']
    ],
    // 🐉 a warm morning over the valley, a stormy noon, a sunset, then the night and its stars
    size: [
      ['#78b4ff', '#ffd9b8'], ['#72aefc', '#ffe0c0'], ['#6aa8f8', '#ffe6cc'], ['#62a0f4', '#f8e8d4'], ['#5a98f0', '#e4ecf8'],
      ['#5e9ef0', '#f0f4ff'], ['#5692ea', '#dfe9fb'], ['#4c88e2', '#cfe2f8'], ['#5a7ee0', '#e6d8f8'], ['#5a64d0', '#c8b8f4'],
      ['#3e4870', '#7a80a4'], ['#3a62c4', '#b0c8f0'], ['#4a5ec0', '#e8b8a8'], ['#5a4aa8', '#ff9a5a'], ['#2a2a78', '#6a4a9a'],
      ['#141a4a', '#20306a'], ['#0e1036', '#1c1c50'], ['#0a0a2a', '#181844'], ['#0a0a24', '#1a1a3e'], ['#08061c', '#1a1036'],
      ['#040312', '#0c0a26']
    ],
    // 🐿️ a forest morning, a lantern-lit dusk, autumn, fog, open sky, frost, then space
    guess: [
      ['#7cc5ff', '#e6f7ff'], ['#76c0fc', '#e0f4ff'], ['#70bbf8', '#daf1ff'], ['#6ab4f4', '#d4eeff'], ['#66b1f5', '#d6f0ff'],
      ['#62adf2', '#d0ecff'], ['#6ab8f4', '#f0f4d8'], ['#5aa6ee', '#c8e6ff'], ['#3a4a8a', '#8a7ab0'], ['#6aa0d8', '#f4d8b0'],
      ['#6098d4', '#ecd4b4'], ['#a6b6c8', '#e3e9ef'], ['#7aa6e2', '#d3e6ff'], ['#6a9ce0', '#c8e0ff'], ['#5a8ed8', '#bcd6fa'],
      ['#3a6cc4', '#94b8ec'], ['#5a7ab0', '#c8dcf0'], ['#0f1f5c', '#2c4690'], ['#0a143e', '#1a2a60'], ['#060c2a', '#141e4a'],
      ['#04081f', '#0c1438']
    ]
  };
  // where the sky is: the location the camera is in, as a smooth number
  const skyBand = () => clamp(st.cam / ZPX - 0.25, 0, 20);
  function skyAt(b) {
    const P = SKY[world] || SKY.classic;
    const i = Math.min(19, Math.floor(b)), t = clamp(b - i, 0, 1);
    return [0, 1].map(k => { const x = hex(P[i][k]), y = hex(P[i + 1][k]); return x.map((v, j) => lerp(v, y[j], t)); });
  }
  const css = c => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
  const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

  // ---- Things in the sky: each location's own decor, from the map ----------------------------
  // Most of it is laid out in the open sky on the left, the part the matchup panel doesn't cover.
  const visL = () => 96, visR = () => Math.max(560, W - 1040);
  const wrapIn = (x, a, b) => a + ((((x - a) % (b - a)) + (b - a)) % (b - a));
  // things that stand still, rising from below the picture (towers, peaks, cliffs, treetops)
  const TALL = new Set(['spire', 'peak', 'cliff', 'castletop', 'canopy']);
  const STILL = new Set([...TALL, 'crystal', 'constellation', 'planet', 'firefly', 'fog', 'aurora', 'storm', 'island']);
  const SPEED = { birds: 34, geese: 30, eagle: 26, kite: 8, balloon: 7, blimp: 14, cloud: 7, wisp: 10, sheep: 9, swirl: 12, minidragon: 30, wballoon: 5, sat: 9, butterfly: 6, leaf: 6, snow: 4 };

  const CHUNK = 210;
  const chunkCache = new Map();
  function chunk(ci) {
    const key = world + ci;
    if (chunkCache.has(key)) return chunkCache.get(key);
    if (chunkCache.size > 400) chunkCache.clear();
    const rng = mulberry32(ci * 7919 + 17 + (world === 'size' ? 101 : world === 'guess' ? 202 : 0));
    const out = [];
    if (ci * CHUNK < 260) { chunkCache.set(key, out); return out; }   // leave the launch clear
    const decor = stopOf(zoneOfW(ci * CHUNK + CHUNK / 2)).decor;
    for (const [type, wgt] of Object.entries(decor)) {
      const n = Math.floor(wgt * 0.45 + rng());
      for (let i = 0; i < n; i++) {
        const still = STILL.has(type);
        out.push({
          type, w: ci * CHUNK + rng() * CHUNK, fx: rng(), local: TALL.has(type) || rng() < 0.75,
          s: 0.7 + rng() * 0.6, seed: rng() * 1000, hue: Math.floor(rng() * 360),
          vx: still ? 0 : (rng() < 0.5 ? -1 : 1) * (SPEED[type] || 12) * (0.6 + rng() * 0.8)
        });
      }
    }
    out.sort((a, b) => TALL.has(b.type) - TALL.has(a.type));    // the tall things go behind
    chunkCache.set(key, out);

  // ---- Fixed scenery, laid out for the current width ----------------------
  function layout() {
    const rng = mulberry32(42);
    trees = [];
    for (let x = 40; x < W; x += 70 + rng() * 90) {
      if (Math.abs(x - BX) < 150) continue;                 // keep the launch field clear
      if (x > W * 0.78 - 40 && x < W * 0.78 + 230) continue; // and the barn
      trees.push({ x, s: 0.8 + rng() * 0.5, kind: rng() < 0.5 ? 'apple' : 'orange', seed: rng() * 100 });
    }
    city = [];
    for (let x = -20; x < W + 40;) {
      const w = 40 + rng() * 70;
      city.push({ x, w, h: 60 + rng() * 150, lit: rng() });
      x += w + 6 + rng() * 20;
    }
    stars = [];
    for (let i = 0; i < 160; i++) stars.push({ x: rng() * W, y: rng() * H, r: 0.6 + rng() * 1.6, p: rng() * TAU });
    pines = [];
    for (let x = 20; x < W; x += 50 + rng() * 80) {
      if (Math.abs(x - BX) < 170 || (x > W * 0.7 && x < W * 0.7 + 300)) continue;
      pines.push({ x, s: 0.7 + rng() * 0.6, c: rng() });
    }
    cottages = [];
    for (let x = 10; x < W; x += 110 + rng() * 140) cottages.push({ x, w: 50 + rng() * 30, h: 34 + rng() * 22, roof: rng() < 0.5 ? '#c4473a' : '#7a4fb0', lit: rng() });
    woods = [];
    for (let x = -30; x < W + 60; x += 40 + rng() * 50) woods.push({ x, h: 120 + rng() * 140, w: 50 + rng() * 40, kind: rng() < 0.5 ? 'pine' : 'round', c: rng() });
  }

  // ---- Drawing -------------------------------------------------------------
  function drawSky() {
    const [top, bot] = skyAt(skyBand());
    skyLum = lum(top);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css(top)); g.addColorStop(1, css(bot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  let skyLum = 1;

  // the stars come out as the sky gets dark
  function drawStars() {
    const a = clamp((0.3 - skyLum) / 0.18, 0, 1);
    if (a <= 0) return;
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(st.t * 2 + s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSun() {
    const a = clamp((skyLum - 0.12) / 0.2, 0, 1);

    const r = 58;
    const x = W * 0.55, y = 112 + Math.min(80, st.cam * 0.01);
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    g.addColorStop(0, 'rgba(255,250,210,0.9)'); g.addColorStop(0.25, 'rgba(255,220,120,0.4)'); g.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff8d8'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // The Edge of Space: the curve of the Earth below you, glowing blue
  function drawEarthCurve() {
    const b = st.cam / ZPX;
    const a = clamp(b - 18.2, 0, 1);
    if (world !== 'classic' || a <= 0) return;
    const R = 2600, top = H - 150 + clamp(b - 19, 0, 6) * 30, cx = W * 0.3, cy = top + R;
    ctx.globalAlpha = a;
    const glow = ctx.createRadialGradient(cx, cy, R - 10, cx, cy, R + 90);
    glow.addColorStop(0, 'rgba(120,200,255,0.8)'); glow.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R + 90, 0, TAU); ctx.fill();
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, '#5fb4ff'); g.addColorStop(0.3, '#2a6fc9'); g.addColorStop(1, '#1d4f8f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    // cloud swirls and a bit of land
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
    ctx.fillStyle = 'rgba(90,170,90,0.7)';
    ctx.beginPath(); ctx.ellipse(cx - 380, top + 70, 260, 40, -0.05, 0, TAU); ctx.ellipse(cx + 420, top + 90, 200, 36, 0.06, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.ellipse(cx - 700 + i * 230 + Math.sin(i * 7) * 40, top + 40 + (i % 3) * 22, 90, 10, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFruitTree(tr, gy) {
    const s = tr.s, sw = Math.sin(st.t * 1.4 + tr.seed) * 2;
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(tr.x - 5 * s, gy - 40 * s, 10 * s, 42 * s);
    ctx.fillStyle = tr.seed > 50 ? '#2e8b3e' : '#3a9d4a';
    ctx.beginPath();
    ctx.arc(tr.x + sw, gy - 60 * s, 27 * s, 0, TAU);
    ctx.arc(tr.x - 17 * s + sw, gy - 44 * s, 19 * s, 0, TAU);

    for (const [dx, dy] of spots) { ctx.beginPath(); ctx.arc(tr.x + dx * s + sw, gy + dy * s, 4.2 * s, 0, TAU); ctx.fill(); }
  }

  function drawBarn(x, gy) {
    ctx.fillStyle = '#d64545'; ctx.fillRect(x, gy - 110, 190, 110);

    ctx.beginPath(); ctx.moveTo(x - 14, gy - 108); ctx.lineTo(x + 95, gy - 170); ctx.lineTo(x + 204, gy - 108); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#fff4e0'; ctx.fillRect(x + 82, gy - 140, 26, 22);

    for (let i = 0; i < 3; i++) {

      for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(cx + 7 + j * 8, gy - 24, 5, 0, TAU); ctx.fill(); }
    }
  }

  function drawGround() {
    const cam = st.cam * 0.3;           // the ground falls away slower than the sky goes by, so the orchard stays a while
    const gy = BASE + 14 + cam;     // the basket sits on the platform, 14px above the grass
    if (gy - 460 > H) return;
    // far mountains
    const my = BASE - 40 + cam * 0.35;
    if (my - 280 < H) {
      ctx.fillStyle = '#8fa6d8';
      ctx.beginPath(); ctx.moveTo(-20, H + 2000);
      const mtn = x => my - 120 - 90 * Math.abs(Math.sin(x * 0.004 + 1)) - 40 * Math.sin(x * 0.013);
      for (let x = -20; x <= W + 40; x += 40) ctx.lineTo(x, mtn(x));
      ctx.lineTo(W + 40, H + 2000); ctx.fill();
      ctx.fillStyle = '#eef4ff';

    ctx.beginPath(); ctx.moveTo(-20, H + 2000);
    for (let x = -20; x <= W + 40; x += 30) ctx.lineTo(x, hy - 30 - 26 * Math.sin(x * 0.006 + 2) - 12 * Math.sin(x * 0.017));
    ctx.lineTo(W + 40, H + 2000); ctx.fill();

    ctx.fillStyle = '#4caf50'; ctx.fillRect(-20, gy, W + 40, 30);
    ctx.fillStyle = '#3d8f42'; ctx.fillRect(-20, gy + 30, W + 40, 18);
    ctx.fillStyle = '#7a5537'; ctx.fillRect(-20, gy + 48, W + 40, 1600);

    ctx.fillStyle = '#9c6b3c'; ctx.fillRect(BX - 80, gy - 14, 160, 14);
    ctx.fillStyle = '#7d522b'; ctx.fillRect(BX - 80, gy - 14, 160, 4);
    ctx.fillStyle = '#c9a26b';
    for (const dx of [-70, 58]) { ctx.beginPath(); ctx.ellipse(BX + dx + 6, gy - 22, 12, 9, 0, 0, TAU); ctx.fill(); }

  // -- sky things --
  function cloud(x, y, s, a = 0.95) {
    ctx.globalAlpha = a;
    ctx.fillStyle = '#e3eefb';
    ctx.beginPath();
    ctx.arc(x - 50 * s, y + 10 * s, 34 * s, 0, TAU); ctx.arc(x + 50 * s, y + 12 * s, 30 * s, 0, TAU);
    ctx.arc(x, y + 14 * s, 36 * s, 0, TAU);

    ctx.fillStyle = '#fff';

    ctx.arc(x - 50 * s, y, 34 * s, 0, TAU); ctx.arc(x - 8 * s, y - 22 * s, 46 * s, 0, TAU);
    ctx.arc(x + 44 * s, y - 4 * s, 36 * s, 0, TAU); ctx.arc(x, y + 6 * s, 40 * s, 0, TAU);
    ctx.fill();

  }
  function birds(x, y, s, n, seed) {
    ctx.strokeStyle = '#2b3550'; ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const bx = x + i * 26 * s - (i % 2) * 8, by = y + Math.abs(i - n / 2) * 12 * s;
      const f = Math.sin(st.t * 9 + seed + i) * 6 * s;
      ctx.beginPath(); ctx.moveTo(bx - 10 * s, by - f); ctx.quadraticCurveTo(bx - 4 * s, by - 6 * s, bx, by);
      ctx.quadraticCurveTo(bx + 4 * s, by - 6 * s, bx + 10 * s, by - f); ctx.stroke();
    }
  }
  function kite(x, y, s, hue, seed) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(st.t * 1.5 + seed) * 0.15);
    ctx.fillStyle = `hsl(${hue},85%,60%)`;
    ctx.beginPath(); ctx.moveTo(0, -30 * s); ctx.lineTo(20 * s, 0); ctx.lineTo(0, 36 * s); ctx.lineTo(-20 * s, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `hsl(${(hue + 60) % 360},85%,65%)`;
    ctx.beginPath(); ctx.moveTo(0, -30 * s); ctx.lineTo(20 * s, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 36 * s);
    for (let i = 1; i <= 6; i++) ctx.lineTo(Math.sin(st.t * 4 + i + seed) * 8 * s, 36 * s + i * 12 * s);
    ctx.stroke();
    ctx.restore();
  }
  function smallBalloon(x, y, s, hue) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * 0.45, s * 0.45);
    envelope(0, 0, [`hsl(${hue},80%,60%)`, `hsl(${(hue + 40) % 360},85%,62%)`, '#fff3c4']);
    ctx.fillStyle = '#9c6b3c'; ctx.fillRect(-18, 40, 36, 28);
    ctx.strokeStyle = 'rgba(60,40,20,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-18, 16); ctx.lineTo(-16, 40); ctx.moveTo(18, 16); ctx.lineTo(16, 40); ctx.stroke();
    ctx.restore();
  }
  function blimp(x, y, s, dir) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
    ctx.fillStyle = '#c9d2e3'; ctx.beginPath(); ctx.ellipse(0, 0, 90, 30, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff9a1f'; ctx.fillRect(-60, -6, 110, 12);
    ctx.fillStyle = '#9aa6bd';
    ctx.beginPath(); ctx.moveTo(-78, -10); ctx.lineTo(-108, -32); ctx.lineTo(-96, 0); ctx.lineTo(-108, 32); ctx.lineTo(-78, 10); ctx.fill();
    ctx.fillStyle = '#596580'; ctx.fillRect(-14, 28, 30, 10);
    ctx.restore();
  }
  function plane(x, y, s, dir, jet) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
    if (jet) {
      const g = ctx.createLinearGradient(-500, 0, -40, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.75)');
      ctx.fillStyle = g; ctx.fillRect(-500, -3, 460, 6);
    }
    ctx.fillStyle = '#f4f6fb';
    ctx.beginPath(); ctx.ellipse(0, 0, 46, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#dfe5f1';
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-22, 26); ctx.lineTo(-12, 26); ctx.lineTo(14, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-46, -22); ctx.lineTo(-38, -22); ctx.lineTo(-24, 0); ctx.fill();
    ctx.fillStyle = jet ? '#4fa3ff' : '#ff5d73'; ctx.fillRect(-30, -2, 60, 3);
    ctx.fillStyle = '#2b3550';
    for (let i = 0; i < 6; i++) ctx.fillRect(-18 + i * 8, -4, 4, 3);
    if (!jet) {
      ctx.fillStyle = 'rgba(80,90,110,0.6)';
      ctx.fillRect(44, -12 * Math.abs(Math.sin(st.t * 30)), 3, 24 * Math.abs(Math.sin(st.t * 30)));
    }
    ctx.restore();
  }
  function wisp(x, y, s) {
    const g = ctx.createLinearGradient(x - 160 * s, 0, x + 160 * s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 160 * s, 7 * s, 0, 0, TAU); ctx.fill();
  }
  function wballoon(x, y, s) {
    ctx.fillStyle = '#f2f4fa';
    ctx.beginPath(); ctx.arc(x, y, 26 * s, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(160,175,205,0.6)';
    ctx.beginPath(); ctx.arc(x + 8 * s, y + 6 * s, 18 * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y + 26 * s); ctx.lineTo(x, y + 70 * s); ctx.stroke();
    ctx.fillStyle = '#ff9a1f'; ctx.fillRect(x - 6 * s, y + 70 * s, 12 * s, 10 * s);
  }
  function meteor(x, y, s) {
    const g = ctx.createLinearGradient(x - 140 * s, y - 70 * s, x, y);

  }
  function sat(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(st.t * 0.4) * 0.3); ctx.scale(s, s);
    ctx.fillStyle = '#d9dee9'; ctx.fillRect(-12, -10, 24, 20);
    ctx.fillStyle = '#e8b83c'; ctx.fillRect(-10, -8, 20, 16);
    ctx.fillStyle = '#3a63c9'; ctx.fillRect(-54, -8, 38, 16); ctx.fillRect(16, -8, 38, 16);
    ctx.restore();
  }

  // ---- Easter egg: the rocket from Brain Rocket, flying past ------------------
  // Same shapes and colours as Brain Rocket's rocket, drawn nose-up around its nozzle at (0, 0).
  function brainRocket() {
    // flame
    const L = 70 * (1 + Math.sin(st.t * 40) * 0.08 + Math.sin(st.t * 23) * 0.06);
    const layer = (w, l, col) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-w, 0); ctx.quadraticCurveTo(-w * 1.1, l * 0.45, 0, l);
      ctx.quadraticCurveTo(w * 1.1, l * 0.45, w, 0); ctx.closePath(); ctx.fill();
    };
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    layer(17, L, '#ff7a1a'); layer(11, L * 0.72, '#ffd23f'); layer(5, L * 0.4, '#ffffff');
    ctx.restore();
    // fins
    for (const d of [-1, 1]) {
      ctx.fillStyle = '#e8364f';
      ctx.beginPath(); ctx.moveTo(d * 32, -70); ctx.lineTo(d * 66, -12); ctx.lineTo(d * 66, 8); ctx.lineTo(d * 30, -16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b8243b';
      ctx.beginPath(); ctx.moveTo(d * 66, -12); ctx.lineTo(d * 66, 8); ctx.lineTo(d * 56, 2); ctx.closePath(); ctx.fill();
    }
