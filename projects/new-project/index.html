<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Apples to Oranges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="sceneOld" class="hidden"></canvas>
  <canvas id="scene"></canvas>

  <!-- ===== Home ===== -->
  <div id="home">
    <div class="corner-btns">
      <button class="round-btn" id="btnSound" type="button" title="Sound on/off" aria-label="Sound on/off">🔊</button>
      <button class="round-btn" id="btnMusic" type="button" title="Music on/off" aria-label="Music on/off">🎵</button>
      <button class="round-btn" id="btnFull" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>

    <div class="home-main">
      <div class="logo" aria-label="SirSC's Apples to Oranges">
        <span class="logo-by">SirSC's</span>
        <div class="logo-l1"><span class="logo-apples">APPLES</span> <span class="logo-to">to</span></div>
        <div class="logo-l2">ORANGES</div>
        <span class="logo-fruit logo-fruit-a" aria-hidden="true">🍎</span>
        <span class="logo-fruit logo-fruit-o" aria-hidden="true">🍊</span>
      </div>
      <p class="tagline" id="tagline"></p>

      <div class="type-toggle" id="typeToggle" role="group" aria-label="Pick a mode">
        <div class="type-glider" id="typeGlider"></div>
        <button class="type-btn" data-type="classic" type="button"><span class="type-icon">🎈</span><span class="type-txt"><span class="type-name">Classic</span><span class="type-sub">Higher or lower</span></span></button>
        <button class="type-btn" data-type="size" type="button"><span class="type-icon">🐉</span><span class="type-txt"><span class="type-name">Real Size</span><span class="type-sub">Dragon ride</span></span></button>
        <button class="type-btn" data-type="guess" type="button"><span class="type-icon">🐿️</span><span class="type-txt"><span class="type-name">Guess the Number</span><span class="type-sub">Endless tree</span></span></button>
        <button class="type-btn type-haunt" data-type="haunt" type="button"><span class="ltd-badge">Limited time</span><span class="type-icon">🎃</span><span class="type-txt"><span class="type-name">Halloween</span><span class="type-sub">Outrun the ghost</span></span></button>
      </div>

      <div class="modes">
        <button class="mode mode-owen" data-diff="owen" type="button">
          <span class="mode-ic">🧒</span>
          <span class="mode-name">OWEN</span>
          <span class="mode-pill">Easy</span>
          <span class="mode-desc"></span>
          <span class="mode-best" data-best="owen"></span>
        </button>
        <button class="mode mode-medium" data-diff="medium" type="button">
          <span class="mode-ic">🎈</span>
          <span class="mode-name">MEDIUM</span>
          <span class="mode-pill">×1.5 points</span>
          <span class="mode-desc"></span>
          <span class="mode-best" data-best="medium"></span>
        </button>
        <button class="mode mode-hard" data-diff="hard" type="button">
          <span class="mode-ic">⚡</span>
          <span class="mode-name">HARD</span>
          <span class="mode-pill">×2 points</span>
          <span class="mode-desc"></span>
          <span class="mode-best" data-best="hard"></span>
        </button>
        <button class="mode mode-ultra" data-diff="ultra" type="button">
          <span class="mode-ic">💀</span>
          <span class="mode-name">ULTRA</span>
          <span class="mode-pill">×2.5 points</span>
          <span class="mode-desc"></span>
          <span class="mode-best" data-best="ultra"></span>
        </button>
      </div>

      <div class="rules" id="rules"></div>
    </div>
    <div class="version">v0.2</div>
  </div>

  <!-- ===== Game ===== -->
  <div id="game" class="hidden">
    <div id="rail" aria-hidden="true"></div>

    <div id="hud">
      <div class="hud-pill score-pill"><span class="pill-label" id="hudScoreLabel">Score</span><span class="pill-value" id="hudScore">0</span></div>
      <div class="hud-pill alt-pill"><span class="pill-label" id="hudAltLabel">Altitude</span><span class="pill-value" id="hudAlt">0 m</span><span class="pill-sub" id="hudNext"></span></div>
      <div class="hud-spacer"></div>
      <div class="hud-pill streak-pill" id="streakPill"><span class="pill-label">Streak</span><span class="pill-value"><span id="hudStreak">0</span> <span class="flame">🔥</span></span><span class="pill-sub" id="hudMult">next ×1.00</span></div>
      <div class="hud-pill lives-pill" id="livesPill"><span class="pill-label" id="hudLivesLabel">Lives</span><div class="lives" id="hudLives"></div></div>
      <div class="hud-pill time-pill hidden" id="timePill"><span class="pill-label">Survived</span><span class="pill-value" id="hudTime">0:00</span></div>
      <button class="hud-pill pause-btn" id="btnPause" type="button" aria-label="Pause">⏸</button>
    </div>

    <div id="reached" class="hidden">
      <div class="reached-ic" id="reachedIc"></div>
      <div class="reached-kicker">You reached</div>
      <div class="reached-name" id="reachedName"></div>
      <div class="reached-sub" id="reachedSub"></div>
    </div>

    <div id="panel">
      <div class="panel-top">
        <div class="prompt" id="prompt"></div>
        <div class="qcount" id="qcount">Matchup 1</div>
      </div>
      <div class="cards" id="cardsRow">
        <div class="card card-l" id="cardL"></div>
        <div class="vs">VS</div>
        <div class="card card-r" id="cardR"></div>
        <div class="strip-choices" id="stripChoices"></div>
        <div class="photo-banner hidden" id="photoBanner">📸 PHOTO FINISH</div>
      </div>
      <div class="guess-wrap hidden" id="guessWrap">
        <div class="card card-g" id="cardG"></div>
        <div class="guess-input" id="guessInput"></div>
      </div>
      <div class="timer-row" id="timerRow">
        <div class="timer"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-sub"><span id="speedLabel"></span><span id="timerSecs"></span></div>
      </div>
      <div class="chase-row hidden" id="chaseRow">
        <div class="chase-meter"><div class="chase-fill" id="chaseFill"></div></div>
        <div class="chase-sub"><span id="chaseText">👻 The ghost is 60 m behind you</span><span id="chaseSpeed">closing at 2.5 m/s</span></div>
      </div>
      <div class="result" id="result">
        <div class="result-quip" id="resultQuip"></div>
        <div class="result-line" id="resultLine"></div>
        <div class="result-pts" id="resultPts"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="flash"></div>
  </div>

  <!-- ===== Pause ===== -->
  <div id="pause" class="modal hidden">
    <div class="modal-box">
      <h2>Paused</h2>
      <div class="pause-note hidden" id="pauseNote">That was your one pause for this run.</div>
      <button class="big-btn go" id="btnResume" type="button">▶ Resume</button>
      <button class="big-btn" id="btnPauseSound" type="button">🔊 Sound on</button>
      <button class="big-btn" id="btnPauseMusic" type="button">🎵 Music on</button>
      <button class="big-btn quiet" id="btnQuit" type="button">Quit to home</button>
    </div>
  </div>

  <!-- ===== Game over ===== -->
  <div id="over" class="modal hidden">
    <div class="modal-box over-box">
      <div class="over-kicker" id="overKicker">Medium</div>
      <h2 id="overTitle">Out of hot air!</h2>
      <div class="over-score" id="overScore">0</div>
      <div class="over-best" id="overBest"></div>
      <div class="over-stats" id="overStats"></div>
      <div class="over-killer" id="overKiller"></div>
      <div class="over-btns">
        <button class="big-btn go" id="btnAgain" type="button">↻ Play again</button>
        <button class="big-btn" id="btnShare" type="button">📋 Share</button>
        <button class="big-btn quiet" id="btnHome" type="button">Home</button>
      </div>
    </div>
  </div>

  <div id="rotate"><div>📱↻<br>Turn your phone sideways</div></div>
</div>
</div>

<script src="js/facts.js"></script>
<script src="js/facts-close.js"></script>
<script src="js/facts-more.js"></script>
<script src="js/facts-halloween.js"></script>
<script src="js/cards.js"></script>
<script src="js/pairs.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
</body>
</html>
