        s.type = 'sawtooth'; s.frequency.value = hz; s.detune.value = cents;
        s.connect(f); s.start(t); s.stop(t + 1.8);
      });
    });
  }
  function swish(t) {
    var n = noise(t, 0.45), bp = ac.createBiquadFilter(), g = ac.createGain();
    bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(7500, t + 0.4);
    env(g, t, 0.14, 0.12, 0.3);
    n.connect(bp); bp.connect(g); send(g, 0.8, 0.4);
  }
  function glint(t) {
    [2637, 3951].forEach(function (hz, i) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = hz;
      env(g, t + i * 0.06, 0.07, 0.003, 0.7);
      o.connect(g); send(g, 0.8, 0.8); o.start(t + i * 0.06); o.stop(t + 1);
    });
  }

  // Start-screen press: a low "whoom" as the eyes close. (The glint is saved for the finale, when they open.)
  function whoom(t) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.6);
    env(g, t, 0.55, 0.006, 0.6);
    o.connect(g); send(g, 1, 0.3); o.start(t); o.stop(t + 0.7);
  }

  function scheduleAudio(t0) {
    if (!master) buildGraph();
    T.strokes.forEach(function (s, i) {
      if (s[3]) scribble(t0 + s[1], s[2]);
      if (i > 1) tick(t0 + s[1], 900 + i * 220);
    });
    thunk(t0 + T.land);
    swish(t0 + T.name - 0.05);
    glint(t0 + T.glint);
  }

  /* ------------------------------------------------------------ visuals */

  var anims = [];
  function anim(el, frames, delay, dur, easing, fill) {
    var a = el.animate(frames, { delay: (delay + LEAD) * 1000, duration: dur * 1000, easing: easing || 'ease-out', fill: fill || 'both' });
    anims.push(a);
    return a;
  }

  function scheduleVisuals() {
    var land = T.land;
    anim(logo, reduced
      ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: 'scale(1.9)', filter: 'blur(8px)' }, { opacity: 1, transform: 'scale(1)', filter: 'blur(0)' }],
      T.slam, land - T.slam, 'cubic-bezier(.55,0,1,.6)');
    anim($('.ss-lines'), [{ opacity: 1 }, { opacity: 0.55 }], land, 0.6);
    anim($('.ss-flash'), [{ opacity: 0.55 }, { opacity: 0 }], land, 0.35, 'ease-out', 'forwards');

    if (!reduced) {
      anim(mark, [
        { transform: 'scale(1)' }, { transform: 'scale(.95)', offset: 0.18 },
        { transform: 'scale(1.02)', offset: 0.5 }, { transform: 'scale(1)' }], land, 0.4);
      anim(stage, [
        { transform: 'translate(0,0)' }, { transform: 'translate(-9px,6px)' }, { transform: 'translate(8px,-7px)' },
        { transform: 'translate(-5px,-3px)' }, { transform: 'translate(3px,4px)' }, { transform: 'translate(0,0)' }],
        land, 0.32, 'linear');
      anim($('.ss-wave'), [
        { opacity: 0.9, transform: 'translate(-50%,-50%) scale(.75)' },
        { opacity: 0, transform: 'translate(-50%,-50%) scale(1.55)' }], land, 0.7, 'cubic-bezier(.2,.7,.3,1)', 'forwards');
    }

    anim($('.ss-name'), [
      { clipPath: 'inset(-20% 100% -20% 0)', transform: 'translateY(6px)' },
      { clipPath: 'inset(-20% 0% -20% 0)', transform: 'translateY(0)' }], T.name, 0.45, 'cubic-bezier(.3,.6,.2,1)');
    anim($('.ss-flourish path'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], T.name + 0.06, 0.45, 'cubic-bezier(.5,0,.2,1)');

    $$('.ss-eyefill').forEach(function (el) {
      anim(el, [{ opacity: 0 }, { opacity: 1, offset: 0.12 }, { opacity: 0.25 }], T.glint, 0.9, 'ease-out');
    });
  }

  // Pen + stroke draw-on, driven per frame so the spark sits exactly on the line's tip.
  var lengths = strokeEls.map(function (el) { return el.getTotalLength(); });
  function ease(p) { return -(Math.cos(Math.PI * p) - 1) / 2; }

  var frozenAt = null;
  function frame() {
    if (state !== 'playing' && state !== 'leaving') return;
    if (frozenAt !== null) return draw(frozenAt);
    var t = (performance.now() - startedAt) / 1000;
    draw(t);
    if (t < T.end) requestAnimationFrame(frame);
  }

  function draw(t) {
    var penAt = null;
    T.strokes.forEach(function (s, i) {
      var p = Math.min(1, Math.max(0, (t - s[1]) / s[2]));
      if (t < s[1]) return;
      var el = strokeEls[i];
      el.style.opacity = 1;
      el.style.strokeDashoffset = 1 - ease(p);
      if (s[3] && p > 0 && p < 1) penAt = el.getPointAtLength(ease(p) * lengths[i]);
    });
    if (penAt) {
      pen.setAttribute('cx', penAt.x); pen.setAttribute('cy', penAt.y);
      pen.style.opacity = 1;
    } else {
      pen.style.opacity = 0;
    }
  }

  /* ---------------------------------------------------------- lifecycle */

  /* ------------------------------------- start screen: eyes in the dark */

  var gateAlive = false, blinkTimer = 0, onLook = null;

  function showGate() {
    var touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    root.classList.add('ss-gating');
    root.removeAttribute('role');
    mark.insertAdjacentHTML('afterbegin', '<div class="ss-fog"></div>');
    mark.insertAdjacentHTML('beforeend',
      '<svg class="ss-geyes" viewBox="0 0 1024 1024" aria-hidden="true"><g class="ss-look" filter="url(#ss-glow)">' +
        '<path class="ss-geye" d="' + PATHS.eyeR + '"/><path class="ss-geye" d="' + PATHS.eyeL + '"/></g></svg>');
    $('.ss-sig').insertAdjacentHTML('beforeend',
      '<button class="ss-cta" type="button"><span class="ss-label">' + (touchOnly ? 'TAP TO START' : 'PRESS ANY KEY') + '</span>' +
        '<span class="ss-sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/>' +
        '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>SOUND ON</span></button>');

    // The eyes drift, follow the cursor, and blink now and then.
    gateAlive = true;
    var look = $('.ss-look'), eyes = $$('.ss-geye');
    var tx = 0, ty = 0, x = 0, y = 0, idle = true, t0 = performance.now();
    onLook = function (e) {
      idle = false;
      tx = (e.clientX / innerWidth - 0.5) * 36;
      ty = (e.clientY / innerHeight - 0.5) * 22;
    };
    window.addEventListener('pointermove', onLook);
    (function follow() {
      if (!gateAlive) return;
      if (idle && !reduced) { var s = (performance.now() - t0) / 1000; tx = Math.sin(s * 0.7) * 10; ty = Math.sin(s * 0.45) * 4; }
      x += (tx - x) * 0.08; y += (ty - y) * 0.08;
      look.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
      requestAnimationFrame(follow);
    })();
    (function blink() {
      blinkTimer = setTimeout(function () {
        if (!gateAlive) return;
        var twice = Math.random() < 0.25;
        eyes.forEach(function (eye) {
          eye.animate(twice
            ? [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.08)', offset: .2 }, { transform: 'scaleY(1)', offset: .4 },
               { transform: 'scaleY(.08)', offset: .6 }, { transform: 'scaleY(1)' }]
            : [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.08)', offset: .45 }, { transform: 'scaleY(1)' }],
            { duration: twice ? 380 : 170, easing: 'ease-in-out' });
        });
        blink();
      }, 2400 + Math.random() * 3200);
    })();
  }

  // On press the eyes blink, reopen, then slowly close; a beat of darkness, then the signature begins.
  // (They flare open at the end of the intro.) Times in ms from the press:
  var EXIT = { reopened: 180, closeFrom: 330, shut: 570, gone: 630, pause: 500 };

  // Returns ms until the intro should start.
  function exitGate() {
    gateAlive = false;
    clearTimeout(blinkTimer);
    window.removeEventListener('pointermove', onLook);
    root.classList.remove('ss-gating');
    root.setAttribute('role', 'img');
    var ms = function (n) { return reduced ? 1 : n; };
    var at = function (t) { return t / EXIT.gone; };
    $('.ss-cta').animate([{ opacity: 1, transform: 'translateX(-50%)' }, { opacity: 0, transform: 'translateX(-50%) translateY(8px)' }],
      { duration: ms(260), easing: 'ease-out', fill: 'forwards' });
    $$('.ss-geye').forEach(function (eye) {
      eye.animate([
        { transform: 'scaleY(1)', opacity: 1, easing: 'ease-in' },                                  // blink…
        { transform: 'scaleY(.06)', opacity: 1, offset: at(80), easing: 'ease-out' },
        { transform: 'scaleY(1)', opacity: 1, offset: at(EXIT.reopened) },                         // …reopen
        { transform: 'scaleY(1)', opacity: 1, offset: at(EXIT.closeFrom), easing: 'ease-in' },      // slow close
        { transform: 'scaleY(.06)', opacity: 1, offset: at(EXIT.shut) },
        { transform: 'scaleY(.06)', opacity: 0 }                                                   // gone
      ], { duration: ms(EXIT.gone), fill: 'forwards' });
    });
    $('.ss-fog').animate([{ opacity: 1 }, { opacity: 1, offset: at(EXIT.closeFrom) }, { opacity: 0 }],
      { duration: ms(EXIT.gone), easing: 'ease-out', fill: 'forwards' });
    setTimeout(function () {
      ['.ss-fog', '.ss-geyes', '.ss-cta'].forEach(function (s) { var el = $(s); if (el) el.remove(); });
    }, ms(EXIT.gone + 50));
    return reduced ? 0 : EXIT.gone + EXIT.pause;
  }

  /* ---------------------------------------------------------- lifecycle */

  function begin() {
    if (state !== 'idle' && state !== 'gate') return;
    var fromGate = state === 'gate';
    state = 'playing';
    api.playing = true;
    startedAt = Infinity; // no skipping until the show has started
    var delay = 0;
    if (fromGate) {
      if (ac) {
        ac.resume();
        if (!master) buildGraph();
        whoom(ac.currentTime + (reduced ? 0.02 : EXIT.closeFrom / 1000)); // lands with the slow close
      }
      delay = exitGate();
    }
    var go = function () {
      startedAt = performance.now() + LEAD * 1000;
      if (ac) {
        if (ac.state !== 'running') ac.resume();
        scheduleAudio(ac.currentTime + LEAD);
      }
      scheduleVisuals();
      requestAnimationFrame(frame);
      leaveTimer = setTimeout(function () { leave(T.end - T.out); }, (T.out + LEAD) * 1000);
    };
    setTimeout(function () { requestAnimationFrame(go); }, delay);
  }

  function leave(dur) {
    if (state !== 'playing') return;
    state = 'leaving';
    if (ac && master) {
      var now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(0, now + dur + 0.6);
    }
    root.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur * 1000, easing: 'ease-in', fill: 'forwards' })
      .onfinish = finish;
  }

  function finish() {
    state = 'gone';
    api.playing = false;
    gateAlive = false;
    clearTimeout(blinkTimer);
    if (onLook) window.removeEventListener('pointermove', onLook);
    anims.forEach(function (a) { a.cancel(); });
    INPUTS.forEach(function (t) { window.removeEventListener(t, guard, { capture: true }); });
    root.remove();
    if (ac) setTimeout(function () { ac.close(); }, 1500);
    try { if (ONCE) sessionStorage.setItem('sirsc-intro-played', '1'); } catch (e) {}
    finishEvent();
  }

  function finishEvent() {
    resolveDone();
    window.dispatchEvent(new Event('sirsc-intro-done'));
  }

  // Debug: freeze the intro at a moment (seconds), e.g. SirSCIntro.seek(1.8) in the console.
  api.seek = function (t) {
    if (state !== 'playing') return;
    frozenAt = t;
    clearTimeout(leaveTimer);
    if (ac) ac.suspend();
    anims.forEach(function (a) { a.pause(); a.currentTime = (t + LEAD) * 1000; });
    draw(t);
  };

  api.skip = function () { if (state === 'gate' || state === 'idle') { state = 'playing'; } leave(0.25); };

  // Apples to Oranges: the "eyes in the dark" start screen always shows, even when the browser
  // would allow sound without a click, so the intro (and the game's music) starts on a press.
  if (SOUND) initAudio();
  if (SOUND) {
    state = 'gate';
    showGate();
  } else {
    begin();
  }
})();
</script>
