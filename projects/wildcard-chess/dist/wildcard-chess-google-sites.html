<script>
(function () {
  window.WCC_SOURCE = "\u003c!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Wildcard Chess\u003c/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap\">\n\u003cstyle>\n/* Layout: a one-screen app. The menu pairs the logo with a tilted live board; the game puts the\n   wooden board centre stage with player bars above and below and a sidebar to the right\n   (stacked underneath on narrow screens). Single dark look, like a club room after hours. */\n:root {\n  --bg: #1b1916;\n  --bg-2: #23201c;\n  --panel: #2b2723;\n  --panel-2: #34302a;\n  --line: #433d35;\n  --ink: #f1e8d8;\n  --mute: #a99c88;\n  --faint: #6f6557;\n  --gold: #e8b450;\n  --gold-hi: #ffd98e;\n  --gold-lo: #8a5f1f;\n  --red: #ff5a3c;\n  --wood-l: #e1c495;\n  --wood-d: #9c6c41;\n  --lv-easy: #7bd66a;\n  --lv-medium: #56aefc;\n  --lv-pro: #b98bff;\n  --lv-xtreme: #ff5a3c;\n  --f-display: 'Rye', 'Rockwell Extra Bold', Georgia, serif;\n  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;\n  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n  --gutter-l: max(16px, env(safe-area-inset-left, 0px));\n  --gutter-r: max(16px, env(safe-area-inset-right, 0px));\n  --back-a: #3a2a1c; --back-b: #2a1f15; --back-ink: #e8b450; --back-border: #5b4129;\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml, body { height: 100%; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.5 var(--f-body);\n  -webkit-font-smoothing: antialiased;\n  overflow: hidden;\n}\nbutton { font: inherit; color: inherit; cursor: pointer; }\nbutton:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }\n\n#app { position: relative; height: 100%; overflow: hidden; }\n\n.ambient {\n  position: absolute; inset: 0; pointer-events: none; overflow: hidden;\n  background:\n    radial-gradient(1200px 700px at 72% 38%, rgba(232, 180, 80, .10), transparent 60%),\n    radial-gradient(900px 600px at 10% 90%, rgba(156, 108, 65, .14), transparent 60%),\n    radial-gradient(160% 120% at 50% 0%, #26221d 0%, var(--bg) 60%);\n}\n.ambient::after {\n  content: \"\"; position: absolute; inset: 0;\n  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px);\n}\n.drift { position: absolute; inset: 0; }\n.drift i {\n  position: absolute; width: 64px; height: 64px; opacity: .07; filter: blur(.4px);\n  animation: drift linear infinite;\n}\n.drift i svg { width: 100%; height: 100%; }\n@keyframes drift {\n  from { transform: translate3d(0, 110vh, 0) rotate(0deg); }\n  to { transform: translate3d(40px, -20vh, 0) rotate(40deg); }\n}\n\n/* ---------- screens ---------- */\n.screen {\n  position: absolute; inset: 0; display: none; flex-direction: column;\n  overflow-y: auto; overflow-x: hidden;\n  padding-left: var(--gutter-l); padding-right: var(--gutter-r);\n  padding-block: 16px;\n}\n.screen.on { display: flex; animation: screenIn .5s cubic-bezier(.2, .8, .2, 1); }\n@keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n\n.topbar {\n  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;\n  max-width: 1180px; width: 100%; margin: 0 auto; padding: 6px 0 18px;\n}\n.topbar h2 {\n  margin: 0; font: 400 clamp(26px, 4vw, 40px)/1 var(--f-display); color: var(--ink);\n  letter-spacing: .01em; text-wrap: balance;\n}\n.back {\n  background: transparent; border: 1px solid var(--line); border-radius: 999px;\n  padding: 6px 14px; font: 600 14px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--mute);\n}\n.back:hover { color: var(--ink); border-color: var(--mute); }\n\n.btn {\n  display: flex; flex-direction: column; align-items: flex-start; gap: 0;\n  background: linear-gradient(180deg, var(--panel-2), var(--panel));\n  border: 1px solid var(--line); border-radius: 10px;\n  padding: 12px 18px; text-align: left;\n  transition: transform .15s, border-color .15s, background .15s;\n}\n.btn span { font: 700 22px/1.1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; }\n.btn small { font: 500 13px/1.3 var(--f-body); color: var(--mute); }\n.btn:hover { transform: translateX(4px); border-color: var(--gold-lo); }\n.btn.primary {\n  background: linear-gradient(180deg, #f2c362, #d39a33);\n  border-color: #f6d48a; color: #2a1b06;\n  box-shadow: 0 10px 30px -10px rgba(232, 180, 80, .6), inset 0 1px 0 rgba(255, 255, 255, .5);\n}\n.btn.primary small { color: rgba(42, 27, 6, .7); }\n.btn.primary:hover { border-color: #fff1c9; }\n.btn.ghost { background: transparent; }\n.btn.big { align-items: center; padding: 14px 34px; margin: 0 auto; }\n.btn.big:hover { transform: translateY(-2px); }\n.btn.small { padding: 8px 14px; align-items: center; }\n.btn.small span, .btn.small { font: 600 15px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; }\n.btn:disabled { opacity: .4; cursor: default; transform: none; }\n\n/* ---------- menu ---------- */\n#menu { justify-content: center; }\n.menu-wrap {\n  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: 40px;\n  max-width: 1240px; width: 100%; margin: auto;\n}\n.menu-left { min-width: 0; position: relative; z-index: 2; }\n.eyebrow { margin: 0 0 10px; font: 600 14px var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }\n.logo { margin: 0; display: flex; flex-direction: column; line-height: .92; }\n.logo-a {\n  font: 400 clamp(54px, 8.4vw, 112px) var(--f-display); color: var(--gold-hi);\n  text-shadow: 0 1px 0 #c58a2c, 0 2px 0 #b07a23, 0 3px 0 #9a681c, 0 4px 0 #7f5415, 0 10px 24px rgba(0, 0, 0, .55);\n}\n.logo-b {\n  font: 400 clamp(46px, 7vw, 94px) var(--f-display); color: transparent;\n  -webkit-text-stroke: 2px var(--ink); letter-spacing: .08em; margin-left: .08em;\n}\n.tagline { max-width: 34em; margin: 22px 0 28px; font-size: 17px; color: var(--mute); text-wrap: pretty; }\n.menu-btns { display: grid; gap: 10px; max-width: 360px; }\n\n.menu-right { min-width: 0; display: flex; flex-direction: column; align-items: center; }\n.stage { position: relative; width: min(42vw, 560px); aspect-ratio: 1; perspective: 1500px; }\n.tilt {\n  position: absolute; inset: 0; transform-style: preserve-3d;\n  transform: rotateX(50deg) rotateZ(-34deg) scale(.86);\n  animation: sway 14s ease-in-out infinite alternate;\n}\n@keyframes sway { from { transform: rotateX(50deg) rotateZ(-38deg) scale(.86); } to { transform: rotateX(46deg) rotateZ(-26deg) scale(.86); } }\n.stage .board { width: 100%; height: 100%; overflow: visible; transform-style: preserve-3d;\n  box-shadow: 0 0 0 10px #2a1f15, 0 0 0 12px #5b4129, 0 40px 80px rgba(0, 0, 0, .65); }\n.stage .board .wood { border-radius: 2px; }\n.stage .pieces, .stage .pc { transform-style: preserve-3d; }\n.stage .pc svg { transform-origin: 50% 88%; transform: rotateZ(34deg) rotateX(-58deg); filter: drop-shadow(0 6px 4px rgba(0,0,0,.35)); }\n.stage-shadow { position: absolute; left: 10%; right: 10%; bottom: -6%; height: 16%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); filter: blur(8px); z-index: -1; }\n.stage-cap { margin: 8px 0 0; font: 600 13px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }\n\n/* ---------- setup ---------- */\n.setup-body { max-width: 1180px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 26px; padding-bottom: 20px; }\n.diff-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }\n.diff {\n  --lv: var(--gold);\n  position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left;\n  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px;\n  padding: 18px 18px 20px; transition: transform .2s, border-color .2s, box-shadow .2s; min-width: 0;\n}\n.diff[data-level=\"easy\"] { --lv: var(--lv-easy); }\n.diff[data-level=\"medium\"] { --lv: var(--lv-medium); }\n.diff[data-level=\"pro\"] { --lv: var(--lv-pro); }\n.diff[data-level=\"xtreme\"] { --lv: var(--lv-xtreme); }\n.diff:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--lv) 55%, var(--line)); }\n.diff.sel { border-color: var(--lv); box-shadow: 0 0 0 1px var(--lv), 0 18px 40px -16px color-mix(in srgb, var(--lv) 70%, transparent); transform: translateY(-4px); }\n.diff-ico {\n  width: 84px; height: 84px; border-radius: 10px; margin-bottom: 14px;\n  background: linear-gradient(135deg, var(--wood-l), #cfae7c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35);\n  display: grid; place-items: center;\n}\n.diff:nth-child(even) .diff-ico { background: linear-gradient(135deg, #a8774a, var(--wood-d)); }\n.diff-ico svg { width: 88%; height: 88%; }\n.diff-name { font: 700 30px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--lv); }\n.diff-sub { font: 400 17px var(--f-display); color: var(--ink); margin: 4px 0 10px; }\n.diff ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--mute); font-size: 14px; }\n.diff li::before { content: \"—\"; color: var(--faint); margin-right: 6px; }\n.diff b { color: var(--ink); font-weight: 600; }\n.diff.xtreme::after {\n  content: \"\"; position: absolute; inset: -1px; border-radius: 15px; padding: 1px; pointer-events: none;\n  background: conic-gradient(from var(--spin, 0deg), transparent 0 60%, #ff8a3c, #ff3c2e, transparent 85%);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;\n  animation: spin 3.2s linear infinite;\n}\n@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }\n@keyframes spin { to { --spin: 360deg; } }\n.diff.xtreme .diff-ico { box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 0 26px rgba(255, 90, 60, .35); }\n\n.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 36px; }\n.opt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.opt-l { font: 600 14px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }\n.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }\n.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font: 600 15px var(--f-ui); letter-spacing: .06em; color: var(--mute); }\n.seg button.on { background: var(--ink); color: var(--bg); }\n\n/* ---------- draft ---------- */\n.draft-body { max-width: 1180px; width: 100%; margin: auto auto 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 24px; align-items: start; }\n.draft-side { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }\n.draft-side h3 { margin: 0; font: 600 15px var(--f-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }\n.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }\n.vs { align-self: center; justify-self: center; font: 400 44px var(--f-display); color: var(--faint); }\n.draft-note { margin: 0; color: var(--faint); font-style: italic; }\n.draft-foot { padding: 26px 0 10px; display: flex; margin-bottom: auto; }\n\n.card { width: 240px; max-width: 100%; aspect-ratio: 5 / 7.4; perspective: 1200px; }\n.card-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3, 1.3, .4, 1); transform: rotateY(180deg); }\n.card.up .card-in { transform: rotateY(0deg); }\n.card-face, .card-back { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }\n.card-back {\n  transform: rotateY(180deg); border: 1px solid var(--back-border);\n  background:\n    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--back-ink) 25%, transparent), transparent 45%),\n    repeating-conic-gradient(var(--back-a) 0 25%, var(--back-b) 0 50%) 0 0 / 28px 28px;\n  display: grid; place-items: center;\n}\n.card-back::after { content: \"W\"; font: 400 64px var(--f-display); color: var(--back-ink); text-shadow: 0 3px 0 rgba(0,0,0,.45); }\n.card-face {\n  --acc: var(--gold);\n  background: linear-gradient(180deg, #3a342d, #2a2622); border: 1px solid #5a5045;\n  display: flex; flex-direction: column; padding: 14px; gap: 8px;\n  box-shadow: 0 20px 40px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);\n}\n.card-art {\n  position: relative; border-radius: 9px; aspect-ratio: 1.25; display: grid; place-items: center; overflow: hidden;\n  background: linear-gradient(135deg, var(--wood-l), #caa877);\n}\n.card-art::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--acc) 45%, transparent), transparent 60%); }\n.card-art svg { position: relative; height: 92%; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); }\n.card-name { font: 400 22px/1.1 var(--f-display); color: var(--ink); }\n.card-moves { font: 600 12px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }\n.card-desc { font-size: 13.5px; line-height: 1.45; color: #d5cbb9; overflow: auto; }\n.card.secret .card-desc { color: var(--faint); font-style: italic; }\n.card.secret .card-art { background: linear-gradient(135deg, #a8774a, var(--wood-d)); }\n.card .q-mark { position: absolute; right: 8px; top: 6px; font: 400 30px var(--f-display); color: rgba(255,255,255,.85); text-shadow: 0 2px 0 rgba(0,0,0,.4); }\n\n/* ---------- game ---------- */\n#game { padding-block: 12px; }\n.game-wrap {\n  --bs: min(calc(100dvh - 150px), calc(100vw - 440px), 860px);\n  margin: auto; display: grid; grid-template-columns: auto minmax(300px, 360px); gap: 22px; align-items: center;\n}\n.board-col { display: flex; flex-direction: column; gap: 8px; width: max(300px, var(--bs)); }\n.board-frame { position: relative; }\n#mainBoard { width: max(300px, var(--bs)); height: max(300px, var(--bs)); }\n\n.pbar { display: flex; align-items: center; gap: 10px; min-height: 46px; }\n.avatar { width: 42px; height: 42px; flex: none; border-radius: 8px; background: linear-gradient(135deg, var(--wood-l), #c7a676); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }\n.avatar svg { width: 92%; height: 92%; }\n.pname { display: flex; flex-direction: column; min-width: 0; }\n.pname b { font: 700 17px/1.1 var(--f-ui); letter-spacing: .05em; }\n.pname span { font: 500 12px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }\n.pbar .lvl { color: var(--lv, var(--gold)); }\n.chips { display: flex; gap: 4px; }\n.chip { position: relative; width: 34px; height: 34px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); padding: 0; display: grid; place-items: center; }\n.chip svg { width: 92%; height: 92%; }\n.chip .qm { position: absolute; right: -5px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--red); color: #fff; font: 700 11px/16px var(--f-ui); text-align: center; }\n.capt { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }\n.capt svg { width: 22px; height: 22px; margin-left: -7px; }\n.capt .adv { margin-left: 6px; font: 600 13px var(--f-mono); color: var(--mute); }\n.thinking { display l-code { font: 600 clamp(44px, 10vw, 72px)/1 var(--f-mono); letter-spacing: .25em; padding-left: .25em; color: var(--ink); user-select: all; animation: codePulse 2.4s ease-in-out infinite; }\n@keyframes codePulse { 50% { text-shadow: 0 0 24px rgba(123, 214, 106, .55); } }\n.ol-presence { font-size: 13px; color: var(--gold); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n@media (max-width: 700px) { .ol-cols { grid-template-columns: minmax(0, 1fr); } }\n.lg-swirl { animation: lgSwirl 1.6s linear infinite; }\n@keyframes lgSwirl { to { stroke-dashoffset: -40; } }\n.pc.legend svg { position: relative; z-index: 1; }\n@media (prefers-reduced-motion: reduce) { .lg-swirl { animation: none; } }\n\n/* ---------- piece sets, capture effects, avatars, featured row ---------- */\nsvg.ps-neon.pc-w { filter: drop-shadow(0 0 2px #2ef2ff) drop-shadow(0 0 6px rgba(46, 242, 255, .55)); }\nsvg.ps-neon.pc-b { filter: drop-shadow(0 0 2px #ff4df0) drop-shadow(0 0 6px rgba(255, 77, 240, .55)); }\nsvg.ps-glass { filter: drop-shadow(0 0 4px rgba(170, 215, 255, .65)); }\nsvg.ps-gilded.pc-b { filter: drop-shadow(0 0 3px rgba(255, 210, 90, .55)); }\n.sw-pieces { width: 72px; height: 72px; display: grid; grid-template-columns: 1fr 1fr; align-items: end; border-radius: 8px; background: linear-gradient(135deg, var(--wood-l), #b98a55); }\n.sw-pieces svg { width: 100%; height: auto; display: block; }\n.sw-capture { position: relative; width: 72px; height: 72px; border-radius: 8px; background: radial-gradient(circle, #3a332c, #1f1c18); overflow: hidden; }\n.sw-capture svg { position: absolute; inset: 22% 22%; width: 56%; height: 56%; opacity: .55; }\n.sw-capture i { position: absolute; width: 9px; height: 9px; border-radius: 2px; left: 50%; top: 50%; background: var(--c1); animation: swBurst 1.8s ease-out infinite; }\n.sw-capture i:nth-child(2) { background: var(--c2); --dx: -26px; --dy: -20px; animation-delay: .1s; } .sw-capture i:nth-child(3) { background: var(--c3); --dx: 24px; --dy: -24px; animation-delay: .2s; }\n.sw-capture i:nth-child(4) { background: var(--c1); --dx: -22px; --dy: 18px; animation-delay: .05s; } .sw-capture i:nth-child(5) { background: var(--c2); --dx: 26px; --dy: 16px; animation-delay: .15s; }\n.sw-capture i:nth-child(6) { background: var(--c3); --dx: 0px; --dy: -30px; animation-delay: .25s; } .sw-capture i:nth-child(1) { --dx: 4px; --dy: 28px; }\n@keyframes swBurst { from { transform: translate(-50%, -50%) scale(.2); opacity: 1; } 70% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(160deg); opacity: 0; } }\n.sw-avatar { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 8px; background: radial-gradient(circle, #3a342d, #221f1b); }\n.sw-avatar .avatar { width: 56px; height: 56px; }\n.avatar { position: relative; }\n.avatar.av-wood { background: linear-gradient(135deg, var(--wood-l), #c7a676); }\n.avatar.av-silver { background: linear-gradient(135deg, #f4f6f9, #aab3be); box-shadow: 0 0 0 2px #dfe4ea, 0 0 0 3px #6b7480, inset 0 0 0 1px rgba(0,0,0,.25); }\n.avatar.av-gold { background: linear-gradient(135deg, #fff1b8, #d9a640); box-shadow: 0 0 0 2px #ffd76a, 0 0 0 3px #8a5f1f, 0 0 14px rgba(255, 200, 80, .45); }\n.avatar.av-prism { border: 3px solid transparent; background: linear-gradient(135deg, #2a2438, #16131f) padding-box, conic-gradient(from var(--spin, 0deg), #ff5a5a, #ffd23f, #5fe0ff, #b26bff, #ff5a5a) border-box; animation: spin 2.4s linear infinite; box-shadow: 0 0 14px rgba(178, 107, 255, .45); }\n.avatar.av-diamond { background: linear-gradient(135deg, #e9fbff, #7fd8ff 55%, #3b82f6); box-shadow: 0 0 0 2px #e9fbff, 0 0 0 3px #1e3a8a, 0 0 16px rgba(127, 216, 255, .6); }\n.av-crown { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); font-size: 15px; line-height: 1; color: #ffd23f; text-shadow: 0 1px 0 #6b4512, 0 0 6px rgba(255, 210, 63, .7); }\n.av-title { color: var(--gold); }\n.shop-pv-bar { padding: 8px 10px; border-radius: 10px; background: rgba(43,39,35,.8); border: 1px solid var(--line); }\n.shop-featured { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #3d2f1a, #2a231c 60%); border: 1px solid #8a5f1f; box-shadow: 0 0 0 1px rgba(232,180,80,.15), 0 18px 40px -24px rgba(232,180,80,.5); }\n.feat-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; }\n.feat-head h3 { margin: 0; font: 400 22px var(--f-display); color: var(--gold-hi); }\n.feat-head span { font: 600 12px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }\n.feat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n@media (max-width: 560px) { .feat-row { grid-template-columns: minmax(0, 1fr); } }\n.item.feat { grid-template-columns: 56px minmax(0, 1fr); background: rgba(24, 20, 16, .55); }\n.item.feat .item-art, .item.feat .sw-board, .item.feat .sw-back, .item.feat .sw-pieces, .item.feat .sw-capture, .item.feat .sw-avatar, .item.feat .sw-finale { width: 56px; height: 56px; }\n.item.feat .sw-avatar .avatar { width: 44px; height: 44px; }\n.item-kind { font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }\n.new-tag, .shop-tabs button.new::after { display: inline-block; font: 700 10px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #1b1916; background: var(--lv-easy); border-radius: 999px; padding: 1px 6px; }\n.shop-tabs button.new::after { content: \"New\"; margin-left: 6px; vertical-align: 1px; }\n\n/* ---------- Google Sites landing (only when the Sites loader sets WCC_LANDING) ---------- */\nbody.landing .menu-btns > :not(.landing-only), body.landing #acctChip { display: none !important; }\nbody.landing #openTabBtn { padding: 20px 24px; }\nbody.landing #openTabBtn span { font-size: 26px; }\n.landing-note { margin: 4px 2px 0; font-size: 14px; color: var(--mute); }\n.landing-note a { color: var(--gold-hi); cursor: pointer; text-decoration: underline; }\n\n\u003c/style>\n\u003c/head>\n<body>\n<div id=\"app\">\n  <div class=\"ambient\" aria-hidden=\"true\"><div class=\"drift\" id=\"drift\">\u003c/div><canvas class=\"embers\" id=\"embers\">\u003c/canvas>\u003c/div>\n\n  \u003c!-- MAIN MENU -->\n  \u003csection class=\"screen\" id=\"menu\">\n    <div class=\"acct-chip\" id=\"acctChip\" hidden>\u003c/div>\n    <div class=\"menu-wrap\">\n      <div class=\"menu-left\">\n        <p class=\"eyebrow\">Chess with 55 secret pieces\u003c/p>\n        <h1 class=\"logo\">\u003cspan class=\"logo-a\">Wildcard\u003c/span>\u003cspan class=\"logo-b\">Chess\u003c/span>\u003c/h1>\n        <p class=\"tagline\">Both armies start with the usual sixteen pieces, plus a wildcard with rules of its own. You can see your opponent's. You can't see what it does.\u003c/p>\n        <nav class=\"menu-btns\" aria-label=\"Main menu\">\n          <button class=\"btn primary landing-only\" id=\"openTabBtn\" hidden>\u003cspan>Open in a new tab\u003c/span>\u003csmall>Plays full size in its own window\u003c/small>\u003c/button>\n          <p class=\"landing-only landing-note\" id=\"landingNote\" hidden>\u003c/p>\n          <button class=\"btn primary\" data-mode=\"ai\" data-deal=\"classic\" data-fog=\"0\" id=\"playBtn\">\u003cspan>Play\u003c/span>\u003csmall>vs the computer, random wildcards\u003c/small>\u003c/button>\n          <div class=\"menu-modes\">\n            <button class=\"btn draft-btn\" data-mode=\"ai\" data-deal=\"draft\" data-fog=\"0\" id=\"draftBtn\">\u003cspan>Draft\u003c/span>\u003csmall>Build your army card by card\u003c/small>\u003c/button>\n            <button class=\"btn fog-btn\" data-mode=\"ai\" data-deal=\"classic\" data-fog=\"1\" id=\"fogBtn\">\u003cspan>Fog Mode\u003c/span>\u003csmall>See only what your pieces touch\u003c/small>\u003c/button>\n            <button class=\"btn online-btn\" data-go=\"online\" id=\"onlineBtn\">\u003cspan>Online\u003c/span>\u003csmall>Play a friend anywhere\u003c/small>\u003c/button>\n            <button class=\"btn\" data-mode=\"local\" data-fog=\"0\" id=\"localBtn\">\u003cspan>Pass &amp; Play\u003c/span>\u003csmall>2 players, one device\u003c/small>\u003c/button>\n          \u003c/div>\n          <div class=\"menu-row\">\n            <button class=\"btn btn-sm\" data-go=\"codex\">\u003cspan>Codex\u003c/span>\u003csmall id=\"codexCount\">0 / 55 discovered\u003c/small>\u003c/button>\n            <button class=\"btn btn-sm\" data-go=\"shop\">\u003cspan>Shop\u003c/span>\u003csmall id=\"shopCount\">Boards &amp; more\u003c/small>\u003c/button>\n            <button class=\"btn btn-sm\" data-go=\"how\">\u003cspan>Rules\u003c/span>\u003csmall>How it works\u003c/small>\u003c/button>\n            <button class=\"btn btn-sm ghost\" id=\"soundBtn\">\u003cspan>Sound\u003c/span>\u003csmall id=\"soundState\">On\u003c/small>\u003c/button>\n          \u003c/div>\n        \u003c/nav>\n      \u003c/div>\n      <div class=\"menu-right\" aria-hidden=\"true\">\n        <div class=\"float-cards\">\n          <div class=\"fcard\" style=\"--r:-14deg;--d:0s\"><div class=\"fcard-in\">\u003c/div>\u003c/div>\n          <div class=\"fcard\" style=\"--r:9deg;--d:-2.2s\"><div class=\"fcard-in\">\u003c/div>\u003c/div>\n          <div class=\"fcard\" style=\"--r:-4deg;--d:-4.1s\"><div class=\"fcard-in\">\u003c/div>\u003c/div>\n        \u003c/div>\n        <div class=\"stage\">\n          <div class=\"tilt\"><div class=\"board\" id=\"showBoard\">\u003c/div>\u003c/div>\n          <div class=\"stage-shadow\">\u003c/div>\n        \u003c/div>\n        <p class=\"stage-cap\" id=\"showCap\">Exhibition match\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- DIFFICULTY -->\n  \u003csection class=\"screen\" id=\"setup\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"menu\">← Menu\u003c/button><h2 id=\"setupTitle\">Pick your opponent\u003c/h2>\u003c/header>\n    <div class=\"setup-body\">\n      <div class=\"opts\"><div class=\"seg seg-big\" id=\"segMode\"><button data-v=\"ai\">vs Computer\u003c/button><button data-v=\"local\">Pass &amp; Play · 2 players\u003c/button>\u003c/div>\u003c/div>\n      <div class=\"local-intro\" id=\"localIntro\">\n        <div class=\"duel\"><div class=\"duel-p\">{W}\u003c/div>\u003cspan>vs\u003c/span><div class=\"duel-p\">{B}\u003c/div>\u003c/div>\n        <p>Two players share this device. Each of you sees your own wildcard rules and only the <i>name\u003c/i> of the other's. Between turns a screen hides the board so you can pass the device without giving anything away.\u003c/p>\n      \u003c/div>\n      <div class=\"diff-grid\" role=\"radiogroup\" aria-label=\"Difficulty\">\n        <button class=\"diff\" data-level=\"easy\" role=\"radio\">\n          <div class=\"diff-ico\" data-piece=\"P\">\u003c/div>\n          <div class=\"diff-name\">Easy\u003c/div>\n          <div class=\"diff-sub\">The Pawn Pusher\u003c/div>\n          <ul><li>Looks one move ahead\u003c/li><li>Gets distracted, blunders often\u003c/li><li>Take-backs allowed\u003c/li>\u003c/ul>\n        \u003c/button>\n        <button class=\"diff\" data-level=\"medium\" role=\"radio\">\n          <div class=\"diff-ico\" data-piece=\"N\">\u003c/div>\n          <div class=\"diff-name\">Medium\u003c/div>\n          <div class=\"diff-sub\">The Club Regular\u003c/div>\n          <ul><li>Sees two moves ahead\u003c/li><li>Grabs anything left hanging\u003c/li><li>Take-backs allowed\u003c/li>\u003c/ul>\n        \u003c/button>\n        <button class=\"diff\" data-level=\"pro\" role=\"radio\">\n          <div class=\"diff-ico\" data-piece=\"Q\">\u003c/div>\n          <div class=\"diff-name\">Pro\u003c/div>\n          <div class=\"diff-sub\">The Tactician\u003c/div>\n          <ul><li>Calculates four moves deep\u003c/li><li>Knows every wildcard trick\u003c/li><li>Take-backs allowed\u003c/li>\u003c/ul>\n        \u003c/button>\n        <button class=\"diff xtreme\" data-level=\"xtreme\" role=\"radio\">\n          <div class=\"diff-ico\" data-piece=\"void\">\u003c/div>\n          <div class=\"diff-name\">Xtreme\u003c/div>\n          <div class=\"diff-sub\">The Unhinged\u003c/div>\n          <ul><li>Thinks as deep as time allows\u003c/li><li><b>Brings one extra wildcard\u003c/b> (classic deal)\u003c/li><li>No take-backs\u003c/li>\u003c/ul>\n        \u003c/button>\n      \u003c/div>\n      <div class=\"opts\">\n        <div class=\"opt ai-only\">\u003cspan class=\"opt-l\">Play as\u003c/span>\n          <div class=\"seg\" id=\"segColor\"><button data-v=\"w\">White\u003c/button><button data-v=\"r\">Random\u003c/button><button data-v=\"b\">Black\u003c/button>\u003c/div>\u003c/div>\n        <div class=\"opt\">\u003cspan class=\"opt-l\">Deal\u003c/span>\n          <div class=\"seg\" id=\"segDeal\"><button data-v=\"classic\">Classic\u003c/button><button data-v=\"draft\">Draft\u003c/button>\u003c/div>\u003c/div>\n        <div class=\"opt classic-only\">\u003cspan class=\"opt-l\">Wildcards each\u003c/span>\n          <div class=\"seg\" id=\"segCount\"><button data-v=\"1\">1\u003c/button><button data-v=\"2\">2\u003c/button><button data-v=\"3\">3\u003c/button>\u003c/div>\u003c/div>\n        <div class=\"opt\">\u003cspan class=\"opt-l\">Fog of war\u003c/span>\n          <div class=\"seg\" id=\"segFog\"><button data-v=\"0\">Off\u003c/button><button data-v=\"1\">On\u003c/button>\u003c/div>\u003c/div>\n        <div class=\"opt local-only\">\u003cspan class=\"opt-l\">Privacy screen\u003c/span>\n          <div class=\"seg\" id=\"segPrivacy\"><button data-v=\"1\">On\u003c/button><button data-v=\"0\">Off\u003c/button>\u003c/div>\u003c/div>\n        <div class=\"opt local-only\">\u003cspan class=\"opt-l\">Flip board each turn\u003c/span>\n          <div class=\"seg\" id=\"segFlip\"><button data-v=\"1\">On\u003c/button><button data-v=\"0\">Off\u003c/button>\u003c/div>\u003c/div>\n      \u003c/div>\n      <p class=\"deal-note\" id=\"dealNote\">\u003c/p>\n      <button class=\"btn primary big\" id=\"dealBtn\">\u003cspan id=\"dealLabel\">Deal the wildcards\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- DRAFT -->\n  \u003csection class=\"screen\" id=\"draft\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"setup\">← Opponent\u003c/button><h2>The deal\u003c/h2>\u003c/header>\n    <div class=\"draft-body\">\n      <div class=\"draft-side\">\n        <h3 id=\"draftMineTitle\">Yours\u003c/h3>\n        <div class=\"cards\" id=\"draftMine\">\u003c/div>\n        <button class=\"btn ghost small\" id=\"rerollBtn\">Reroll mine (1 left)\u003c/button>\n      \u003c/div>\n      <div class=\"vs\" aria-hidden=\"true\">vs\u003c/div>\n      <div class=\"draft-side\">\n        <h3 id=\"draftTheirsTitle\">Theirs\u003c/h3>\n        <div class=\"cards\" id=\"draftTheirs\">\u003c/div>\n        <p class=\"draft-note\">You'll find out what it does the hard way.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    <div class=\"draft-foot\"><button class=\"btn primary big\" id=\"startBtn\">\u003cspan id=\"startLabel\">Start the game\u003c/span>\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- DRAFT PICKS -->\n  \u003csection class=\"screen\" id=\"pick\">\n    <header class=\"topbar\"><button class=\"back\" id=\"pickBack\">← Setup\u003c/button><h2>The draft\u003c/h2>\u003c/header>\n    <div class=\"pick-body\">\n      <div class=\"pick-dots\" id=\"pickDots\" aria-hidden=\"true\">\u003c/div>\n      <p class=\"pick-k\" id=\"pickWho\">\u003c/p>\n      <div class=\"pair\" id=\"pair\">\u003c/div>\n      <p class=\"pick-note\" id=\"pickNote\">Take one. The other goes to your opponent.\u003c/p>\n      <div class=\"armies\">\n        <div class=\"army\"><h4 id=\"armyMineT\">Your army\u003c/h4><div class=\"army-row\" id=\"armyMine\">\u003c/div>\u003c/div>\n        <div class=\"army\"><h4 id=\"armyTheirsT\">Their army\u003c/h4><div class=\"army-row\" id=\"armyTheirs\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- GAME -->\n  \u003csection class=\"screen\" id=\"game\">\n    <div class=\"game-wrap\">\n      <div class=\"board-col\">\n        <div class=\"pbar\" id=\"barTop\">\u003c/div>\n        <div class=\"board-frame\">\n          <div class=\"board\" id=\"mainBoard\">\u003c/div>\n          <div class=\"toast\" id=\"toast\" aria-live=\"polite\">\u003c/div>\n          <div class=\"arrange-bar\" id=\"arrangeBar\" hidden>\u003cspan id=\"arrangeText\">Revealing the armies…\u003c/span><button class=\"btn primary small\" id=\"arrangeDone\">\u003cspan>Skip\u003c/span>\u003c/button>\u003c/div>\n        \u003c/div>\n        <div class=\"pbar\" id=\"barBot\">\u003c/div>\n      \u003c/div>\n      <aside class=\"side\">\n        <div class=\"side-head\">\n          <div class=\"mode-chip\" id=\"modeChip\">\u003c/div>\n          <div class=\"status\" id=\"status\" aria-live=\"polite\">\u003c/div>\n          <div class=\"ol-presence\" id=\"onlinePresence\" hidden>\u003c/div>\n        \u003c/div>\n        <div class=\"side-scroll\">\n          <div class=\"wild-info\" id=\"wildInfo\">\u003c/div>\n          <div class=\"log-wrap\"><div class=\"log-title\">Moves\u003c/div><ol class=\"log\" id=\"log\">\u003c/ol>\u003c/div>\n        \u003c/div>\n        <div class=\"controls\">\n          <button id=\"undoBtn\">Undo\u003c/button><button id=\"flipBtn\">Flip\u003c/button><button id=\"resignBtn\">Resign\u003c/button><button id=\"leaveBtn\">Menu\u003c/button>\n        \u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- CODEX -->\n  \u003csection class=\"screen\" id=\"codex\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"menu\">← Menu\u003c/button><h2>Codex\u003c/h2>\n      <label class=\"spoil\"><input type=\"checkbox\" id=\"spoilers\"> Show undiscovered\u003c/label>\u003c/header>\n    <div class=\"codex-body\">\n      <p class=\"codex-lede\" id=\"codexLede\">\u003c/p>\n      <div class=\"codex-grid\" id=\"codexGrid\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ONLINE -->\n  \u003csection class=\"screen\" id=\"online\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"menu\">← Menu\u003c/button><h2>Online\u003c/h2>\u003c/header>\n    <div class=\"online-body\" id=\"onlineBody\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- SHOP -->\n  \u003csection class=\"screen\" id=\"shop\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"menu\">← Menu\u003c/button><h2>Shop\u003c/h2><div class=\"shop-wallet\" id=\"shopWallet\">\u003c/div>\u003c/header>\n    <div class=\"shop-body\">\n      <div class=\"shop-preview\">\n        <div class=\"board\" id=\"shopBoard\">\u003c/div>\n        <div class=\"pbar shop-pv-bar\" id=\"shopPvBar\">\u003c/div>\n        <p class=\"shop-pv-cap\" id=\"shopPvCap\">\u003c/p>\n      \u003c/div>\n      <div class=\"shop-main\">\n        <div class=\"shop-featured\" id=\"shopFeatured\">\u003c/div>\n        <div class=\"shop-tabs\" role=\"tablist\">\n          <button data-tab=\"board\" role=\"tab\">Boards\u003c/button><button data-tab=\"pieces\" role=\"tab\">Piece sets\u003c/button><button data-tab=\"back\" role=\"tab\">Card backs\u003c/button>\n          <button data-tab=\"capture\" role=\"tab\">Captures\u003c/button><button data-tab=\"finale\" role=\"tab\">Finales\u003c/button><button data-tab=\"avatar\" role=\"tab\">Avatars\u003c/button>\n          <button data-tab=\"member\" role=\"tab\">👑 Membership\u003c/button><button data-tab=\"diamonds\" role=\"tab\">💎 Diamonds\u003c/button>\n        \u003c/div>\n        <div class=\"shop-grid\" id=\"shopGrid\">\u003c/div>\n        <p class=\"shop-foot\">Coins, diamonds and membership are your SirSC wallet, shared with Downhill Death Run and SirSC's other games. Earn coins by beating the computer: 500 on Easy up to 4,000 on Xtreme, ×1.25 for a drafted army, ×1.5 for members, +1,500 for your first win each day, and 500 for every wildcard new to your Codex. Up to 25,000 coins a day.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- HOW -->\n  \u003csection class=\"screen\" id=\"how\">\n    <header class=\"topbar\"><button class=\"back\" data-go=\"menu\">← Menu\u003c/button><h2>How it works\u003c/h2>\u003c/header>\n    <div class=\"how-body\">\n      <article>\n        <h3>Normal chess, plus a stranger\u003c/h3>\n        <p>Both sides start with the standard army, except that each <b>wildcard\u003c/b> (dealt at random from 55) takes the place of one of your regular pieces. It can replace any piece except the king: a pawn, a knight, even your queen. You'll see which one when the cards are dealt.\u003c/p>\n        <h3>You know yours. You don't know theirs.\u003c/h3>\n        <p>Before the game you see your own wildcard and what it does. You also see your opponent's piece and its name, but not its rules. Hover or tap any piece on the board to read about it; theirs only says <i>unknown\u003c/i>. Watch what it does and work it out. When the game ends, its rules are revealed and it joins your Codex.\u003c/p>\n        <h3>How to win\u003c/h3>\n        <p>Checkmate still wins. So does destroying the king outright, which some wildcards can do: explosions, charges, arrows. Your own moves can never leave your king in check or get it killed. Stalemate, 50 moves without a capture or pawn move, threefold repetition, and bare kings are draws.\u003c/p>\n        <h3>Playing a move\u003c/h3>\n        <p>Click or drag a piece. Dots mark quiet moves, rings mark captures, and coloured stars mark special abilities. A pulsing ring on the piece itself means it has an ability it uses in place (click it again to use it). If one square offers two different moves, you'll be asked which.\u003c/p>\n        <h3>Promotion\u003c/h3>\n        <p>Pawns that reach the last rank can promote into a queen, rook, bishop, knight, or one of your wildcards.\u003c/p>\n        <h3>Coins, diamonds and the Shop\u003c/h3>\n        <p>Sign in with your Warden Chat account to earn <b>🪙 coins\u003c/b> for games against the computer: 500 for beating Easy, 1,000 Medium, 2,000 Pro, 4,000 Xtreme. Draws pay 30% and losses 10%. A drafted army pays ×1.25, SirSC Members get ×1.5, your first win each day adds 1,500, and every wildcard new to your Codex pays 500. You can earn up to 25,000 coins a day. Pass &amp; Play games don't earn coins. Spend coins or <b>💎 diamonds\u003c/b> in the Shop on board themes, card backs and checkmate finales. It's the same wallet as Downhill Death Run.\u003c/p>\n        <h3>The draft\u003c/h3>\n        <p>Pick <b>Draft\u003c/b> on the setup screen to build both armies from scratch. You're shown 16 pairs of cards, 8 of them for you to choose from; take one, and the one you leave goes to your opponent. Your army is your 8 picks plus the 8 your opponent passed over, so it might have four bishops and a Cyclops where the pawns usually stand. One pair is always King vs King, so everybody gets exactly one king. You can read the rules of every card offered to you, which means you'll know the wildcards you passed to your opponent, but not the ones they picked. Both armies stay face down while you draft, your own picks included; when it's over, all 32 pieces flip face up on the board one by one over about 10 seconds. Armies are laid out automatically and can't be rearranged: the king on its own square, rooks in the corners, the queen beside the king, knights and bishops where they usually stand, pawns across the front, and everything else wherever it fits.\u003c/p>\n        <h3>Fog Mode\u003c/h3>\n        <p>Turn on <b>Fog of war\u003c/b> (or pick Fog Mode on the main menu) and you can only see the squares your pieces stand on and the squares right next to them. Enemy pieces vanish into the fog when you lose sight of them. There is no check in the fog: nobody tells you your king is under attack, and you win by <b>capturing the enemy king\u003c/b>. If something you can't see blocks a move, you're told and can pick another; if you land on a hidden enemy, you capture it. The computer plays by the same rules and only sees what its own pieces see. In Pass &amp; Play the privacy screen is always on in the fog.\u003c/p>\n        <h3>Legendary wildcards\u003c/h3>\n        <p>Five wildcards are <b>legendary\u003c/b>: the Elder Dragon, Archangel, Time Lord, Black Hole and Storm King. They are animated, far stronger than anything else, and rare: about one wildcard in twenty is legendary, in the classic deal and in the draft.\u003c/p>\n        <h3>Online\u003c/h3>\n        <p>Sign in with your Warden Chat account, open <b>Online\u003c/b> and create a game: you get a 5-letter code to send a friend, who joins with it. Warden Chat deals both sides' wildcards, so nobody picks their own. Your wildcard's rules are shown to you and theirs stay hidden, just like against the computer, and Fog Mode works online too. If your friend disappears for more than two minutes you can claim the win. Online games don't earn coins yet.\u003c/p>\n        <h3>Pass &amp; Play\u003c/h3>\n        <p>Two people can play on one device. Each player looks at their own cards in private, and between turns a screen covers the board until the next player taps <i>Ready\u003c/i>, so nobody sees the other's wildcard rules. The board can turn to face whoever is moving.\u003c/p>\n        <h3>Difficulty\u003c/h3>\n        <p><b>Easy\u003c/b> and <b>Medium\u003c/b> look one and two moves ahead. <b>Pro\u003c/b> calculates four moves deep. <b>Xtreme\u003c/b> searches as deep as it can in four seconds and brings one more wildcard than you do. Only Xtreme refuses take-backs.\u003c/p>\n      \u003c/article>\n    \u003c/div>\n  \u003c/section>\n\n  <div class=\"curtain\" id=\"curtain\" hidden>\n    <div class=\"curtain-card\">\n      <div class=\"curtain-ico\" id=\"curtainIco\">\u003c/div>\n      <p class=\"curtain-k\" id=\"curtainK\">\u003c/p>\n      <h2 id=\"curtainTitle\">\u003c/h2>\n      <p class=\"curtain-text\" id=\"curtainText\">\u003c/p>\n      <button class=\"btn primary big\" id=\"curtainBtn\">\u003cspan id=\"curtainBtnLabel\">Ready\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  <div class=\"modal\" id=\"signin\" hidden>\n    <form class=\"modal-card signin-card\" id=\"signinForm\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"siTitle\">\n      <h2 class=\"draw\" id=\"siTitle\">Sign in\u003c/h2>\n      <p class=\"why\">Use your Warden Chat account. Your coins, diamonds and membership are shared with Downhill Death Run and SirSC's other games.\u003c/p>\n      <label class=\"si-field\">Username <input id=\"siUser\" autocomplete=\"username\" maxlength=\"24\" required>\u003c/label>\n      <label class=\"si-field\">Password <input id=\"siPass\" type=\"password\" autocomplete=\"current-password\" required>\u003c/label>\n      <p class=\"si-err\" id=\"siErr\" role=\"alert\">\u003c/p>\n      <div class=\"modal-btns\">\n        <button class=\"btn primary\" type=\"submit\">\u003cspan>Sign in\u003c/span>\u003c/button>\n        <button class=\"btn\" type=\"button\" id=\"siCreate\">\u003cspan>Create account\u003c/span>\u003c/button>\n        <button class=\"btn ghost\" type=\"button\" id=\"siClose\">\u003cspan>Cancel\u003c/span>\u003c/button>\n      \u003c/div>\n      <p class=\"si-foot\">Changing your password or deleting your account happens on <a id=\"siChat\" href=\"https://chat.sirsc104.com/\" target=\"_blank\" rel=\"noopener\">Warden Chat\u003c/a>.\u003c/p>\n    \u003c/form>\n  \u003c/div>\n  <div class=\"modal\" id=\"modal\" hidden><div class=\"modal-card\" id=\"modalCard\" role=\"dialog\" aria-modal=\"true\">\u003c/div>\u003c/div>\n  <div class=\"tip\" id=\"tip\" hidden>\u003c/div>\n  <div class=\"chooser\" id=\"chooser\" hidden>\u003c/div>\n\u003c/div>\n\u003cscript>\n/* Wildcard Chess: piece artwork and wildcard catalogue.\n   Every piece is drawn in a 100x100 box in the flat, thick-outlined style of a wooden club set:\n   a light body with a soft shade down its right side. Wildcards share one pedestal and carry a\n   coloured accent so they stand out from the standard army. */\n'use strict';\n\nconst INK = { w: '#3b3a38', b: '#222120' };\n\n/* Piece sets (sold in the Shop): the four gradient stops of each side's body (light, light, shade,\n   shade), the outline ink, and how see-through the body is. Every piece and wildcard is drawn in the\n   equipped set; accents keep their own colours. */\nconst PIECE_SETS = {\n  classic: { name: 'Club Set', desc: 'The standard white and charcoal club pieces.',\n    w: { stops: ['#ffffff', '#f3f2f0', '#dcdad6', '#cfccc7'], ink: '#3b3a38' }, b: { stops: ['#6d6b68', '#5d5b58', '#4b4946', '#42403d'], ink: '#222120' } },\n  marble: { name: 'Marble & Obsidian', desc: 'Polished white marble against glassy black obsidian.',\n    w: { stops: ['#fdfcf9', '#f1eee8', '#d9d4cb', '#cbc5ba'], ink: '#4a463f' }, b: { stops: ['#3b3d44', '#2e3036', '#202227', '#17181c'], ink: '#0b0c0e' } },\n  carved: { name: 'Carved Wood', desc: 'Hand-carved maple against dark walnut.',\n    w: { stops: ['#f3dcae', '#e6c58e', '#cfa56b', '#c09359'], ink: '#5c3b17' }, b: { stops: ['#8a5a35', '#764a2a', '#5c381f', '#4d2e19'], ink: '#24140a' } },\n  gilded: { name: 'Gilded', desc: 'Polished silver against solid gold.',\n    w: { stops: ['#ffffff', '#e9edf2', '#bcc5cf', '#a9b3be'], ink: '#4f5966' }, b: { stops: ['#ffe9a6', '#f3c955', '#c9952c', '#b07e1d'], ink: '#4a3205' } },\n  glass: { name: 'Crystal Glass', desc: 'See-through crystal that glows from inside.',\n    w: { stops: ['#f2faff', '#d9efff', '#a9d4f7', '#93c6ef'], ink: '#3f74a3', alpha: 0.78 }, b: { stops: ['#8f7fe0', '#6d5cc9', '#4a3d99', '#3b307e'], ink: '#1a1240', alpha: 0.82 } },\n  neon: { name: 'Neon', desc: 'Dark pieces outlined in glowing cyan and magenta.',\n    w: { stops: ['#14232b', '#10202a', '#0c1a22', '#0a161d'], ink: '#2ef2ff' }, b: { stops: ['#24112a', '#1d0e22', '#160a1a', '#120815'], ink: '#ff4df0' } },\n  royal: { name: 'Royal Court', desc: 'Ivory and crimson trimmed in gold. November 2026\\u2019s members-only set.',\n    w: { stops: ['#fffaf0', '#f6ecd6', '#e3cfa2', '#d6bd85'], ink: '#7a5a14' }, b: { stops: ['#8a1c34', '#741528', '#5a0f1f', '#4a0c19'], ink: '#2a0710' } },\n};\nlet PIECE_SET = 'classic';\nconst gradId = (set, color) => (set === 'classic' ? (color === 'w' ? 'gW' : 'gB') : `g${color.toUpperCase()}-${set}`);\n\n/* Tokens inside the art strings:\n   {B} body shape, {D} outline-only detail, {K} solid ink, {A} accent fill, {S} accent stroke,\n   {C} body-coloured stroke (for coils and tubes), {O} thick ink stroke under a {C}. */\nfunction tokens(color, accent, set) {\n  const ink = (PIECE_SETS[set] || PIECE_SETS.classic)[color].ink;\n  const grad = `url(#${gradId(PIECE_SETS[set] ? set : 'classic', color)})`;\n  return {\n    B: `fill=\"${grad}\" stroke=\"${ink}\" stroke-width=\"3.2\" stroke-linejoin=\"round\"`,\n    D: `fill=\"none\" stroke=\"${ink}\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"`,\n    K: `fill=\"${ink}\"`,\n    A: `fill=\"${accent}\" stroke=\"${ink}\" stroke-width=\"2.4\" stroke-linejoin=\"round\"`,\n    S: `fill=\"none\" stroke=\"${accent}\" stroke-width=\"4.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"`,\n    C: `fill=\"none\" stroke=\"${grad}\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"`,\n    O: `fill=\"none\" stroke=\"${ink}\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\"`,\n    L: `fill=\"none\" stroke=\"${ink}\" stroke-width=\"4.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"`,\n  };\n}\n\nconst PED = '<rect {B} x=\"22\" y=\"81\" width=\"56\" height=\"11\" rx=\"5.5\"/>' +\n  '<path {B} d=\"M35 82 C37 72 41 66 42 61 H58 C59 66 63 72 65 82 Z\"/>' +\n  '<rect {B} x=\"33\" y=\"54\" width=\"34\" height=\"8\" rx=\"4\"/>';\n\nconst STD_ART = {\n  P: '<rect {B} x=\"22\" y=\"80\" width=\"56\" height=\"12\" rx=\"6\"/>' +\n     '<path {B} d=\"M34 81 C36 68 41 60 43 54 H57 C59 60 64 68 66 81 Z\"/>' +\n     '<rect {B} x=\"35\" y=\"47\" width=\"30\" height=\"9\" rx=\"4.5\"/>' +\n     '<circle {B} cx=\"50\" cy=\"33\" r=\"13\"/>',\n  R: '<rect {B} x=\"18\" y=\"81\" width=\"64\" height=\"11\" rx=\"5.5\"/>' +\n     '<rect {B} x=\"25\" y=\"72\" width=\"50\" height=\"10\" rx=\"3\"/>' +\n     '<path {B} d=\"M31 72 L34 44 H66 L69 72 Z\"/>' +\n     '<path {B} d=\"M27 40 V19 H37 V26 H45 V19 H55 V26 H63 V19 H73 V40 Z\"/>' +\n     '<rect {B} x=\"26\" y=\"37\" width=\"48\" height=\"8\" rx=\"2\"/>',\n  N: '<rect {B} x=\"20\" y=\"81\" width=\"62\" height=\"11\" rx=\"5.5\"/>' +\n     '<rect {B} x=\"28\" y=\"73\" width=\"48\" height=\"9\" rx=\"3\"/>' +\n     '<path {B} d=\"M71 74 C74 60 77 44 71 31 C67 24 61 20 57 19 L59 8 L50 15 C42 15 34 21 30 29 L20 47 C18 52 20 57 25 58 C30 59 34 56 38 54 C42 54 44 57 45 60 C40 65 34 69 33 74 Z\"/>' +\n     '<path {D} d=\"M63 25 C70 36 71 52 67 68\"/>' +\n     '<circle {K} cx=\"41\" cy=\"31\" r=\"3.4\"/>' +\n     '<circle {K} cx=\"24.5\" cy=\"51.5\" r=\"2\"/>',\n  B: '<rect {B} x=\"22\" y=\"80\" width=\"56\" height=\"12\" rx=\"6\"/>' +\n     '<path {B} d=\"M36 81 C38 74 42 70 43 66 H57 C58 70 62 74 64 81 Z\"/>' +\n     '<rect {B} x=\"34\" y=\"59\" width=\"32\" height=\"8\" rx=\"4\"/>' +\n     '<path {B} d=\"M50 11 C36 22 30 37 34 49 C36 56 42 60 50 60 C58 60 64 56 66 49 C69 39 65 30 59 23 L51 37 L47 34 L55 19 C53 16 52 13 50 11 Z\"/>',\n  Q: '<rect {B} x=\"18\" y=\"81\" width=\"64\" height=\"11\" rx=\"5.5\"/>' +\n     '<rect {B} x=\"26\" y=\"71\" width=\"48\" height=\"10\" rx=\"4\"/>' +\n     '<path {B} d=\"M28 72 L18 37 L32 55 L34 30 L43 52 L50 25 L57 52 L66 30 L68 55 L82 37 L72 72 Z\"/>' +\n     '<circle {B} cx=\"18\" cy=\"33\" r=\"5.5\"/><circle {B} cx=\"34\" cy=\"26\" r=\"5.5\"/><circle {B} cx=\"50\" cy=\"20\" r=\"5.5\"/>' +\n     '<circle {B} cx=\"66\" cy=\"26\" r=\"5.5\"/><circle {B} cx=\"82\" cy=\"33\" r=\"5.5\"/>',\n  K: '<rect {B} x=\"18\" y=\"81\" width=\"64\" height=\"11\" rx=\"5.5\"/>' +\n     '<rect {B} x=\"26\" y=\"71\" width=\"48\" height=\"10\" rx=\"4\"/>' +\n     '<path {B} d=\"M28 72 C15 60 16 43 30 40 C40 38 47 45 50 53 C53 45 60 38 70 40 C84 43 85 60 72 72 Z\"/>' +\n     '<path {B} d=\"M50 54 C45 45 45 37 50 32 C55 37 55 45 50 54 Z\"/>' +\n     '<path {B} d=\"M46 9 H54 V15 H60 V22 H54 V32 H46 V22 H40 V15 H46 Z\"/>',\n  WALL: '',\n};\n\n/* The 55 wildcards (the last 5 are legendary). `desc` is what the owner sees; the opponent only ever sees the icon and name. */\nconst WILD = {\n  bomber: { name: 'Bomber', accent: '#ff9a2e', moves: 'Steps 1 square',\n    desc: 'Steps one square in any direction. When it captures, it explodes: every piece in the 3×3 blast around the target is destroyed, friend or foe, the Bomber included. Kings are not safe, but it will never blow up its own.',\n    art: '<circle {B} cx=\"50\" cy=\"37\" r=\"17\"/><rect {B} x=\"43\" y=\"15\" width=\"14\" height=\"8\" rx=\"2\"/>' +\n         '<path {D} d=\"M50 15 C50 9 56 6 61 9\"/><path {D} d=\"M40 32 C41 28 44 25 47 24\" opacity=\".5\"/>' +\n         '<path {A} d=\"M65 2 L67 7 L72 7 L68 10.5 L70 15.5 L65 12.5 L60 15.5 L62 10.5 L58 7 L63 7 Z\"/>' },\n  phantom: { name: 'Phantom', accent: '#5fe0ff', moves: 'Any distance along ranks and files',\n    desc: 'Glides any distance along ranks and files, passing straight through every piece in its way. Captures wherever it lands.',\n    art: '<path {B} d=\"M33 57 V31 C33 11 67 11 67 31 V57 L61 51 L55.5 57 L50 51 L44.5 57 L39 51 Z\"/>' +\n         '<ellipse {A} cx=\"43\" cy=\"31\" rx=\"4.2\" ry=\"6.2\"/><ellipse {A} cx=\"57\" cy=\"31\" rx=\"4.2\" ry=\"6.2\"/>' +\n         '<path {D} d=\"M45 43 C48 45 52 45 55 43\"/>' },\n  blink: { name: 'Blink', accent: '#b57bff', moves: 'Steps 1, or teleports',\n    desc: 'Steps one square, or teleports to any empty square on the board. After a teleport it needs two turns to recharge. It cannot capture by teleporting.',\n    art: '<circle {B} cx=\"50\" cy=\"34\" r=\"19\"/>' +\n         '<path {S} d=\"M50 34 C50 30 55 30 55 34 C55 40 44 40 44 34 C44 26 60 26 60 34 C60 44 39 44 39 33 C39 23 48 18 56 19\"/>' },\n  trickster: { name: 'Trickster', accent: '#ffcf3f', moves: 'Steps 1, or swaps',\n    desc: 'Steps one square, or swaps places with any friendly piece up to two squares away, the king included.',\n    art: '<path {B} d=\"M31 56 C31 46 34 40 38 36 C32 31 26 28 19 28 C27 21 36 23 42 29 C42 21 46 14 50 10 C54 14 58 21 58 29 C64 23 73 21 81 28 C74 28 68 31 62 36 C66 40 69 46 69 56 Z\"/>' +\n         '<path {D} d=\"M35 47 H65\"/>' +\n         '<circle {A} cx=\"18\" cy=\"28\" r=\"5\"/><circle {A} cx=\"50\" cy=\"9\" r=\"5\"/><circle {A} cx=\"82\" cy=\"28\" r=\"5\"/>' },\n  archer: { name: 'Archer', accent: '#ff5a4a', moves: 'Steps 1, shoots 2–3 away',\n    desc: 'Steps one square but never captures by moving. Instead it shoots: it removes an enemy exactly 2 or 3 squares away in a straight line, firing over anything in between, without moving.',\n    art: '<path {B} d=\"M38 10 C66 16 66 52 38 58 L40 53 C58 47 58 21 40 15 Z\"/>' +\n         '<path {D} d=\"M39 12.5 V55.5\"/>' +\n         '<path {L} d=\"M24 34 H66\"/><path {D} d=\"M25 34 L20 29 M25 34 L20 39 M29 34 L24 29 M29 34 L24 39\"/>' +\n         '<path {A} d=\"M64 27 L76 34 L64 41 Z\"/>' },\n  necro: { name: 'Necromancer', accent: '#6dff8a', moves: 'Up to 2 diagonally',\n    desc: 'Moves up to two squares diagonally. Twice per game, instead of moving, it raises your most recently lost piece back to life on an adjacent empty square.',\n    art: '<path {B} d=\"M32 33 C32 17 40 9 50 9 C60 9 68 17 68 33 C68 41 65 45 62 47 V56 H38 V47 C35 45 32 41 32 33 Z\"/>' +\n         '<circle {A} cx=\"42\" cy=\"32\" r=\"5.6\"/><circle {A} cx=\"58\" cy=\"32\" r=\"5.6\"/>' +\n         '<path {K} d=\"M50 38 L46.5 45 H53.5 Z\"/><path {D} d=\"M44 49 V56 M50 49 V56 M56 49 V56\"/>' },\n  frost: { name: 'Frost Warden', accent: '#9fe6ff', moves: 'Steps 1 square',\n    desc: 'Steps one square in any direction. Enemy p _FX.shadow.colors, kind: 'smoke', speed: 0.7, size: 0.13, life: 50, gravity: 0, drag: 0.86 }); },\n  lightning: (b, q) => { b.beam(q < 32 ? q + 32 : q - 32, q, '#ffffff', 14); b.burstAt(q, { n: 30, color: CAPTURE_FX.lightning.colors, kind: 'spark', speed: 1.8, life: 34 }); b.flash('gold'); Sound.play('zap'); },\n  goldrush: (b, q) => { b.burstAt(q, { n: 34, color: CAPTURE_FX.goldrush.colors, kind: 'coin', speed: 1.6, size: 0.11, life: 70, gravity: 0.12, lift: 2.2 }); Sound.play('coin'); },\n  diamond: (b, q) => { b.burstAt(q, { n: 30, color: CAPTURE_FX.diamond.colors, kind: 'gem', speed: 1.6, size: 0.1, life: 56, gravity: 0.08, lift: 1 }); b.burstAt(q, { n: 16, color: ['#ffffff'], kind: 'spark', speed: 1, gravity: 0 }); },\n};\nfunction playCapture(id, b, q, p) { (CAPTURE_PLAY[id] || CAPTURE_FX.splinters.play)(b, q, p); }\n\n/* Avatars: a framed portrait and a title shown in your player bar (and to your opponent online). */\nconst AVATARS = {\n  king: { name: 'The Challenger', emblem: 'K', frame: 'wood', desc: 'Every player’s first portrait.' },\n  knight: { name: 'Knight Errant', emblem: 'N', frame: 'silver', desc: 'A silver-framed knight, always on the move.' },\n  bomber: { name: 'The Mad Bomber', emblem: 'bomber', frame: 'silver', desc: 'For players who like things loud.' },\n  phantom: { name: 'Phantom of the Board', emblem: 'phantom', frame: 'gold', desc: 'A gold frame and a ghost that walks through walls.' },\n  vampire: { name: 'Count of the Night', emblem: 'vampire', frame: 'gold', desc: 'Gold frame, red eyes, no mercy.' },\n  archangel: { name: 'Holy Terror', emblem: 'archangel', frame: 'gold', desc: 'The Archangel in a gilded frame.' },\n  dragon: { name: 'Dragonlord', emblem: 'dragon', frame: 'prism', desc: 'An animated prismatic frame around the Elder Dragon.' },\n  zeus: { name: 'Storm Caller', emblem: 'zeus', frame: 'prism', desc: 'The Storm King in a crackling prismatic frame.' },\n  crown: { name: 'SirSC Royalty', emblem: 'K', frame: 'diamond', desc: 'The diamond frame and crown of a SirSC Member.' },\n};\nfunction avatarHTML(id, color) {\n  const a = AVATARS[id] || AVATARS.king;\n  return `<div class=\"avatar av-${a.frame}\">${pieceSVG(a.emblem, color || 'w')}${a.frame === 'diamond' ? '\u003cspan class=\"av-crown\" aria-hidden=\"true\">♛\u003c/span>' : ''}\u003c/div>`;\n}\n\nconst COSMETIC_KINDS = { board: BOARD_THEMES, pieces: PIECE_SETS, back: CARD_BACKS, capture: CAPTURE_FX, finale: FINALES, avatar: AVATARS };\nconst DEFAULT_LOOK = { board: 'walnut', pieces: 'classic', back: 'classic', capture: 'splinters', finale: 'classic', avatar: 'king' };\nconst cosmeticOf = item => { const [k, id] = String(item).split(':'); return COSMETIC_KINDS[k] && COSMETIC_KINDS[k][id] ? { kind: k, id, ...COSMETIC_KINDS[k][id] } : null; };\n\n/* ---------- painting a board theme ---------- */\nfunction paintBoard(c, S, themeId, seed, dpr) {\n  const th = BOARD_THEMES[themeId] || BOARD_THEMES.walnut, s = S / 8, rnd = mulberry32(seed || 11), px = s / 90;\n  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {\n    const light = (x + y) % 2 === 0, base = light ? th.light : th.dark, v = (rnd() - 0.5) * 14;\n    const x0 = x * s, y0 = y * s;\n    c.save();\n    c.beginPath(); c.rect(x0, y0, s, s); c.clip();\n    c.fillStyle = `rgb(${base[0] + v},${base[1] + v * 0.9},${base[2] + v * 0.7})`;\n    c.fillRect(x0, y0, s, s);\n    c.translate(x0, y0);\n    (SQUARE_PAINTERS[th.style] || SQUARE_PAINTERS.wood)(c, s, light, rnd, th, px);\n    c.restore();\n  }\n}\nconst SQUARE_PAINTERS = {\n  wood(c, s, light, rnd, th, px) {\n    const grain = th.grain || ['120,72,30', '70,38,14'];\n    if (rnd() >= 0.72) { c.translate(s / 2, s / 2); c.rotate(Math.PI / 2); c.translate(-s / 2, -s / 2); }\n    for (let i = 0; i < 5; i++) {\n      c.fillStyle = rnd() < 0.5 ? `rgba(110,60,20,${0.03 + rnd() * 0.05})` : `rgba(255,240,205,${0.03 + rnd() * 0.05})`;\n      c.fillRect(rnd() * s, 0, s * (0.08 + rnd() * 0.22), s);\n    }\n    const lines = 22 + Math.f r SirSC.',\n    sirsc_bad_request: 'Diamonds come in fives, from 5 to 500.',\n  };\n  const errText = e => ERRORS[e && e.code] || 'Something went wrong. Try again in a moment.';\n  const available = () => Account.status !== 'unavailable' && Account.status !== 'checking';\n  const badge = () => (Wallet.member ? SIRSC_BADGE_SVG : '');\n\n  /* ---------- the chip on the menu ---------- */\n  function renderChip() {\n    const chip = q('#acctChip');\n    if (!chip) return;\n    chip.hidden = !available();\n    if (Account.status === 'signedIn') {\n      chip.innerHTML = `<button type=\"button\" class=\"acct-in\" data-shop=\"open\">\u003cspan class=\"acct-name\">${esc(Account.user.username)}${badge()}\u003c/span>\n        \u003cspan class=\"acct-bal\">${Wallet.me ? `\u003cspan>🪙 ${fmt(Wallet.coins)}\u003c/span>\u003cspan>💎 ${fmt(Wallet.diamonds)}\u003c/span>` : '\u003cspan>Loading wallet…\u003c/span>'}\u003c/span>${window.WCC_DEMO ? '\u003cspan class=\"acct-demo\">Demo wallet, pretend coins\u003c/span>' : ''}\u003c/button>`;\n    } else if (Account.status === 'restricted') {\n      chip.innerHTML = '\u003cspan class=\"acct-in acct-banned\">Account restricted on Warden Chat\u003c/span>';\n    } else chip.innerHTML = '<button type=\"button\" class=\"btn small acct-signin\" data-shop=\"signin\">\u003cspan>Sign in\u003c/span>\u003c/button>';\n    const sc = q('#shopCount');\n    if (sc) sc.textContent = Account.status === 'signedIn' && Wallet.me ? `🪙 ${fmt(Wallet.coins)}` : 'Boards & more';\n  }\n\n  /* ---------- signing in ---------- */\n  function openSignIn() {\n    q('#siErr').textContent = '';\n    q('#signin').hidden = false;\n    setTimeout(() => q('#siUser').focus(), 30);\n  }\n  function closeSignIn() { q('#signin').hidden = true; }\n  function submit(create) {\n    const user = q('#siUser').value.trim(), pass = q('#siPass').value, R = Account.RULES;\n    if (user.length < R.nameMin || user.length > R.nameMax || !R.nameRe.test(user)) { q('#siErr').textContent = ERRORS.signup_rejected; return; }\n    if (create && pass.length < R.passwordMin) { q('#siErr').textContent = ERRORS.weak_password; return; }\n    q('#siErr').textContent = create ? 'Creating your account…' : 'Signing in…';\n    (create ? Account.signUp(user, pass) : Account.signIn(user, pass)).then(() => {\n      q('#siPass').value = '';\n      closeSignIn();\n      toast(`${pieceSVG('K', 'w')}\u003cspan>Signed in as ${esc(user)}\u003c/span>`, 'var(--gold)');\n    }, e => { q('#siErr').textContent = errText(e); });\n  }\n\n  /* ---------- the shop screen ---------- */\n  function items(kind) {\n    const free = DEFAULT_LOOK[kind];\n    return [kind + ':' + free].concat(WCC_CATALOG.filter(c => c.item_id.startsWith(kind + ':')).map(c => c.item_id));\n  }\n  function swatch(item) {\n    const c = cosmeticOf(item);\n    if (c.kind === 'board') return `<canvas class=\"sw-board\" data-theme=\"${c.id}\" width=\"128\" height=\"128\">\u003c/canvas>`;\n    if (c.kind === 'back') return `<div class=\"sw-back\" style=\"--a:${c.a};--b:${c.b};--ink:${c.ink};--bd:${c.border}\">\u003cspan>W\u003c/span>\u003c/div>`;\n    if (c.kind === 'pieces') return `<div class=\"sw-pieces\">\u003cspan>${pieceSVG('Q', 'w', c.id)}\u003c/span>\u003cspan>${pieceSVG('K', 'b', c.id)}\u003c/span>\u003c/div>`;\n    if (c.kind === 'capture') return `<div class=\"sw-capture\" style=\"--c1:${c.colors[0]};--c2:${c.colors[1]};--c3:${c.colors[2] || c.colors[0]}\"><i>\u003c/i><i>\u003c/i><i>\u003c/i><i>\u003c/i><i>\u003c/i><i>\u003c/i>${pieceSVG('P', 'b')}\u003c/div>`;\n    if (c.kind === 'avatar') return `<div class=\"sw-avatar\">${avatarHTML(c.id, 'w')}\u003c/div>`;\n    return `<div class=\"sw-finale\" style=\"--c1:${c.colors[0]};--c2:${c.colors[1]};--c3:${c.colors[2] || c.colors[0]}\">${pieceSVG('K', 'w')}\u003c/div>`;\n  }\n  function stateOf(item) {\n    const c = cosmeticOf(item), price = Wallet.price(item), look = Look.current();\n    const isFree = item.endsWith(':' + DEFAULT_LOOK[c.kind]);\n    const o
