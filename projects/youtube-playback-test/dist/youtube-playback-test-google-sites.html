e: 12px; }\n  .grow { flex: 1; }\n  .btn {\n    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px;\n    border: 1px solid var(--line-2); background: var(--bg-3); font-weight: 700; font-size: 12.5px; white-space: nowrap;\n  }\n  .btn:hover:not(:disabled) { background: #2a313b; }\n  .btn.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }\n  .btn.accent:hover:not(:disabled) { background: #4fe0f5; }\n  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; }\n\n  .banner { margin: 10px 14px 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; }\n  .banner.bad { background: rgb(248 113 113 / 0.12); border: 1px solid rgb(248 113 113 / 0.35); color: #fecaca; }\n  .banner.warn { background: rgb(251 191 36 / 0.1); border: 1px solid rgb(251 191 36 / 0.3); color: #fde68a; }\n\n  .layout {\n    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px;\n    padding: 12px 14px 20px; align-items: start;\n  }\n  .player-col { display: grid; gap: 8px; width: var(--pw, 320px); position: sticky; top: 12px; }\n  .stage {\n    position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden;\n    background: #000; box-shadow: 0 0 0 1px var(--line);\n  }\n  .stage > div, .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }\n  .stage.gesture iframe { pointer-events: none; }\n  .stage-msg {\n    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: none;\n    padding: 10px 12px; border-radius: 10px; background: rgb(10 12 15 / 0.92); border: 1px solid var(--line-2);\n    font-size: 13px;\n  }\n  .stage-msg.show { display: grid; gap: 8px; }\n  .stage-msg .row { display: flex; gap: 6px; flex-wrap: wrap; }\n  .controls { display: flex; align-items: center; gap: 6px; }\n  .icon {\n    display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;\n    border: 1px solid var(--line-2); background: var(--bg-2); font-size: 15px; flex: none;\n  }\n  .icon:hover:not(:disabled) { background: var(--bg-3); }\n  .icon.play { width: 44px; height: 44px; background: var(--accent); color: var(--accent-ink); border-color: transparent; font-size: 17px; }\n  .time { font: 700 12px var(--mono); color: var(--text-2); min-width: 92px; text-align: center; }\n  .progress { position: relative; flex: 1; height: 26px; cursor: pointer; display: flex; align-items: center; }\n  .progress .rail { position: relative; flex: 1; height: 5px; border-radius: 5px; background: var(--bg-3); overflow: hidden; }\n  .progress .loaded, .progress .played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }\n  .progress .loaded { background: rgb(255 255 255 / 0.18); }\n  .progress .played { background: var(--accent); }\n  .nowline { display: grid; gap: 2px; font-size: 12px; color: var(--text-2); }\n  .nowline b { color: var(--text); font-size: 13px; }\n  .hint { font-size: 12px; color: var(--text-3); }\n  .hint.focus { color: var(--warn); }\n\n  .dash { display: grid; gap: 12px; min-width: 0; }\n  .card { border-radius: 14px; background: var(--bg-1); border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }\n  .card h2 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }\n  .card h2 .grow + * { text-transform: none; letter-spacing: 0; }\n  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }\n  .tile { padding: 8px 10px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }\n  .tile .k { font-size: 11px; color: var(--text-3); font-weight: 700; }\n  .tile .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .tile .s { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .v.ok { color: var(--ok); } .v.bad { color: var(--bad); } .v.warn { color: var(--warn); }\n  .note { margin: 8px 0 0; font-size: 12px; color: var(--text-3); }\n  .table-wrap { overflow-x: auto; max-height: 320px; overflow-y: auto; }\n  table { width: 100%; border-collapse: collapse; font-size: 12px; }\n  th, td { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }\n  th { position: sticky; top: 0; background: var(--bg-1); color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }\n  td.num { text-align: right; font-variant-numeric: tabular-nums; }\n  td.lbl { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }\n  td.wrap { white-space: normal; min-width: 220px; }\n  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 800; }\n  .pill.ok { background: rgb(52 211 153 / 0.15); color: var(--ok); }\n  .pill.bad { background: rgb(248 113 113 / 0.15); color: var(--bad); }\n  .pill.warn { background: rgb(251 191 36 / 0.15); color: var(--warn); }\n  .pill.dim { background: var(--bg-3); color: var(--text-2); }\n  .log { max-height: 220px; overflow-y: auto; font: 11.5px/1.5 var(--mono); color: var(--text-2); margin: 0; padding: 0; list-style: none; }\n  .log li { white-space: pre-wrap; word-break: break-word; }\n  .log .t { color: var(--text-3); }\n  textarea {\n    width: 100%; min-height: 170px; resize: vertical; padding: 8px 10px; border-radius: 10px;\n    background: var(--bg-2); border: 1px solid var(--line-2); font: 12px/1.5 var(--mono);\n  }\n  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; margin-top: 10px; }\n  .opts label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }\n  .opts label b { color: var(--t nd other embeds)\" aria-expanded=\"false\">Show JSON\u003c/button>\n  <button class=\"btn accent\" id=\"btnExport\" type=\"button\">Export results\u003c/button>\n\u003c/header>\n<div class=\"banner bad\" id=\"bannerOrigin\" hidden>\u003c/div>\n<div class=\"banner bad\" id=\"bannerApi\" hidden>\u003c/div>\n<div class=\"card json-card\" id=\"jsonCard\" hidden>\n  <h2>Results JSON \u003cspan class=\"grow\">\u003c/span><button class=\"btn small\" id=\"btnSelectJson\" type=\"button\">Select all\u003c/button><button class=\"btn small\" id=\"btnCloseJson\" type=\"button\">Close\u003c/button>\u003c/h2>\n  <p class=\"note\" style=\"margin: 0 0 8px\">Select everything in the box and copy it (Ctrl+C). Useful when the page sits inside a Google Site or another embed, where downloads are often blocked.\u003c/p>\n  <textarea id=\"jsonOut\" readonly spellcheck=\"false\" aria-label=\"Results JSON\">\u003c/textarea>\n\u003c/div>\n\n<main class=\"layout\">\n  \u003csection class=\"player-col\" aria-label=\"Player\">\n    <div class=\"stage\" id=\"stage\">\n      <div id=\"yt\">\u003c/div>\n      <div class=\"stage-msg\" id=\"stageMsg\" role=\"status\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n    <div class=\"controls\">\n      <button class=\"icon\" id=\"btnPrev\" type=\"button\" aria-label=\"Previous video (Up arrow or K)\" title=\"Previous (↑ / K)\">▲\u003c/button>\n      <button class=\"icon play\" id=\"btnPlay\" type=\"button\" aria-label=\"Play or pause (Space)\" title=\"Play / pause (Space)\">▶\u003c/button>\n      <button class=\"icon\" id=\"btnNext\" type=\"button\" aria-label=\"Next video (Down arrow or J)\" title=\"Next (↓ / J)\">▼\u003c/button>\n      <button class=\"icon\" id=\"btnMute\" type=\"button\" aria-label=\"Mute or unmute (M)\" title=\"Mute / unmute (M)\">🔇\u003c/button>\n      \u003cspan class=\"time\" id=\"time\">0:00 / 0:00\u003c/span>\n    \u003c/div>\n    <div class=\"progress\" id=\"progress\" role=\"slider\" aria-label=\"Seek\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\" tabindex=\"0\">\n      <div class=\"rail\"><div class=\"loaded\" id=\"loadedBar\">\u003c/div><div class=\"played\" id=\"playedBar\">\u003c/div>\u003c/div>\n    \u003c/div>\n    <div class=\"nowline\">\n      <b id=\"nowTitle\">—\u003c/b>\n      \u003cspan id=\"nowSub\">Video 0 of 0\u003c/span>\n    \u003c/div>\n    <p class=\"hint\" id=\"hint\">Scroll, use ↑ ↓ / J K, or the buttons to change videos.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"dash\">\n    <div class=\"card\">\n      <h2>Live measurements \u003cspan class=\"grow\">\u003c/span>\u003cspan class=\"pill dim\" id=\"pillState\">no player\u003c/span>\u003c/h2>\n      <div class=\"tiles\">\n        <div class=\"tile\"><div class=\"k\">Current video ID\u003c/div><div class=\"v mono\" id=\"mId\">—\u003c/div><div class=\"s\" id=\"mLabel\">&nbsp;\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Player state\u003c/div><div class=\"v\" id=\"mState\">—\u003c/div><div class=\"s\" id=\"mStateCode\">&nbsp;\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Request → PLAYING (this video)\u003c/div><div class=\"v\" id=\"mReqPlay\">—\u003c/div><div class=\"s\" id=\"mReqFirst\">first event: —\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Time in BUFFERING (this video)\u003c/div><div class=\"v\" id=\"mBuf\">—\u003c/div><div class=\"s\" id=\"mRebuf\">rebuffers after start: 0\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Average switch time\u003c/div><div class=\"v\" id=\"mAvg\">—\u003c/div><div class=\"s\" id=\"mAvgSub\">median — · p90 —\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Successful loads\u003c/div><div class=\"v ok\" id=\"mOk\">0\u003c/div><div class=\"s\" id=\"mOkSub\">reached PLAYING\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Failed loads\u003c/div><div class=\"v bad\" id=\"mFail\">0\u003c/div><div class=\"s\" id=\"mFailSub\">onError events\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Autoplay blocked\u003c/div><div class=\"v warn\" id=\"mAuto\">0\u003c/div><div class=\"s\" id=\"mAutoSub\">onAutoplayBlocked events\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">No-start timeouts\u003c/div><div class=\"v warn\" id=\"mTimeout\">0\u003c/div><div class=\"s\" id=\"mTimeoutSub\">no PLAYING, no error\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Position\u003c/div><div class=\"v\" id=\"mPos\">—\u003c/div><div class=\"s\" id=\"mLoaded\">loaded fraction —\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Player ready\u003c/div><div class=\"v\" id=\"mReady\">—\u003c/div><div class=\"s\" id=\"mApi\">API script —\u003c/div>\u003c/div>\n        <div class=\"tile\"><div class=\"k\">Error codes seen\u003c/div><div class=\"v mono\" id=\"mCodes\">none\u003c/div><div class=\"s\">see table below\u003c/div>\u003c/div>\n      \u003c/div>\n      <p class=\"note\">\n        Timings are measured in this page with <code>performance.now()\u003c/code>. <b>Request → PLAYING\u003c/b> runs from this page's\n        <code>loadVideoById()\u003c/code> call to the moment the player <i>reports\u003c/i> state PLAYING through the IFrame API, so it includes\n        the player's own loading and the message hop back to this page. The API does not expose first-frame time, network\n        requests, bitrate or dropped frames, so none are claimed here. <b>Buffering\u003c/b> is the time between BUFFERING and the next\n        state the player reports. <b>Average switch time\u003c/b> covers every video after the first that started without a manual press.\n      \u003c/p>\n    \u003c/div>\n\n    <div class=\"card\">\n        <h2>Loads \u003cspan class=\"grow\">\u003c/span>\u003cspan class=\"pill dim\" id=\"pillLoads\">0\u003c/span>\u003c/h2>\n        <div class=\"table-wrap\">\n          <table>\n            <thead><tr><th>#\u003c/th><th>Video ID\u003c/th><th>Your label\u003c/th><th>Outcome\u003c/th><th class=\"num\">→ first event\u003c/th><th class=\"num\">→ PLAYING\u003c/th><th class=\"num\">Buffering\u003c/th><th>Error\u003c/th>\u003c/tr>\u003c/thead>\n            <tbody id=\"loadRows\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n    \u003c/div>\n\n    <div class=\"two\">\n      <div class=\"card\">\n        <h2>Errors\u003c/h2>\n        <div class=\"table-wrap\" style=\"max-height: 150px\">\n          <table>\n            <thead><tr><th>Code\u003c/th><th class=\"num\">Count\u003c/th><th>Meaning (IFrame API)\u003c/th>\u003c/tr>\u003c/thead>\n            <tbody id=\"errRows\"><tr><td colspan=\"3\" class=\"hint\">No errors yet.\u003c/td>\u003c/tr>\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n      <div class=\"card\">\n        <h2>Cue check \u003cspan class=\"grow\">\u003c/span>\u003cspan class=\"pill dim\" id=\"pillPre\">not run\u003c/span>\u003c/h2>\n        <div class=\"table-wrap\" style=\"max-height: 170px\">\n          <table>\n            <thead><tr><th>Video ID\u003c/th><th>Your label\u003c/th><th>Result\u003c/th><th class=\"num\">→ CUED\u003c/th>\u003c/tr>\u003c/thead>\n            <tbody id=\"preRows\"><tr><td colspan=\"4\" class=\"hint\">Press “Check list” to cue every video once (no playback).\u003c/td>\u003c/tr>\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    <div class=\"card\">\n      <h2>Videos to test\u003c/h2>\n      <p class=\"note\" style=\"margin: 0 0 8px\">\n        Paste YouTube links or 11-character IDs, one per line. Anything after <code>#\u003c/code> is your label (for example\n        <code># works on youtube.com\u003c/code> or <code># blocked at school\u003c/code>), and is carried into the results so you can compare\n        expected and actual behaviour. Watch, <code>youtu.be\u003c/code>, <code>/shorts/\u003c/code>, <code>/embed/\u003c/code> and <code>/live/\u003c/code> links all work.\n        Shorts links give a true vertical test; regular videos are shown letterboxed in the 9:16 player.\n      \u003c/p>\n      <textarea id=\"listInput\" spellcheck=\"false\" aria-label=\"Videos to test\">\u003c/textarea>\n      <div class=\"row\" style=\"margin-top: 8px\">\n        <button class=\"btn accent small\" id=\"btnApply\" type=\"button\">Use this list\u003c/button>\n        <button class=\"btn small\" id=\"btnDefaults\" type=\"button\">Restore default list\u003c/button>\n        <button class=\"btn small\" id=\"btnErrTest\" type=\"button\" title=\"Loads the text “not a video id”, which can never be a YouTube ID, to check error handling\">Error-handling test\u003c/button>\n        \u003cspan class=\"hint\" id=\"listStatus\">\u003c/span>\n      \u003c/div>\n      <div class=\"opts\">\n        <label><input type=\"checkbox\" id=\"optMuted\"> \u003cspan><b>Start muted\u003c/b> (muted autoplay is allowed by browsers)\u003c/span>\u003c/label>\n        <label><input type=\"checkbox\" id=\"optAutoplay\"> \u003cspan><b>Autoplay on switch\u003c/b> (<code>loadVideoById\u003c/code>; off = <code>cueVideoById\u003c/code>)\u003c/span>\u003c/label>\n        <label><input type=\"checkbox\" id=\"optControls\"> \u003cspan><b>YouTube’s own controls\u003c/b> (changing this rebuilds the player once)\u003c/span>\u003c/label>\n        <label><input type=\"checkbox\" id=\"optGesture\"> \u003cspan><b>Gesture layer\u003c/b> (experimental, see note)\u003c/span>\u003c/label>\n        <label>\u003cspan><b>On end\u003c/b>\u003c/span>\n          \u003cselect id=\"optEnd\"><option value=\"next\">next video\u003c/option><option value=\"loop\">replay\u003c/option><option value=\"stop\">stop\u003c/option>\u003c/select>\u003c/label>\n        <label>\u003cspan><b>On error\u003c/b>\u003c/span>\n          \u003cselect id=\"optErr\"><option value=\"wait\">show message, wait\u003c/option><option value=\"skip\">skip after 2 s\u003c/option>\u003c/select>\u003c/label>\n        <label>\u003cspan><b>No-start timeout\u003c/b>\u003c/span> <input type=\"number\" id=\"optTimeout\" min=\"3\" max=\"60\" step=\"1\"> s\u003c/label>\n      \u003c/div>\n      <p class=\"note\">\n        <b>About scrolling over the video:\u003c/b> the player is a YouTube iframe, and the browser sends scroll, clicks and keys that\n        happen over it to YouTube, not to this page. By default, scroll anywhere outside the picture (on the controls, beside it, or\n        on this panel’s margin) and use the keyboard while focus is on this page. The <b>gesture layer\u003c/b> option lets scroll,\n        swipes and clicks over the picture reach this page instead, so YouTube’s on-video controls stop responding. It exists only\n        to measure that experience; check YouTube’s embedded-player policies before using that pattern in SirSC Scroll.\n      \u003c/p>\n    \u003c/div>\n\n    <div class=\"two\">\n      <div class=\"card\">\n        <h2>Event log \u003cspan class=\"grow\">\u003c/span><button class=\"btn small\" id=\"btnClearLog\" type=\"button\">Clear\u003c/button>\u003c/h2>\n        <ul class=\"log\" id=\"log\">\u003c/ul>\n      \u003c/div>\n      <div class=\"card\">\n        <h2>Environment\u003c/h2>\n        <dl class=\"env\" id=\"env\">\u003c/dl>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n<div class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript>\n(function () {\n  'use strict';\n\n  /* ------------------------------------------------------------------ defaults */\n\n  // Widely published public videos. They were NOT checked from the machine that built this page\n  // (YouTube was blocked there). Press \"Check list\" on the device under test: the player itself\n  // confirms each one. Replace or extend freely; never rely on these being available everywhere.\n  var DEFAULT_LINES = [\n    '# Default sample: well-known public videos (landscape). Verify with “Check list”.',\n    'M7lc1UVf-VE  # YouTube Developers: the IFrame API documentation sample video',\n    'jNQXAC9IVRw  # “Me at the zoo”, the first video on YouTube',\n    'aqz-KE-bpKQ  # Big Buck Bunny 60fps 4K, Blender Foundation',\n    'eRsGyueVLvQ  # Sintel, Blender Foundation',\n    'R6MlUcmOul8  # Tears of Steel, Blender Foundation',\n    'dQw4w9WgXcQ  # Rick Astley, Never Gonna Give You Up',\n    '9bZkp7q19f0  # PSY, Gangnam Style',\n    'kJQP7kiw5Fk  # Luis Fonsi, Despacito',\n    'OPf0YbXqDm0  # Mark Ronson ft. Bruno Mars, Uptown Funk',\n    'fJ9rUzIMcZQ  # Queen, Bohemian Rhapsody',\n    'hT_nvWreIhg  # OneRepublic, Counting Stars',\n    'JGwWNGJdvx8  # Ed Sheeran, Shape of You',\n    '# Add youtube.com/shorts/... links here for a true vertical test.'\n  ];\n  // A video the tester reported as blocked at school, second in the list so it comes up straight away.\n  var BLOCKED_EXAMPLE = '_N2CPJS-mHw  # Blocked at school (your example)';\n  var DEFAULT_LIST = DEFAULT_LINES.slice(0, 2).concat(BLOCKED_EXAMPLE, DEFAULT_LINES.slice(2)).join('\\n');\n  // The default before that video was added. A saved list that is still exactly this was never edited,\n  // so it is replaced by the current default instead of hiding the new video.\n  var PREVIOUS_DEFAULT_LIST = DEFAULT_LINES.join('\\n');\n\n  var ERROR_TEXT = {\n    2: 'Invalid parameter (for example, not an 11-character video ID).',\n    5: 'HTML5 player error: the content can’t be played in an HTML5 player.',\n    100: 'Video not found: removed or marked private.',\n    101: 'The owner does not allow playback in embedded players.',\n    150: 'The owner does not allow playback in embedded players (same as 101).',\n    153: 'Player configuration error, reported when the embed request carries no Referer / client identification. Host the page over https, not file://.'\n  };\n  var STATE_NAME = { '-1': 'UNSTARTED', 0: 'ENDED', 1: 'PLAYING', 2: 'PAUSED', 3: 'BUFFERING', 5: 'CUED' };\n  var STORE = 'sirsc-yt-playback-test:v1';\n  // Deliberately malformed (spaces are never valid in a YouTube ID), so the player should answer with error 2.\n  var ERROR_TEST_ID = 'not a video id';\n\n  /* ------------------------------------------------------------------ state */\n\n  var T0 = performance.now();\n  var startedAt = new Date().toISOString();\n  var settings = { startMuted: true, autoplay: true, controls: false, gesture: false, onEnd: 'next', onError: 'wait', timeoutSec: 12 };\n  var listText = DEFAULT_LIST;\n  var list = [];\n  var index = 0;\n  var player = null;\n  var playerReady = false;\n  var apiReadyAt = null;\n  var playerReadyAt = null;\n  var apiFailed = false;\n  var loads = [];\n  var current = null;\n  var events = [];\n  var errorCounts = {};\n  var autoplayBlocked = 0;\n  var preflight = [];\n  var preflightRunning = null;\n  var pollTimer = 0;\n  var lastState = null;\n  var focusInPlayer = false;\n\n  function $(id) { return document.getElementById(id); }\n  function now() { return performance.now(); }\n  function ms(v) { return v == null ? '—' : v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(2) + ' s'; }\n  function clock(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }\n  function esc(s) { return String(s == null ? '' : s).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n\n  function load() {\n    try {\n      var saved = JSON.parse(localStorage.getItem(STORE) || 'null');\n      if (saved) {\n        if (saved.settings) Object.keys(settings).forEach(function (k) { if (k in saved.settings) settings[k] = saved.settings[k]; });\n        if (typeof saved.listText === 'string' && saved.listText.trim() && saved.listText !== PREVIOUS_DEFAULT_LIST) listText = saved.listText;\n      }\n    } catch (e) { /* storage blocked: defaults */ }\n  }\n  function save() {\n    try { localStorage.setItem(STORE, JSON.stringify({ settings: settings, listText: listText })); } catch (e) { /* ignore */ }\n  }\n\n  /* ------------------------------------------------------------------ list parsing */\n\n  function parseList(text) {\n    var items = [];\n    var rejected = [];\n    text.split(/\\r?\\n/).forEach(function (raw) {\n      var line = raw.trim();\n      if (!line || line.charAt(0) === '#') return;\n      var hash = line.indexOf('#');\n      var label = hash >= 0 ? line.slice(hash + 1).trim() : '';\n      var src = (hash >= 0 ? line.slice(0, hash) : line).trim();\n      var m = src.match(/(?:[?&]v=|\\/shorts\\/|youtu\\.be\\/|\\/embed\\/|\\/live\\/|\\/v\\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/);\n      var id = m ? m[1] : /^[A-Za-z0-9_-]{11}$/.test(src) ? src : null;\n      if (id) items.push({ id: id, label: label, shorts: /\\/shorts\\//.test(src) });\n      else rejected.push(src);\n    });\n    return { items: items, rejected: rejected };\n  }\n\n  function applyList(text, quiet) {\n    var r = parseList(text);\n    if (!r.items.length) {\n      $('listStatus').textContent = 'No video IDs found. Paste YouTube links or 11-character IDs.';\n      return false;\n    }\n    listText = text;\n    list = r.items;\n    index = 0;\n    save();\n    $('listStatus').textContent = r.items.length + ' videos' + (r.rejected.length ? ' · ignored ' + r.rejected.length + ' line(s) that are not YouTube links: ' + r.rejected.slice(0, 3).join(', ') : '');\n    if (!quiet) log('list', 'Using ' + r.items.length + ' videos' + (r.rejected.length ? ', ignored ' + r.rejected.length : ''));\n    return true;\n  }\n\n  /* ------------------------------------------------------------------ logging */\n\n  function log(kind, text) {\n    var t = now() - T0;\n    events.push({ t: Math.round(t), kind: kind, text: text });\n    if (events.length > 600) events.shift();\n    var li = document.createElement('li');\n    li.innerHTML = '\u003cspan class=\"t\">' + (t / 1000).toFixed(2).padStart(7, ' ') + 's\u003c/span> ' + esc(kind) + ' · ' + esc(text);\n    var ul = $('log');\n    ul.appendChild(li);\n    while (ul.children.length > 200) ul.removeChild(ul.firstChild);\n    ul.scrollTop = ul.scrollHeight;\n  }\n\n  var toastTimer = 0;\n  function toast(text) {\n    var el = $('toast');\n    el.textContent = text;\n    el.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);\n  }\n\n  function message(html) {\n    var el = $('stageMsg');\n    if (!html) { el.classList.remove('show'); el.innerHTML = ''; return; }\n    el.innerHTML = html;\n    el.classList.add('show');\n  }\n\n  /* ------------------------------------------------------------------ the player */\n\n  function playerVars() {\n    var v = {\n      autoplay: settings.autoplay ? 1 : 0,\n      mute: settings.startMuted ? 1 : 0,\n      playsinline: 1,\n      rel: 0,\n      controls: settings.controls ? 1 : 0,\n      enablejsapi: 1\n    };\n    var o = pageOrigin();\n    if (o) v.origin = o;\n    return v;\n  }\n\n  // The page's real https origin. Normally location.origin; in a tab written by the Google Sites\n  // launcher (about:blank + document.write) the document keeps the launcher's origin even if the\n  // URL reads about:blank, which self.origin reports.\n  function pageOrigin() {\n    if (/^https?:$/.test(location.protocol)) return location.origin;\n    var so = typeof self !== 'undefined' && self.origin;\n    return so && /^https?:\\/\\//.test(so) ? so : null;\n  }\n  function openedByLauncher() {\n    try { return !!window.opener && window.opener !== window; } catch (e) { return true; }\n  }\n\n  function createPlayer() {\n    var first = list[index];\n    playerReady = false;\n    var t = now();\n    current = newLoad(first, 'player start', t);\n    log('player', 'Creating player with ' + first.id + ' (' + (settings.controls ? 'YouTube controls' : 'no YouTube controls') + ')');\n    player = new YT.Player('yt', {\n      width: '100%',\n      height: '100%',\n      videoId: first.id,\n      playerVars: playerVars(),\n      events: {\n        onReady: onReady,\n        onStateChange: onStateChange,\n        onError: onError,\n        onAutoplayBlocked: onAutoplayBlocked\n      }\n    });\n    applyGesture();\n  }\n\n  function rebuildPlayer() {\n    if (!window.YT || !YT.Player) return;\n    stopPoll();\n    finishLoad('left before playing');\n    try { player && player.destroy(); } catch (e) { /* ignore */ }\n    var host = document.createElement('div');\n    host.id = 'yt';\n    var old = $('yt');\n    if (old) old.replaceWith(host); else $('stage').prepend(host);\n    createPlayer();\n  }\n\n  function onReady() {\n    playerReady = true;\n    playerReadyAt = now();\n    $('mReady').textContent = ms(playerReadyAt - T0);\n    log('ready', 'Player ready ' + ms(playerReadyAt - T0) + ' after page start');\n    syncMute();\n    if (current && current.reason === 'player start') armTimeout(current);\n    render();\n  }\n\n  function newLoad(item, reason, t) {\n    var rec = {\n      n: loads.length + 1,\n      id: item.id,\n      label: item.label || '',\n      reason: reason,\n      requestedAt: t,\n      firstEventMs: null,\n      playingMs: null,\n      bufferingMs: 0,\n      bufferingSince: null,\n      rebuffers: 0,\n      manualStart: false,\n      autoplayBlocked: false,\n      error: null,\n      outcome: 'pending',\n      states: []\n    };\n    loads.push(rec);\n    return rec;\n  }\n\n  function armTimeout(rec) {\n    clearTimeout(rec.timer);\n    rec.timer = setTimeout(function () {\n      if (rec.outcome === 'pending' && current === rec) {\n        rec.outcome = rec.autoplayBlocked ? 'autoplay blocked' : settings.autoplay ? 'no start' : 'cued';\n        if (settings.autoplay) {\n          log('timeout', rec.id + ': no PLAYING within ' + settings.timeoutSec + ' s' + (rec.autoplayBlocked ? ' (autoplay was blocked)' : ''));\n          if (!rec.autoplayBlocked) message('<b>Video didn’t start within ' + settings.timeoutSec + ' s.\u003c/b>\u003cspan class=\"hint\">No error was reported. Press play, or skip.\u003c/span><div class=\"row\"><button class=\"btn small accent\" data-act=\"play\" type=\"button\">Play\u003c/button><button class=\"btn small\" data-act=\"next\" type=\"button\">Skip\u003c/button>\u003c/div>');\n        }\n        render();\n      }\n    }, settings.timeoutSec * 1000);\n  }\n\n  function finishLoad(outcome) {\n    if (!current) return;\n    closeBuffering(current, now());\n    clearTimeout(current.timer);\n    if (current.outcome === 'pending') current.outcome = outcome;\n  }\n\n  function closeBuffering(rec, t) {\n    if (rec.bufferingSince != null) {\n      rec.bufferingMs += t - rec.bufferingSince;\n      rec.bufferingSince = null;\n    }\n  }\n\n  function go(delta, reason) {\n    if (!list.length) return;\n    var next = (index + delta + list.length) % list.length;\n    loadIndex(next, reason || (delta > 0 ? 'next' : 'previous'));\n  }\n\n  function loadIndex(i, reason) {\n    if (!player || !playerReady) { index = i; render(); return; }\n    finishLoad('left before playing');\n    index = i;\n    message('');\n    var item = list[i];\n    var t = now();\n    current = newLoad(item, reason, t);\n    try {\n      if (settings.autoplay) player.loadVideoById(item.id);\n      else player.cueVideoById(item.id);\n    } catch (e) {\n      log('exception', String(e));\n    }\n    log('request', (settings.autoplay ? 'loadVideoById' : 'cueVideoById') + '(' + item.id + ') · ' + reason);\n    armTimeout(current);\n    render();\n  }\n\n  function loadArbitrary(id, label) {\n    if (!player || !playerReady) return;\n    finishLoad('left before playing');\n    message('');\n    current = newLoad({ id: id, label: label }, 'error test', now());\n    try { player.loadVideoById(id); } catch (e) { log('exception', String(e)); }\n    log('request', 'loadVideoById(' + id + ') · error-handling test');\n    armTimeout(current);\n    render();\n  }\n\n  function onStateChange(e) {\n    var t = now();\n    var s = e.data;\n    lastState = s;\n    // A cue check in progress gets the events first.\n    if (preflightRunning && preflightRunning.onState(s, t)) return;\n    var rec = current;\n    if (rec) {\n      if (rec.firstEventMs == null) rec.firstEventMs = t - rec.requestedAt;\n      rec.states.push([Math.round(t - rec.requestedAt), s]);\n      if (s === 3) {\n        if (rec.bufferingSince == null) rec.bufferingSince = t;\n      } else {\n        closeBuffering(rec, t);\n      }\n      if (s === 1) {\n        if (rec.playingMs == null) {\n          rec.playingMs = t - rec.requestedAt;\n          rec.outcome = 'ok';\n          clearTimeout(rec.timer);\n          message('');\n          log('playing', rec.id + ' playing ' + ms(rec.playingMs) + ' after the request' + (rec.manualStart ? ' (started by a manual press)' : ''));\n        } else if (rec.sawBufferingAfterStart) {\n          rec.rebuffers++;\n          rec.sawBufferingAfterStart = false;\n        }\n        startPoll();\n      } else if (s === 3 && rec.playingMs != null) {\n        rec.sawBufferingAfterStart = true;\n      }\n    }\n    if (s !== 1) stopPoll();\n    if (s === 0) onEnded();\n    log('state', STATE_NAME[s] + ' (' + s + ')' + (rec ? ' · ' + rec.id + ' +' + ms(t - rec.requestedAt) : ''));\n    render();\n    tickPosition();\n  }\n\n  function onEnded() {\n    if (settings.onEnd === 'next') go(1, 'auto-advance after end');\n    else if (settings.onEnd === 'loop') { try { player.seekTo(0, true); player.playVideo(); } catch (e) { /* ignore */ } }\n  }\n\n  function onError(e) {\n    var code = e.data;\n    var t = now();\n    if (preflightRunning && preflightRunning.onError(code, t)) return;\n    errorCounts[code] = (errorCounts[code] || 0) + 1;\n    var rec = current;\n    if (rec) {\n      rec.error = code;\n      rec.outcome = 'error';\n      if (rec.firstEventMs == null) rec.firstEventMs = t - rec.requestedAt;\n      closeBuffering(rec, t);\n      clearTimeout(rec.timer);\n    }\n    stopPoll();\n    log('error', 'onError ' + code
