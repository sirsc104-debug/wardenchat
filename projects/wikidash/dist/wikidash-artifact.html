.sw-links a.wl { color: #1d3fd0; }
.sw-finale { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; font-size: 30px; position: relative; }
.sw-finale.fx-confetti { background: conic-gradient(#ffd23f 0 20%, #1d3fd0 0 40%, #e4472b 0 60%, #f3efe5 0 80%, #14130f 0); }
.sw-finale.fx-ink { background: radial-gradient(circle at 35% 40%, #14130f 0 22%, transparent 23%), radial-gradient(circle at 68% 62%, #1d3fd0 0 18%, transparent 19%), #f3efe5; }
.sw-finale.fx-planes { background: linear-gradient(160deg, #a8e4ff, #3a86c8); }
.sw-finale.fx-fireworks { background: radial-gradient(circle, #ffd23f 0 8%, #ff7a3c 9% 18%, transparent 19%), radial-gradient(circle at 30% 30%, #7fd8ff 0 6%, transparent 7%), #0b1a46; }
.sw-finale.fx-stars { background: radial-gradient(circle, #fff6c8, #f59e0b); }
.sw-finale.fx-supernova { background: radial-gradient(circle, #fff 0 10%, #ff6bd6 20%, #19f5e4 40%, #160d2e 70%); }
.sw-finale.fx-diamond { background: linear-gradient(135deg, #e9fbff, #7fd8ff, #3b82f6); }
.sw-spark { position: relative; width: 64px; height: 64px; }
.sw-spark i { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: var(--c1); }
.sw-spark i:nth-child(2n) { background: var(--c2); }
.sw-spark i:nth-child(1) { transform: translate(-20px, -12px); } .sw-spark i:nth-child(2) { transform: translate(18px, -16px); } .sw-spark i:nth-child(3) { transform: translate(22px, 10px); }
.sw-spark i:nth-child(4) { transform: translate(-16px, 16px); } .sw-spark i:nth-child(5) { transform: translate(0, -24px); } .sw-spark i:nth-child(6) { transform: translate(2px, 22px); }
.sw-spark.sp-ring i { background: none; border: 2px solid var(--c1); }
.sw-spark.sp-ring i:nth-child(n + 2) { display: none; }
.sw-spark.sp-ring i:first-child { transform: none; width: 34px; height: 34px; margin: -17px; }
.sw-spark.sp-stars i, .sw-spark.sp-flakes i { border-radius: 2px; transform-origin: center; }
.sw-spark.sp-stars i { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); width: 14px; height: 14px; margin: -7px; }
.sw-spark.sp-bubbles i { background: transparent; border: 2px solid var(--c1); width: 12px; height: 12px; }
.sw-spark.sp-bolts i { border-radius: 1px; width: 3px; height: 18px; box-shadow: 0 0 8px var(--c1); }
/* ── page and link styles from the Shop (race reader and preview) ── */
.pg-on { --paper: var(--pg-bg); --ink: var(--pg-fg); --ink-2: var(--pg-fg); --muted: var(--pg-muted); --line: var(--pg-line); --line-2: var(--pg-line); --field: var(--pg-card); --card: var(--pg-card);
  --paper-2: var(--pg-soft); --accent: var(--pg-link); --accent-soft: var(--pg-soft); --edge: var(--pg-line); --target-soft: var(--pg-soft); background-color: var(--pg-bg); color: var(--pg-fg); }
.pg-on .art-title, .pg-on .article h2, .pg-on .article h3, .pg-on .article h4 { color: var(--pg-head); }
.pg-on .article .infobox, .pg-on .article .wikitable, .pg-on .article .navbox { color: var(--pg-fg); }
.pg-galactica { background-image: radial-gradient(1.2px 1.2px at 12% 18%, rgba(255, 255, 255, 0.8), transparent), radial-gradient(1px 1px at 62% 34%, rgba(255, 255, 255, 0.7), transparent),
  radial-gradient(1.4px 1.4px at 82% 74%, rgba(255, 220, 255, 0.8), transparent), radial-gradient(1px 1px at 32% 82%, rgba(255, 255, 255, 0.6), transparent); background-size: 340px 340px; }
.pg-royal .art-title { text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.lk-highlighter a.wl { color: inherit !important; background-image: linear-gradient(transparent 56%, #ffe56a 56%, #ffe56a 92%, transparent 92%) !important; background-size: 100% 100% !important; }
.pg-on.lk-highlighter a.wl, .dark .lk-highlighter a.wl { background-image: linear-gradient(transparent 56%, rgba(255, 229, 106, 0.45) 56%, rgba(255, 229, 106, 0.45) 92%, transparent 92%) !important; }
.lk-redpen a.wl { color: #c62828 !important; text-decoration: underline double; text-decoration-color: rgba(198, 40, 40, 0.6); text-underline-offset: 3px; }
.dark .lk-redpen a.wl, .pg-midnight.lk-redpen a.wl, .pg-galactica.lk-redpen a.wl, .pg-gilded.lk-redpen a.wl, .pg-blueprint.lk-redpen a.wl, .pg-royal.lk-redpen a.wl { color: #ff7a7a !important; }
.lk-mint a.wl { color: #0f8a68 !important; box-shadow: inset 0 -2px 0 #9ee6cc; }
.dark .lk-mint a.wl, .pg-midnight.lk-mint a.wl, .pg-galactica.lk-mint a.wl, .pg-gilded.lk-mint a.wl, .pg-blueprint.lk-mint a.wl, .pg-royal.lk-mint a.wl { color: #5ff0c0 !important; box-shadow: inset 0 -2px 0 rgba(95, 240, 192, 0.4); }
.lk-neon a.wl { color: #ff2fd8 !important; text-shadow: 0 0 6px rgba(255, 47, 216, 0.6), 0 0 14px rgba(255, 47, 216, 0.3); }
.lk-rainbow a.wl, .lk-diamond a.wl { color: transparent !important; -webkit-background-clip: text !important; background-clip: text !important; font-weight: 600; animation: lk-slide 4s linear infinite;
  background-image: linear-gradient(90deg, #ff3d3d, #ff9f1c, #ffd23f, #2ec27e, #1d8bff, #8a4dff, #ff3d3d) !important; background-size: 300% 100% !important; }
.lk-diamond a.wl { background-image: linear-gradient(90deg, #3b82f6, #7fd8ff, #1e3a8a, #7fd8ff, #3b82f6) !important; animation-duration: 3s; }
.dark .lk-diamond a.wl, .pg-on.lk-diamond a.wl { background-image: linear-gradient(90deg, #7fd8ff, #e9fbff, #3b82f6, #e9fbff, #7fd8ff) !important; }
.lk-rainbow a.wl:hover, .lk-diamond a.wl:hover { filter: brightness(1.25); }
@keyframes lk-slide { to { background-position: 300% 0; } }
/* ── coins on the results card ── */
.rw-box { display: grid; gap: 6px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--edge); background: var(--target-soft); }
.rw-total { font: 400 40px/1 var(--display); color: var(--ink); }
.rw-lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 14px; }
.rw-lines li { display: flex; justify-content: space-between; gap: 12px; }
.rw-lines li span { display: inline-flex; align-items: center; gap: 4px; }
.rw-lines b { font-variant-numeric: tabular-nums; }
.rw-note { margin: 0; font-size: 14px; color: var(--muted); }
.rw-box .btn { justify-self: start; }
@media (prefers-reduced-motion: reduce) {
  .logo .l2, .logo .by, .mode-icon, .acct-alert, .home .btn.red, .lk-rainbow a.wl, .lk-diamond a.wl { animation: none !important; }
  .title-panel, .daily-card2 { animation: none; }
}
/* long page names on the race board never push the click count off the edge */
.brow .bclicks { flex: none; }
.brow .st { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-head { flex-wrap: wrap; }
/* tall windows: the daily card docks under the cards, the rules box gives way */
.stage.tall .logo { font-size: 112px; }
.stage.tall .how { display: none; }
.stage.tall .daily-card2 { top: 1046px; bottom: 58px; grid-auto-rows: min-content; align-content: start; row-gap: 10px; padding: 22px 24px; }
.stage.tall .daily-card2 .dc-body { grid-row: 2 / span 3; }
.stage.tall .daily-card2 .dc-friends { grid-row: 1 / span 2; }
.stage.tall .daily-card2 .btn.big { grid-row: 3; margin-top: 0; }
.stage.tall .daily-card2 .dc-note { grid-row: 4; }
.stage.tall .daily-card2 .dc-route .rchip { font-size: 21px; }
.stage.tall .daily-card2 .lb-row { font-size: 17px; }
.daily-card2 .rchip { white-space: normal; max-width: 100%; text-align: left; line-height: 1.2; }
